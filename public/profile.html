<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AsyrofOTP</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        /* ===== PROFILE-SPECIFIC ===== */

        /* Profile hero */
        .profile-hero {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
            border: 3px solid var(--border-dark);
            box-shadow: var(--shadow-hard);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 2.2rem;
            flex-shrink: 0;
            text-shadow: 2px 2px 0px rgba(15, 23, 42, 0.4);
            transition: all var(--transition);
        }

        .profile-avatar:hover {
            transform: rotate(5deg) scale(1.05);
            box-shadow: var(--shadow-hard-lg);
        }

        .profile-meta {
            flex: 1;
            min-width: 200px;
        }

        .profile-meta h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            font-family: var(--font-display);
        }

        .profile-meta .username {
            color: var(--text-gray);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .user-code-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-hard-sm);
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all var(--transition);
        }

        .user-code-badge:hover {
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-hard);
        }

        .user-code-badge .icon-svg {
            width: 14px;
            height: 14px;
        }

        /* Info rows */
        .info-list {
            display: flex;
            flex-direction: column;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            flex-wrap: wrap;
            transition: all var(--transition-fast);
        }

        .info-row:last-child { border-bottom: none; }

        .info-row:hover {
            padding-left: 8px;
        }

        .info-row-label {
            font-size: 0.85rem;
            color: var(--text-gray);
            font-weight: 600;
        }

        .info-row-value {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        /* Action buttons row */
        .action-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px;
            background: var(--bg-light);
            border: 2px solid var(--border-dark);
            border-radius: var(--radius);
            box-shadow: var(--shadow-hard-sm);
            cursor: pointer;
            transition: all var(--transition);
            text-align: left;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .action-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .action-btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: var(--shadow-hard);
            background: white;
        }

        .action-btn .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--primary-light);
            border: 2px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
            transition: all var(--transition);
            position: relative;
            z-index: 1;
        }

        .action-btn:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        .action-btn .icon-box.danger {
            background: #fee2e2;
            color: var(--danger);
        }

        .action-btn .icon-box .icon-svg {
            width: 20px;
            height: 20px;
        }

        .action-btn-text {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .action-btn-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-dark);
            margin-bottom: 2px;
            font-family: var(--font-display);
        }

        .action-btn-desc {
            font-size: 0.78rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* Password input wrapper */
        .password-wrapper {
            position: relative;
        }

        .password-wrapper .form-control {
            padding-right: 48px;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-gray);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color var(--transition);
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .password-toggle .icon-svg {
            width: 20px;
            height: 20px;
        }

        /* Modal tweaks */
        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--primary-light);
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-hard-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            margin: 0 auto 16px;
            animation: float 3s ease-in-out infinite;
        }

        .modal-icon .icon-svg {
            width: 26px;
            height: 26px;
        }

        .modal h2 {
            text-align: center;
            margin-bottom: 6px;
            font-family: var(--font-display);
        }

        .modal .modal-subtitle {
            text-align: center;
            color: var(--text-gray);
            font-size: 0.85rem;
            margin-bottom: 24px;
        }

        /* ===== SPINNER / SKELETON ===== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(15, 23, 42, 0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .loading-spinner-sm {
            width: 14px;
            height: 14px;
            border-width: 2px;
        }

        .loading-spinner-lg {
            width: 32px;
            height: 32px;
            border-width: 3px;
        }

        .loading-inline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            font-size: 0.85rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Skeleton block */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            display: inline-block;
        }

        .skeleton-text {
            height: 16px;
            width: 100px;
        }

        .skeleton-text-sm {
            height: 12px;
            width: 80px;
        }

        .skeleton-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Page loading state — biar transisi lebih smooth */
        .page-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            flex-direction: column;
            gap: 16px;
            color: var(--text-gray);
        }

        .page-loading .loading-spinner {
            width: 40px;
            height: 40px;
            border-width: 3px;
        }

        .page-loading-text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .action-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-layout">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/dashboard" class="sidebar-logo">
                <div class="logo-icon">A</div>

        </div>

        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
            <a href="/nokos" class="nav-item">

            <a href="/deposit" class="nav-item">

            <div class="nav-section-label">Akun</div>
            <a href="/profile" class="nav-item active">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

        <div class="sidebar-footer">
            <div class="user-info">

                    <span class="loading-spinner loading-spinner-sm"></span>
                </div>
                <div class="user-details">
                    <div class="user-name" id="userName">
                        <span class="skeleton skeleton-text-sm"></span>
                    </div>
                    <div class="user-balance" id="userBalance">
                        <span class="skeleton skeleton-text-sm"></span>
                    </div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Keluar">

                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>

            </div>
        </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <!-- ===== MAIN ===== -->
    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <h1>Profile</h1>
                <p>Kelola akun kamu</p>
            </div>
            <div class="topbar-right">
                <button class="mobile-toggle">
                    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </div>

        <!-- PROFILE HERO -->
        <div class="card card-gradient card-corner">
            <div class="profile-hero">
                <div class="profile-avatar" id="profileAvatar">
                    <span class="loading-spinner loading-spinner-lg"></span>
                </div>
                <div class="profile-meta">
                    <h2 id="profileName">
                        <span class="skeleton skeleton-text" style="width: 150px; height: 24px;"></span>
                    </h2>
                    <div class="username" id="profileUsername">
                        <span class="skeleton skeleton-text-sm" style="width: 120px;"></span>
                    </div>

        <!-- INFO -->

                <div class="info-row">
                    <span class="info-row-label">Saldo</span>

    </main>

<!-- ===== MODAL: EDIT NAMA ===== -->

                <button type="button" class="btn btn-block" data-modal-close>Batal</button>

</div>

<!-- ===== MODAL: GANTI PASSWORD ===== -->
<div class="modal-overlay" id="modalPassword">
    <div class="modal">
        <div class="modal-icon">

                        <svg class="icon-svg eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>

                        <svg class="icon-svg eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Konfirmasi Password Baru</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="inputNewPassword2" placeholder="Ulangi password baru" required>
                    <button type="button" class="password-toggle" data-toggle="inputNewPassword2">
                        <svg class="icon-svg eye-open" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="icon-svg eye-closed" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>
            <div style="display:flex;gap:10px;">
                <button type="button" class="btn btn-block" data-modal-close>Batal</button>
                <button type="submit" class="btn btn-primary btn-block" id="btnSavePassword">
                    <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                    Simpan
                </button>
            </div>
        </form>
    </div>
</div>

<script src="/js/cache.js"></script>
<script>
    // ===== HELPERS =====
    function formatRupiah(angka) {
        if (!angka) return 'Rp0';
        return 'Rp' + Number(angka).toLocaleString('id-ID');
    }

    function getInitial(name) {
        return name ? name.charAt(0).toUpperCase() : '?';
    }

    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/login';

    // ===== LOAD USER (SWR) =====
    swrFetch('/api/user', 'user_profile', (user, meta) => {
        if (!user) return;

        // Sidebar
        document.getElementById('userName').textContent = user.name || user.username;
        document.getElementById('userBalance').textContent = formatRupiah(user.balance);
        document.getElementById('userInitial').textContent = getInitial(user.name || user.username);

        // Profile hero
        document.getElementById('profileAvatar').textContent = getInitial(user.name || user.username);
        document.getElementById('profileName').textContent = user.name || user.username;
        document.getElementById('profileUsername').textContent = '@' + user.username;
        document.getElementById('inputName').value = user.name || '';

        // Info list
        document.getElementById('infoUsername').textContent = '@' + user.username;
        document.getElementById('infoName').textContent = user.name || '—';
        document.getElementById('infoBalance').textContent = formatRupiah(user.balance);

        if (user.user_code) {
            document.getElementById('profileCodeBadge').style.display = 'inline-flex';
            document.getElementById('profileCodeText').textContent = user.user_code;
            document.getElementById('infoUserCode').textContent = user.user_code;
        }
    });

    // ===== MODAL OPEN/CLOSE =====
    function openModal(id) {
        document.getElementById(id).classList.add('active');
    }

    function closeModal(el) {
        el.classList.remove('active');
    }

    document.getElementById('btnEditName').addEventListener('click', () => openModal('modalName'));
    document.getElementById('btnChangePassword').addEventListener('click', () => openModal('modalPassword'));

    document.querySelectorAll('[data-modal-close]').forEach(btn => {
        btn.addEventListener('click', () => {
            const modal = btn.closest('.modal-overlay');
            if (modal) closeModal(modal);
        });
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal(overlay);
        });
    });

    // ===== PASSWORD TOGGLE (EYE) =====
    document.querySelectorAll('.password-toggle').forEach(btn => {
        btn.addEventListener('click', () => {
            const inputId = btn.dataset.toggle;
            const input = document.getElementById(inputId);
            const eyeOpen = btn.querySelector('.eye-open');
            const eyeClosed = btn.querySelector('.eye-closed');

            if (input.type === 'password') {
                input.type = 'text';
                eyeOpen.style.display = 'none';
                eyeClosed.style.display = 'block';
            } else {
                input.type = 'password';
                eyeOpen.style.display = 'block';
                eyeClosed.style.display = 'none';
            }
        });
    });

    function showAlert(id, message, type = 'error') {
        const el = document.getElementById(id);
        el.className = 'alert show ' + type;
        document.getElementById(id + 'Text').textContent = message;
    }

    function hideAlert(id) {
        document.getElementById(id).classList.remove('show');
    }

    // ===== SAVE NAME =====
    document.getElementById('formName').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert('alertName');
        const name = document.getElementById('inputName').value.trim();
        const btn = document.getElementById('btnSaveName');
        const original = btn.innerHTML;

        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner loading-spinner-sm"></span> Menyimpan...';

        try {
            const res = await fetch('/api/user/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error);

            showAlert('alertName', 'Nama berhasil diupdate!', 'success');

            // Update UI
            document.getElementById('profileName').textContent = name;
            document.getElementById('infoName').textContent = name;
            document.getElementById('userName').textContent = name;
            document.getElementById('profileAvatar').textContent = getInitial(name);
            document.getElementById('userInitial').textContent = getInitial(name);

            // Hapus cache user biar next load ambil fresh
            CacheManager.remove('user_profile');

            setTimeout(() => {
                closeModal(document.getElementById('modalName'));
                hideAlert('alertName');
            }, 1000);
        } catch (err) {
            showAlert('alertName', err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    });

    // ===== SAVE PASSWORD =====
    document.getElementById('formPassword').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert('alertPassword');

        const current_password = document.getElementById('inputOldPassword').value;
        const new_password = document.getElementById('inputNewPassword').value;
        const new_password2 = document.getElementById('inputNewPassword2').value;
        const btn = document.getElementById('btnSavePassword');
        const original = btn.innerHTML;

        if (new_password !== new_password2) {
            showAlert('alertPassword', 'Konfirmasi password tidak cocok', 'error');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner loading-spinner-sm"></span> Menyimpan...';

        try {
            const res = await fetch('/api/user/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ current_password, new_password })
            });

            const data = await res.json();
            if (data.error) throw new Error(data.error);

            showAlert('alertPassword', 'Password berhasil diubah!', 'success');
            document.getElementById('formPassword').reset();

            // Hapus cache user
            CacheManager.remove('user_profile');

            setTimeout(() => {
                closeModal(document.getElementById('modalPassword'));
                hideAlert('alertPassword');
            }, 1200);
        } catch (err) {
            showAlert('alertPassword', err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = original;
        }
    });

    // ===== COPY USER CODE =====
    document.getElementById('profileCodeBadge').addEventListener('click', () => {
        const code = document.getElementById('profileCodeText').textContent;
        navigator.clipboard.writeText(code).then(() => {
            const badge = document.getElementById('profileCodeBadge');
            const original = badge.innerHTML;
            badge.innerHTML = '✓ Copied!';
            setTimeout(() => badge.innerHTML = original, 1200);
        });
    });

    // ===== LOGOUT =====
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch (err) {}

        CacheManager.clear();
        localStorage.removeItem('access_token');
        localStorage.removeItem('user');

        window.location.href = '/landing';
    });

    // ===== MOBILE SIDEBAR =====
    const mobileToggle = document.querySelector('.mobile-toggle');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    if (mobileToggle) {
        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });
    }
</script>

</body>
</html>
