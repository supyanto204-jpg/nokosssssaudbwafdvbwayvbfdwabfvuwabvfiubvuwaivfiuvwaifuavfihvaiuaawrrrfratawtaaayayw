<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AsyrofOTP</title>
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
            border: 3px solid var(--border-dark);
            box-shadow: var(--shadow-hard);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 2rem;
            flex-shrink: 0;
        }

        .profile-info h2 {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .profile-info .username {
            color: var(--text-gray);
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .profile-info .user-code-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            border: 2px solid var(--border-dark);
            font-family: 'Courier New', monospace;
        }

        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            box-shadow: var(--shadow-hard-sm);
            transform: translate(-1px, -1px);
        }

        .alert {
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-hard-sm);
            margin-bottom: 20px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .alert.show { display: flex; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }

        .alert .icon-svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: 2px solid var(--border-dark);
            box-shadow: var(--shadow-hard-sm);
            transition: all 0.2s;
            background: var(--primary);
            color: white;
            text-decoration: none;
        }

        .btn:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-hard); background: var(--primary-dark); }
        .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px rgba(15, 23, 42, 1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .icon-svg {
            width: 18px; height: 18px;
            fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
    </style>
</head>
<body>

<div class="dashboard-layout">

    <!-- SIDEBAR (sama kayak dashboard) -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="/dashboard" class="sidebar-logo">
                <div class="logo-icon">A</div>
                <div>Asyrof<span>OTP</span></div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Home
            </a>
            <a href="/nokos" class="nav-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                Beli Nokos
            </a>
            <a href="/inbox" class="nav-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                Inbox
            </a>
            <a href="/deposit" class="nav-item">
                <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                Deposit
            </a>
            <div class="nav-section-label">Akun</div>
            <a href="/profile" class="nav-item active">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Profile
            </a>
            <a href="#" class="nav-item" id="logoutBtn">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Keluar
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userInitial">?</div>
                <div class="user-details">
                    <div class="user-name" id="userName">—</div>
                    <div class="user-balance" id="userBalance">—</div>
                </div>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <!-- MAIN -->
    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <h1>Profile</h1>
                <p>Kelola akun kamu</p>
            </div>
            <div class="topbar-right">
                <button class="mobile-toggle">
                    <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
            </div>
        </div>

        <!-- PROFILE HEADER -->
        <div class="card">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">?</div>
                <div class="profile-info">
                    <h2 id="profileName">Memuat...</h2>
                    <div class="username" id="profileUsername">@—</div>
                    <div class="user-code-pill" id="profileCode" style="display:none;">
                        <svg class="icon-svg" viewBox="0 0 24 24" style="width:14px;height:14px;"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6v6H9z"/></svg>
                        <span id="profileCodeText">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- EDIT NAMA -->
        <div class="card">
            <div class="card-header">
                <h2>Edit Profil</h2>
            </div>

            <div class="alert" id="alertName">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span id="alertNameText"></span>
            </div>

            <form id="formName">
                <div class="form-group">
                    <label class="form-label">Nama Tampilan</label>
                    <input type="text" class="form-control" id="inputName" placeholder="Nama kamu" required>
                </div>
                <button type="submit" class="btn" id="btnSaveName">
                    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    Simpan Nama
                </button>
            </form>
        </div>

        <!-- GANTI PASSWORD -->
        <div class="card">
            <div class="card-header">
                <h2>Ganti Password</h2>
            </div>

            <div class="alert" id="alertPassword">
                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                <span id="alertPasswordText"></span>
            </div>

            <form id="formPassword">
                <div class="form-group">
                    <label class="form-label">Password Lama</label>
                    <input type="password" class="form-control" id="inputOldPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password Baru</label>
                    <input type="password" class="form-control" id="inputNewPassword" placeholder="Minimal 6 karakter" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Konfirmasi Password Baru</label>
                    <input type="password" class="form-control" id="inputNewPassword2" placeholder="Ulangi password baru" required>
                </div>
                <button type="submit" class="btn" id="btnSavePassword">
                    <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Ganti Password
                </button>
            </form>
        </div>
    </main>
</div>

<script>
    function formatRupiah(angka) {
        if (!angka) return 'Rp0';
        return 'Rp' + Number(angka).toLocaleString('id-ID');
    }

    function getInitial(name) {
        return name ? name.charAt(0).toUpperCase() : '?';
    }

    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/login';

    async function apiFetch(url, options = {}) {
        const res = await fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                ...(options.headers || {})
            }
        });

        if (res.status === 401) {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
            throw new Error('Unauthorized');
        }

        return res.json();
    }

    function showAlert(id, message, type = 'error') {
        const el = document.getElementById(id);
        el.className = 'alert show ' + type;
        document.getElementById(id + 'Text').textContent = message;
    }

    // ===== LOAD USER =====
    (async () => {
        try {
            const user = await apiFetch('/api/user');

            document.getElementById('userName').textContent = user.name || user.username;
            document.getElementById('userBalance').textContent = formatRupiah(user.balance);
            document.getElementById('userInitial').textContent = getInitial(user.name || user.username);
            document.getElementById('profileAvatar').textContent = getInitial(user.name || user.username);
            document.getElementById('profileName').textContent = user.name || user.username;
            document.getElementById('profileUsername').textContent = '@' + user.username;
            document.getElementById('inputName').value = user.name || '';

            if (user.user_code) {
                document.getElementById('profileCode').style.display = 'inline-flex';
                document.getElementById('profileCodeText').textContent = user.user_code;
            }
        } catch (err) {
            console.error(err);
        }
    })();

    // ===== SAVE NAME =====
    document.getElementById('formName').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('inputName').value.trim();

        try {
            const res = await apiFetch('/api/user/update', {
                method: 'POST',
                body: JSON.stringify({ name })
            });

            if (res.error) throw new Error(res.error);

            showAlert('alertName', 'Nama berhasil diupdate!', 'success');
            document.getElementById('profileName').textContent = name;
            document.getElementById('userName').textContent = name;
            document.getElementById('profileAvatar').textContent = getInitial(name);
        } catch (err) {
            showAlert('alertName', err.message, 'error');
        }
    });

    // ===== SAVE PASSWORD =====
    document.getElementById('formPassword').addEventListener('submit', async (e) => {
        e.preventDefault();

        const current_password = document.getElementById('inputOldPassword').value;
        const new_password = document.getElementById('inputNewPassword').value;
        const new_password2 = document.getElementById('inputNewPassword2').value;

        if (new_password !== new_password2) {
            showAlert('alertPassword', 'Konfirmasi password tidak cocok', 'error');
            return;
        }

        try {
            const res = await apiFetch('/api/user/change-password', {
                method: 'POST',
                body: JSON.stringify({ current_password, new_password })
            });

            if (res.error) throw new Error(res.error);

            showAlert('alertPassword', 'Password berhasil diubah!', 'success');
            document.getElementById('formPassword').reset();
        } catch (err) {
            showAlert('alertPassword', err.message, 'error');
        }
    });

    // ===== LOGOUT =====
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await apiFetch('/api/auth/logout', { method: 'POST' });
        } catch (err) {}
        localStorage.removeItem('access_token');
        localStorage.removeItem('user');
        window.location.href = '/landing';
    });

    // ===== MOBILE SIDEBAR =====
    const mobileToggle = document.querySelector('.mobile-toggle');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.querySelector('.sidebar-overlay');

    if (mobileToggle) {
        mobileToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        });
    }
</script>

</body>
</html>
