<svg width="512" height="512" viewBox="0 0 512 512"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0B3D91"/>

  <!-- Retro stripes -->
  <path d="M0 105H512V145H0Z" fill="#1558B0"/>
  <path d="M0 175H512V200H0Z" fill="#2E78C7"/>
  <path d="M0 312H512V340H0Z" fill="#1558B0"/>
  <path d="M0 365H512V410H0Z" fill="#0A347A"/>

  <!-- Inner retro border -->
  <rect x="24" y="24" width="464" height="464"
        rx="78"
        fill="none"
        stroke="#9ED8FF"
        stroke-width="8"/>

  <!-- A shadow -->
  <text x="256" y="375"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="310"
        font-weight="900"
        font-style="italic"
        fill="#06265C"
        transform="translate(14 18)">
    A
  </text>

  <!-- Main A -->
  <text x="256" y="375"
        text-anchor="middle"
        font-family="Arial Black, Impact, sans-serif"
        font-size="310"
        font-weight="900"
        font-style="italic"
        fill="#F4F0D7"
        stroke="#082F72"
