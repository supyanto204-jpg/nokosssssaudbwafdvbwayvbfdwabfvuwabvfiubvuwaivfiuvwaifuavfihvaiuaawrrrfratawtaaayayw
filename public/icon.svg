
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <title>Blue Cat Mascot</title>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#0879F9"/>

  <!-- Tail -->
  <path d="M339 350
           C414 385 439 328 404 301
           C386 287 365 301 375 317
           C381 328 396 325 400 315"
        fill="none"
        stroke="#101318"
        stroke-width="30"
        stroke-linecap="round"/>

  <!-- Ears -->
  <path d="M128 191 L111 83 L213 158 Z"
        fill="#101318"
        stroke="#101318"
        stroke-width="8"
        stroke-linejoin="round"/>

  <path d="M384 191 L401 83 L299 158 Z"
        fill="#101318"
        stroke="#101318"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Inner ears -->
  <path d="M142 153 L132 112 L174 151 Z" fill="#FFFFFF"/>
  <path d="M370 153 L380 112 L338 151 Z" fill="#FFFFFF"/>

  <!-- Cat head -->
  <path d="M128 179
           Q128 153 157 153
           L193 168
           Q256 140 319 168
           L355 153
           Q384 153 384 179
           L397 271
           Q400 337 343 370
           Q303 394 256 394
           Q209 394 169 370
           Q112 337 115 271 Z"
        fill="#101318"
        stroke="#101318"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- Face markings -->
  <path d="M153 207 Q170 190 193 196"
        fill="none"
        stroke="#0879F9"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Eyes -->
  <path d="M155 245
           Q183 216 215 246
           Q187 274 155 245 Z"
        fill="#FFFFFF"/>

  <path d="M297 246
           Q329 216 357 245
           Q325 274 297 246 Z"
        fill="#FFFFFF"/>

  <!-- Blue pupils -->
  <ellipse cx="189" cy="246" rx="9" ry="14" fill="#0879F9"/>
  <ellipse cx="323" cy="246" rx="9" ry="14" fill="#0879F9"/>

  <!-- Eye highlights -->
  <circle cx="192" cy="241" r="4" fill="#FFFFFF"/>
  <circle cx="326" cy="241" r="4" fill="#FFFFFF"/>

  <!-- Muzzle -->
  <path d="M217 277
           Q236 265 256 280
           Q276 265 295 277
           Q285 305 256 308
           Q227 305 217 277 Z"
        fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M246 280 L266 280 L256 291 Z"
        fill="#0879F9"/>

  <!-- Mouth -->
  <path d="M256 291 V300
           M256 300 Q246 312 235 301
           M256 300 Q266 312 277 301"
        fill="none"
        stroke="#101318"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Whiskers -->
  <g fill="none"
     stroke="#FFFFFF"
     stroke-width="4"
     stroke-linecap="round">
    <path d="M205 288 L159 280"/>
    <path d="M205 301 L164 307"/>
    <path d="M307 288 L353 280"/>
    <path d="M307 301 L348 307"/>
  </g>

  <!-- Neck detail -->
  <path d="M190 359
           Q256 386 322 359
           L310 393
           Q256 416 202 393 Z"
        fill="#FFFFFF"/>

  <!-- Blue emblem -->
  <path d="M237 373 L256 390 L275 373"
        fill="none"
        stroke="#0879F9"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Blue accent -->
  <circle cx="357" cy="184" r="8" fill="#FFFFFF"/>

</svg>
