    <circle cx="450" cy="92" r="3"/>
    <circle cx="73" cy="430" r="2"/>
    <circle cx="447" cy="435" r="3"/>
    <circle cx="380" cy="62" r="2"/>
    <circle cx="135" cy="455" r="2"/>
