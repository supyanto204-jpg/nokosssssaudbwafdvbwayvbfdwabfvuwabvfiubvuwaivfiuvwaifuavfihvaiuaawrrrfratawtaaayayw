<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>Inbox - AsyrofOTP</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <script>
        (function() {
            const theme = localStorage.getItem('asyrofotp_theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .dashboard-layout, .dashboard-layout * {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-touch-callout: none;
        }
        .dashboard-layout input, .dashboard-layout textarea, .dashboard-layout select, .dashboard-layout code {
            -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text;
        }

        /* ===== HERO ===== */
        .inbox-hero {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .inbox-hero-icon {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--purple), var(--primary-dark));
            border: 2px solid var(--border-dark);
            display: flex; align-items: center; justify-content: center;
            color: white;
            box-shadow: var(--shadow-hard-sm);
            flex-shrink: 0;
            animation: iconPulse 3s ease-in-out infinite;
        }
        .inbox-hero-icon .icon-svg { width: 28px; height: 28px; }
        .inbox-hero-text h1 {
            font-size: 1.8rem; font-weight: 900;
            font-family: var(--font-display);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--purple), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .inbox-hero-text p {
            color: var(--text-gray);
            font-size: 0.88rem;
            max-width: 560px;
        }

        /* ===== TABS ===== */
        .inbox-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            background: var(--bg-light);
            padding: 5px;
            border-radius: 50px;
            border: 2px solid var(--border-dark);
            width: fit-content;
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .inbox-tabs::-webkit-scrollbar { display: none; }
        .inbox-tab {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-gray);
            white-space: nowrap;
            transition: all var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            font-family: var(--font-body);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .inbox-tab:hover {
            color: var(--primary);
            transform: translateY(-1px);
        }
        .inbox-tab.active {
            background: var(--bg-white);
            color: var(--primary);
            box-shadow: var(--shadow-hard-sm);
            border: 2px solid var(--border-dark);
        }
        .inbox-tab .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 50px;
            background: var(--bg-hover);
            color: var(--text-gray);
            font-size: 0.62rem;
            font-weight: 800;
            font-family: var(--font-mono);
        }
        .inbox-tab.active .tab-count {
            background: var(--primary);
            color: white;
        }

        /* ===== ORDER CARD ===== */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .order-card {
            background: var(--bg-card);
            border: 2px solid var(--border-dark);
            border-radius: var(--radius);
            box-shadow: var(--shadow-hard-sm);
            padding: 18px;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }
        .order-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 4px; height: 100%;
            background: var(--primary);
        }
        .order-card.success::before { background: var(--success); }
        .order-card.pending::before { background: var(--warning); }
        .order-card.expired::before { background: #64748b; }
        .order-card.failed::before { background: var(--danger); }
        .order-card.cancelled::before { background: var(--danger); }
        .order-card.refunded::before { background: var(--purple); }

        [data-theme="dark"] .order-card.expired::before { background: #94a3b8; }

        .order-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-hard);
        }

        .order-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border);
            flex-wrap: wrap;
        }
        .order-flag {
            width: 32px; height: 24px;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .order-title-wrap { flex: 1; min-width: 0; }
        .order-title {
            font-weight: 800;
            font-size: 0.95rem;
            font-family: var(--font-display);
            color: var(--text-dark);
            margin-bottom: 2px;
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .order-ref {
            font-size: 0.7rem;
            font-family: var(--font-mono);
            color: var(--text-gray);
            word-break: break-all;
        }
        .order-ref .otp-id {
            color: var(--primary);
            font-weight: 800;
        }
        .order-status-badge { flex-shrink: 0; }

        /* ===== COUNTDOWN ===== */
        .order-countdown {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 50px;
            background: var(--warning-light);
            border: 1.5px solid var(--warning-dark);
            font-family: var(--font-mono);
            font-weight: 800;
            font-size: 0.72rem;
            color: var(--warning-dark);
            margin-top: 4px;
        }
        [data-theme="dark"] .order-countdown {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
            border-color: var(--warning);
        }
        .order-countdown.expired {
            background: linear-gradient(135deg, #334155, #475569);
            color: white;
            border-color: var(--text-dark);
        }
        .order-countdown .icon-svg { width: 12px; height: 12px; }

        /* ===== ORDER BODY ===== */
        .order-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .order-field { display: flex; flex-direction: column; gap: 2px; }
        .order-field-label {
            font-size: 0.68rem;
            font-weight: 700;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-gray);
        }
        .order-field-value {
            font-weight: 700;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            color: var(--text-dark);
            word-break: break-all;
        }
        .order-field-value.price { color: var(--primary); }
        .order-field-value.success { color: var(--success); }
        .order-field-value.refunded { color: var(--purple); font-weight: 800; }

        /* ===== OTP BOX ===== */
        .otp-box {
            background: var(--success-light);
            border: 2px solid var(--success-dark);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: bounceIn 0.5s var(--ease-bounce);
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .otp-box {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
        }
        .otp-box::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: glowPulse 3s ease-in-out infinite;
        }
        .otp-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--success);
            color: white;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            border: 2px solid var(--border-dark);
            position: relative;
            z-index: 1;
        }
        .otp-icon .icon-svg { width: 20px; height: 20px; }
        .otp-info { flex: 1; min-width: 0; position: relative; z-index: 1; }
        .otp-info-label {
            font-size: 0.68rem;
            font-weight: 700;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--success-dark);
            margin-bottom: 2px;
        }
        .otp-info-value {
            font-size: 1.5rem;
            font-weight: 900;
            font-family: var(--font-mono);
            color: var(--success-dark);
            letter-spacing: 0.15em;
            word-break: break-all;
        }
        [data-theme="dark"] .otp-info-value { color: var(--success); }
        .otp-copy {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--bg-white);
            border: 2px solid var(--border-dark);
            color: var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .otp-copy:hover {
            background: var(--success);
            color: white;
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-hard-sm);
        }
        .otp-copy .icon-svg { width: 18px; height: 18px; }

        /* ===== REFUND BOX ===== */
        .refund-box {
            background: var(--purple-light);
            border: 2px solid var(--purple);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        [data-theme="dark"] .refund-box {
            background: rgba(167, 139, 250, 0.15);
        }
        .refund-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: var(--purple);
            color: white;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            border: 2px solid var(--border-dark);
        }
        .refund-icon .icon-svg { width: 20px; height: 20px; }
        .refund-info { flex: 1; min-width: 0; }
        .refund-info-label {
            font-size: 0.68rem;
            font-weight: 700;
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--purple);
            margin-bottom: 2px;
        }
        .refund-info-value {
            font-size: 1.15rem;
            font-weight: 900;
            font-family: var(--font-mono);
            color: var(--purple);
            letter-spacing: -0.02em;
        }
        [data-theme="dark"] .refund-info-value { color: var(--purple); }
        .refund-note {
            font-size: 0.7rem;
            color: var(--text-gray);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        /* ===== PENDING ===== */
        .pending-box {
            background: var(--warning-light);
            border: 2px dashed var(--warning);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--warning-dark);
            font-size: 0.82rem;
            font-weight: 600;
        }
        [data-theme="dark"] .pending-box {
            background: rgba(251, 191, 36, 0.15);
            color: var(--warning);
        }
        .pending-box .loading-spinner {
            width: 18px; height: 18px;
            border-width: 2px;
            border-color: rgba(245, 158, 11, 0.3);
            border-top-color: var(--warning);
        }

        /* ===== ACTIONS ===== */
        .order-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .order-actions .btn {
            flex: 1;
            min-width: 120px;
        }

        /* ===== EMPTY & LOADING ===== */
        .empty-inbox {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            color: var(--text-gray);
        }
        .empty-inbox .icon-box {
            width: 72px; height: 72px;
            margin: 0 auto 16px;
            border-radius: 20px;
            background: var(--primary-light);
            border: 2px solid var(--border-dark);
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            box-shadow: var(--shadow-hard-sm);
            animation: float 3s ease-in-out infinite;
        }
        .empty-inbox .icon-box .icon-svg { width: 32px; height: 32px; }
        .empty-inbox h3 {
            font-size: 1.05rem;
            font-weight: 800;
            font-family: var(--font-display);
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        .empty-inbox p { font-size: 0.85rem; margin-bottom: 16px; }

        .skeleton-order {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
        }
        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, var(--bg-hover) 25%, var(--border) 50%, var(--bg-hover) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        /* ===== PAGINATION ===== */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .page-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 14px;
            border-radius: 50px;
            background: var(--bg-white);
            border: 2px solid var(--border-dark);
            color: var(--text-dark);
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .page-btn:hover:not(:disabled) {
            background: var(--primary);
            color: white;
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-hard-sm);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-info {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--text-gray);
            padding: 0 8px;
        }

        /* ===== FLAG ===== */
        .flag-img {
            width: 32px; height: 24px;
            border-radius: 4px;
            border: 1.5px solid var(--border-dark);
            box-shadow: 1px 1px 0px rgba(15, 23, 42, 0.15);
            object-fit: cover;
            display: block;
            flex-shrink: 0;
            background: var(--bg-light);
        }

        /* ===== SYNC INDICATOR ===== */
        .sync-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 50px;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 0.72rem;
            font-weight: 700;
            font-family: var(--font-mono);
            border: 2px solid var(--primary);
            margin-bottom: 16px;
            animation: fadeIn 0.3s var(--ease);
        }
        .sync-indicator .loading-spinner {
            width: 12px;
            height: 12px;
            border-width: 2px;
            border-color: rgba(37, 99, 235, 0.2);
            border-top-color: var(--primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .inbox-hero-text h1 { font-size: 1.4rem; }
            .inbox-hero-icon { width: 48px; height: 48px; }
            .inbox-hero-icon .icon-svg { width: 24px; height: 24px; }

            .order-card { padding: 14px; }
            .order-body { grid-template-columns: 1fr; gap: 8px; }
            .order-title { font-size: 0.88rem; }
            .otp-info-value { font-size: 1.2rem; }
            .otp-icon { width: 36px; height: 36px; }
            .otp-copy { width: 36px; height: 36px; }
            .refund-icon { width: 36px; height: 36px; }
            .refund-info-value { font-size: 1rem; }

            .order-actions .btn {
                min-width: 100%;
                padding: 8px 12px;
                font-size: 0.78rem;
            }

            .inbox-tab { padding: 6px 12px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            .inbox-hero-text h1 { font-size: 1.2rem; }
            .order-card { padding: 12px; }
            .otp-info-value { font-size: 1.05rem; letter-spacing: 0.1em; }
        }
    </style>
</head>
<body>

<div class="bg-pulse" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="dashboard-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/dashboard" class="sidebar-logo">
                <div class="logo-icon">A</div>
                <div class="logo-text">Asyrof<span>OTP</span></div>
            </a>
            <button class="collapse-btn" id="collapseBtn" title="Collapse sidebar">
                <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item" data-tooltip="Home">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="nav-label">Home</span>
            </a>
            <a href="/nokos" class="nav-item" data-tooltip="Beli Nokos">
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                <span class="nav-label">Beli Nokos</span>
            </a>
            <a href="/inbox" class="nav-item active" data-tooltip="Inbox">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                <span class="nav-label">Inbox</span>
            </a>
            <a href="/deposit" class="nav-item" data-tooltip="Deposit">
                <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span class="nav-label">Deposit</span>
            </a>

            <div class="nav-section-label">Bantuan</div>
            <a href="/ketentuan" class="nav-item" data-tooltip="Ketentuan">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span class="nav-label">Ketentuan</span>
            </a>
            <a href="/syarat" class="nav-item" data-tooltip="Syarat">
                <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span class="nav-label">Syarat</span>
            </a>

            <div class="nav-section-label">Akun</div>
            <a href="/profile" class="nav-item" data-tooltip="Profile">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="nav-label">Profile</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userInitial">
                    <span class="loading-spinner loading-spinner-sm"></span>
                </div>
                <div class="user-details">
                    <div class="user-name" id="userName"><span class="skeleton skeleton-text-sm"></span></div>
                    <div class="user-balance" id="userBalance"><span class="skeleton skeleton-text-sm"></span></div>
                </div>
                <button class="logout-btn" id="logoutBtn" title="Keluar">
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <div class="topbar">
            <div class="topbar-left">
                <h1>Inbox</h1>
                <p>Riwayat pesanan & kode OTP kamu</p>
            </div>
            <div class="topbar-right">
                <button class="icon-btn" id="refreshBtn" title="Refresh" type="button">

            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>

            <button class="btn btn-primary" id="customAlertOk" type="button">OK</button>
        </div>

<script src="/js/main.js"></script>
<script>
    /* ============================================
       INBOX SCRIPT
       ============================================ */
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/login';

    const ICONS = {
        check: `<svg class="icon-svg" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
        close: `<svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
        info: `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
        warning: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
        key: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>`,
        copy: `<svg class="icon-svg" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
        refresh: `<svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
        clock: `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
        coin: `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v12M15 9.5a3 3 0 0 0-3-1.5c-1.66 0-3 .67-3 1.5s1.34 1.5 3 1.5 3 .67 3 1.5-1.34 1.5-3 1.5a3 3 0 0 1-3-1.5"/></svg>`,
    };

    function showCustomAlert({ title, message, type = 'info', okText = 'OK', showCancel = false, cancelText = 'Batal' }) {
        return new Promise((resolve) => {
            const overlay = document.getElementById('customAlert');
            const iconEl = document.getElementById('customAlertIcon');
            const titleEl = document.getElementById('customAlertTitle');
            const msgEl = document.getElementById('customAlertMessage');
            const actionsEl = document.getElementById('customAlertActions');

            iconEl.className = 'custom-alert-icon ' + type;
            iconEl.innerHTML = ICONS[type] || ICONS.info;
            titleEl.textContent = title || 'Informasi';
            msgEl.textContent = message || '';

            actionsEl.innerHTML = '';
            if (showCancel) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn';
                cancelBtn.type = 'button';
                cancelBtn.textContent = cancelText;
                cancelBtn.addEventListener('click', () => {
                    overlay.classList.remove('active');
                    resolve(false);
                });
                actionsEl.appendChild(cancelBtn);
            }

            const okBtn = document.createElement('button');
            okBtn.className = 'btn btn-primary';
            okBtn.type = 'button';
            okBtn.textContent = okText;
            okBtn.addEventListener('click', () => {
                overlay.classList.remove('active');
                resolve(true);
            });
            actionsEl.appendChild(okBtn);

            overlay.classList.add('active');
        });
    }

    /* ===== THEME ===== */
    (function initTheme() {
        const themeToggle = document.getElementById('themeToggle');
        if (!themeToggle) return;
        themeToggle.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('asyrofotp_theme', next);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', next === 'dark' ? '#0f172a' : '#2563eb');
        });
    })();

    /* ===== SIDEBAR ===== */
    (function initCollapse() {
        const sidebar = document.getElementById('sidebar');
        const collapseBtn = document.getElementById('collapseBtn');
        if (!sidebar || !collapseBtn) return;
        if (window.innerWidth <= 768) return;

        const isCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
        if (isCollapsed) {
            sidebar.classList.add('collapsed');
            document.body.classList.add('sidebar-collapsed');
        }

        collapseBtn.addEventListener('click', () => {
            if (window.innerWidth <= 768) return;
            const collapsed = sidebar.classList.toggle('collapsed');
            document.body.classList.toggle('sidebar-collapsed', collapsed);
            localStorage.setItem('sidebar_collapsed', collapsed);
        });
    })();

    (function initMobileSidebar() {
        const mobileToggle = document.getElementById('mobileToggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        if (!mobileToggle || !sidebar) return;

        let isOpen = false;

        function openSidebar() {
            if (isOpen) return;
            isOpen = true;
            sidebar.classList.add('open');
            if (sidebarOverlay) sidebarOverlay.classList.add('active');
            document.body.classList.add('sidebar-open');
            const scrollY = window.scrollY;
            document.body.style.top = `-${scrollY}px`;
        }

        function closeSidebar() {
            if (!isOpen) return;
            isOpen = false;
            sidebar.classList.remove('open');
            if (sidebarOverlay) sidebarOverlay.classList.remove('active');
            document.body.classList.remove('sidebar-open');
            const scrollY = document.body.style.top;
            document.body.style.top = '';
            window.scrollTo(0, parseInt(scrollY || '0') * -1);
        }

        mobileToggle.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (isOpen) closeSidebar(); else openSidebar();
        });

        if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

        sidebar.querySelectorAll('.nav-item').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768 && isOpen) setTimeout(closeSidebar, 100);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isOpen) closeSidebar();
        });

        window.addEventListener('pageshow', () => {
            document.body.style.top = '';
            document.body.classList.remove('sidebar-open');
        });
    })();

    /* ===== FLAG ===== */
    function countryCodeToTwemoji(countryCode) {
        const code = (countryCode || '').toUpperCase();
        if (code.length !== 2) return null;
        return code.split('').map(char => (0x1F1E6 + char.charCodeAt(0) - 65).toString(16)).join('-');
    }

    function getFlagSources(countryCode) {
        const code = (countryCode || '').toLowerCase();
        if (code.length !== 2) return [];
        const twemoji = countryCodeToTwemoji(countryCode);
        return [
            twemoji ? `https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/${twemoji}.svg` : null,
            `https://flagcdn.com/w40/${code}.png`,
            `https://flagcdn.com/w80/${code}.png`,
            `https://cdn.jsdelivr.net/npm/flagpack@latest/flags/4x3/${code}.svg`,
            `https://unpkg.com/country-flag-icons@1.5.7/3x2/${code.toUpperCase()}.svg`,
            `https://flagpedia.net/data/flags/w40/${code}.png`,
        ].filter(Boolean);
    }

    function renderFlag(countryCode, className = 'flag-img') {
        const sources = getFlagSources(countryCode);
        if (sources.length === 0) {
            return `<div class="${className}" style="display:flex;align-items:center;justify-content:center;background:var(--bg-light);color:var(--text-light);font-size:0.7rem;font-weight:800;">${(countryCode || '??').toUpperCase()}</div>`;
        }
        const sourcesAttr = JSON.stringify(sources).replace(/"/g, '&quot;');
        return `<img class="${className}" src="${sources[0]}" alt="${countryCode}" loading="lazy" data-sources="${sourcesAttr}" data-source-idx="0" onerror="handleFlagError(this)">`;
    }

    window.handleFlagError = function(imgEl) {
        try {
            const sources = JSON.parse(imgEl.dataset.sources || '[]');
            const currentIdx = parseInt(imgEl.dataset.sourceIdx || '0', 10);
            const nextIdx = currentIdx + 1;
            if (nextIdx < sources.length) {
                imgEl.dataset.sourceIdx = nextIdx.toString();
                imgEl.src = sources[nextIdx];
            } else {
                const code = (imgEl.alt || '??').toUpperCase();
                const placeholder = document.createElement('div');
                placeholder.className = imgEl.className;
                placeholder.style.cssText = 'display:flex;align-items:center;justify-content:center;background:var(--bg-light);color:var(--text-light);font-size:0.7rem;font-weight:800;';
                placeholder.textContent = code;
                imgEl.replaceWith(placeholder);
            }
        } catch (e) {
            imgEl.style.display = 'none';
        }
    };

    /* ===== STATE ===== */
    let state = {
        status: 'all',
        page: 1,
        limit: 10,
        totalPages: 1,
        refreshInterval: null,
        countdownIntervals: {},
        counts: { all: 0, pending: 0, success: 0, failed: 0, expired: 0, cancelled: 0 },
        refundChecked: false,
    };

    /* ===== CACHE KEY ===== */
    function getCacheKey(page, status) {
        return `inbox_orders_p${page}_s${status}`;
    }

    function getCountsCacheKey() {
        return 'inbox_counts';
    }

    /* ===== LOAD USER ===== */
    swrFetch('/api/user', 'user_profile', (user) => {
        if (!user) return;
        document.getElementById('userName').textContent = user.name || user.username;
        document.getElementById('userBalance').textContent = formatRupiah(user.balance);
        document.getElementById('userInitial').textContent = getInitial(user.name || user.username);
        document.getElementById('balancePill').textContent = formatRupiah(user.balance);
    });

    /* ===== CHECK REFUNDS (auto-refund) ===== */
    async function checkRefunds() {
        const indicator = document.getElementById('syncIndicator');
        if (!state.refundChecked) {
            indicator.style.display = 'inline-flex';
        }

        try {
            const res = await fetch('/api/nokos/check-refunds', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            });

            const data = await safeJson(res);
            if (data.refunded && data.refunded.length > 0) {
                // Ada refund baru
                console.log(`💰 ${data.refunded.length} order di-refund:`, data.refunded);

                // Update balance
                CacheManager.remove('user_profile');
                swrFetch('/api/user', 'user_profile', (user) => {
                    if (!user) return;
                    document.getElementById('userBalance').textContent = formatRupiah(user.balance);
                    document.getElementById('balancePill').textContent = formatRupiah(user.balance);
                });

                // Invalidate cache orders
                invalidateInboxCache();

                // Show alert kalo ada refund baru
                const totalRefund = data.refunded.reduce((sum, r) => sum + (r.refunded_amount || 0), 0);
                if (totalRefund > 0) {
                    showCustomAlert({
                        title: 'Refund Otomatis',
                        message: `${data.refunded.length} pesanan di-refund. Total Rp${totalRefund.toLocaleString('id-ID')} udah masuk ke saldo kamu.`,
                        type: 'success'
                    });
                }
            }
        } catch (err) {
            console.error('Check refunds error:', err);
        } finally {
            state.refundChecked = true;
            indicator.style.display = 'none';
        }
    }

    /* ===== INVALIDATE INBOX CACHE ===== */
    function invalidateInboxCache() {
        Object.keys(localStorage)
            .filter(k => k.startsWith('asyrofotp_cache_inbox_'))
            .forEach(k => localStorage.removeItem(k));
    }

    /* ===== LOAD ORDERS ===== */
    async function loadOrders(silent = false) {
        const container = document.getElementById('ordersContainer');
        const paginationEl = document.getElementById('pagination');
        const cacheKey = getCacheKey(state.page, state.status);

        // 1. Tampilkan cache dulu
        const cached = CacheManager.get(cacheKey);
        if (cached && cached.value) {
            renderOrders(cached.value, true);
        } else if (!silent) {
            container.innerHTML = `
                <div class="skeleton-order"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:40%"></div></div>
                <div class="skeleton-order"><div class="skeleton-line" style="width:55%"></div><div class="skeleton-line" style="width:45%"></div></div>
                <div class="skeleton-order"><div class="skeleton-line" style="width:65%"></div><div class="skeleton-line" style="width:35%"></div></div>
            `;
        }

        // 2. Fetch fresh
        try {
            const statusParam = state.status === 'all' ? '' : `&status=${state.status}`;
            const res = await fetch(`/api/nokos/orders?page=${state.page}&limit=${state.limit}${statusParam}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await safeJson(res);

            // Simpan cache
            CacheManager.set(cacheKey, data);
            renderOrders(data, false);

            // Load counts (dari cache dulu, terus fetch)
            loadCounts();
        } catch (err) {
            console.error('Load orders error:', err);
            if (!cached && !silent) {
                container.innerHTML = `
                    <div class="empty-inbox">
                        <div class="icon-box">${ICONS.warning}</div>
                        <h3>Gagal memuat pesanan</h3>
                        <p>${err.message || 'Coba refresh halaman'}</p>
                    </div>
                `;
            }
        }
    }

    /* ===== LOAD COUNTS ===== */
    async function loadCounts() {
        const cacheKey = getCountsCacheKey();
        const cached = CacheManager.get(cacheKey);
        if (cached && cached.value) {
            applyCounts(cached.value);
        }

        try {
            const res = await fetch('/api/nokos/orders/stats', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await safeJson(res);
            CacheManager.set(cacheKey, data);
            applyCounts(data);
        } catch (err) {
            console.error('Load counts error:', err);
        }
    }

    function applyCounts(data) {
        if (!data) return;
        state.counts = {
            all: data.all || 0,
            pending: data.pending || 0,
            success: data.success || 0,
            failed: data.failed || 0,
            expired: data.expired || 0,
            cancelled: data.cancelled || 0,
        };

        document.querySelectorAll('.tab-count').forEach(el => {
            const key = el.dataset.count;
            el.textContent = state.counts[key] || 0;
        });
    }

    /* ===== RENDER ===== */
    function renderOrders(data, fromCache) {
        const container = document.getElementById('ordersContainer');
        const paginationEl = document.getElementById('pagination');

        if (!data.orders || data.orders.length === 0) {
            container.innerHTML = `
                <div class="empty-inbox">
                    <div class="icon-box">
                        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                    </div>
                    <h3>${state.status === 'all' ? 'Belum ada pesanan' : 'Belum ada pesanan di kategori ini'}</h3>
                    <p>Mulai beli nokos buat lihat riwayat & kode OTP di sini.</p>
                    ${state.status === 'all' ? `
                        <a href="/nokos" class="btn btn-primary">
                            <svg class="icon-svg" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                            Beli Nokos
                        </a>
                    ` : ''}
                </div>
            `;
            paginationEl.style.display = 'none';
            return;
        }

        const statusMap = {
            success: { class: 'success', label: 'Berhasil', icon: ICONS.check },
            received: { class: 'success', label: 'Berhasil', icon: ICONS.check },
            pending: { class: 'pending', label: 'Pending', icon: ICONS.info },
            failed: { class: 'failed', label: 'Gagal', icon: ICONS.close },
            cancelled: { class: 'cancelled', label: 'Dibatalkan', icon: ICONS.close },
            expired: { class: 'expired', label: 'Expired', icon: ICONS.clock },
            refunded: { class: 'refunded', label: 'Refund', icon: ICONS.refresh },
        };

        container.innerHTML = `<div class="orders-list">` + data.orders.map(o => {
            const s = statusMap[o.status] || { class: 'pending', label: o.status, icon: ICONS.info };
            const hasOtp = o.otp_code && o.otp_code.trim();
            const isPending = o.status === 'pending';
            const isRefunded = o.status === 'refunded' || (o.refunded_at && Number(o.refunded_at) > 0);
            const otpId = o.otp_id || (o.order_id ? `OTP${String(o.order_id).slice(-8)}` : '—');
            const expiresIn = o.expires_in !== undefined ? o.expires_in : 0;
            const mins = Math.floor(expiresIn / 60);
            const secs = expiresIn % 60;
            const timeText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            const createdDate = new Date(o.created_at).toLocaleString('id-ID', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });

            const badgeClass = s.class === 'success' ? 'success' : s.class === 'pending' ? 'warning' : (s.class === 'expired' ? 'gray' : (s.class === 'refunded' ? 'info' : 'danger'));

            return `
                <div class="order-card ${s.class}" data-order-id="${o.order_id}">
                    <div class="order-header">
                        <div class="order-flag">${renderFlag(o.country)}</div>
                        <div class="order-title-wrap">
                            <div class="order-title">
                                ${o.service_name || o.service || '—'}
                                ${o.operator ? `<span class="badge info" style="font-size:0.6rem;">${o.operator}</span>` : ''}
                            </div>
                            <div class="order-ref">
                                <span class="otp-id">${otpId}</span> · ${o.order_id || '—'}
                            </div>
                        </div>
                        <div class="order-status-badge">
                            <span class="badge ${badgeClass}">${s.label}</span>
                        </div>
                    </div>

                    <div class="order-body">
                        <div class="order-field">
                            <span class="order-field-label">Nomor</span>
                            <span class="order-field-value">${o.phone_number || '—'}</span>
                        </div>
                        <div class="order-field">
                            <span class="order-field-label">Negara</span>
                            <span class="order-field-value">${o.country_name || o.country || '—'}</span>
                        </div>
                        <div class="order-field">
                            <span class="order-field-label">Harga</span>
                            <span class="order-field-value price">${formatRupiah(o.price)}</span>
                        </div>
                        <div class="order-field">
                            <span class="order-field-label">Dibuat</span>
                            <span class="order-field-value" style="font-size:0.75rem;">${createdDate}</span>
                        </div>
                    </div>

                    ${isPending && !hasOtp && expiresIn > 0 ? `
                        <div class="order-countdown" data-order-id="${o.order_id}" data-expires="${expiresIn}">
                            ${ICONS.clock}
                            <span class="countdown-text">${timeText}</span> tersisa
                        </div>
                    ` : ''}

                    ${hasOtp ? `
                        <div class="otp-box">
                            <div class="otp-icon">${ICONS.key}</div>
                            <div class="otp-info">
                                <div class="otp-info-label">Kode OTP</div>
                                <div class="otp-info-value" id="otp-${o.order_id}">${o.otp_code}</div>
                            </div>
                            <button class="otp-copy" type="button" data-copy-otp="${o.otp_code}" title="Copy OTP">
                                ${ICONS.copy}
                            </button>
                        </div>
                        ${o.full_sms ? `
                            <div style="font-size:0.75rem;color:var(--text-gray);font-family:var(--font-mono);margin-bottom:12px;padding:10px;background:var(--bg-light);border-radius:8px;border:1px solid var(--border);word-break:break-all;">
                                <strong style="color:var(--text-dark);font-size:0.68rem;text-transform:uppercase;">SMS:</strong> ${o.full_sms}
                            </div>
                        ` : ''}
                    ` : ''}

                    ${isRefunded ? `
                        <div class="refund-box">
                            <div class="refund-icon">${ICONS.coin}</div>
                            <div class="refund-info">
                                <div class="refund-info-label">Refund Diterima</div>
                                <div class="refund-info-value">${formatRupiah(o.refunded_amount || o.price)}</div>
                                <div class="refund-note">Saldo udah otomatis masuk ke akun kamu</div>
                            </div>
                        </div>
                    ` : ''}

                    ${isPending && !hasOtp && !isRefunded ? `
                        <div class="pending-box">
                            <span class="loading-spinner"></span>
                            <span>Menunggu kode OTP masuk... auto-refresh tiap 5 detik.</span>
                        </div>
                    ` : ''}

                    <div class="order-actions">
                        ${isPending ? `
                            ${hasOtp ? `
                                <button class="btn" type="button" data-resend="${o.order_id}">
                                    ${ICONS.refresh}
                                    Resend SMS
                                </button>
                            ` : ''}
                            <button class="btn btn-danger" type="button" data-cancel="${o.order_id}">
                                <svg class="icon-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                Batalkan
                            </button>
                        ` : `
                            <button class="btn btn-primary" type="button" data-detail="${o.order_id}">
                                <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                Lihat Detail
                            </button>
                        `}
                    </div>
                </div>
            `;
        }).join('') + `</div>`;

        // Pagination
        if (data.total > state.limit) {
            state.totalPages = Math.ceil(data.total / state.limit);
            paginationEl.style.display = 'flex';
            paginationEl.innerHTML = `
                <button class="page-btn" type="button" data-page="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''}>
                    Prev
                </button>
                <span class="page-info">Halaman ${state.page} dari ${state.totalPages}</span>
                <button class="page-btn" type="button" data-page="${state.page + 1}" ${state.page >= state.totalPages ? 'disabled' : ''}>
                    Next
                </button>
            `;

            paginationEl.querySelectorAll('.page-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const p = Number(btn.dataset.page);
                    if (p >= 1 && p <= state.totalPages) {
                        state.page = p;
                        loadOrders();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });
            });
        } else {
            paginationEl.style.display = 'none';
        }

        // Bind actions
        container.querySelectorAll('[data-copy-otp]').forEach(btn => {
            btn.addEventListener('click', () => {
                const otp = btn.dataset.copyOtp;
                navigator.clipboard.writeText(otp).then(() => {
                    const original = btn.innerHTML;
                    btn.innerHTML = ICONS.check;
                    setTimeout(() => btn.innerHTML = original, 1200);
                });
            });
        });

        container.querySelectorAll('[data-resend]').forEach(btn => {
            btn.addEventListener('click', () => resendOrder(btn.dataset.resend, btn));
        });

        container.querySelectorAll('[data-cancel]').forEach(btn => {
            btn.addEventListener('click', () => cancelOrder(btn.dataset.cancel, btn));
        });

        container.querySelectorAll('[data-detail]').forEach(btn => {
            btn.addEventListener('click', () => showOrderDetail(btn.dataset.detail));
        });

        startCountdowns();
    }

    /* ===== COUNTDOWN ===== */
    function startCountdowns() {
        Object.values(state.countdownIntervals).forEach(clearInterval);
        state.countdownIntervals = {};

        document.querySelectorAll('.order-countdown').forEach(el => {
            const orderId = el.dataset.orderId;
            let remaining = parseInt(el.dataset.expires || '0', 10);
            const textEl = el.querySelector('.countdown-text');

            if (remaining <= 0) {
                el.classList.add('expired');
                if (textEl) textEl.textContent = 'EXPIRED';
                return;
            }

            if (state.countdownIntervals[orderId]) clearInterval(state.countdownIntervals[orderId]);

            function tick() {
                if (remaining <= 0) {
                    el.classList.add('expired');
                    if (textEl) textEl.textContent = 'EXPIRED';
                    clearInterval(state.countdownIntervals[orderId]);
                    setTimeout(() => {
                        invalidateInboxCache();
                        loadOrders(true);
                    }, 500);
                    return;
                }
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                if (textEl) textEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                remaining--;
            }

            tick();
            state.countdownIntervals[orderId] = setInterval(tick, 1000);
        });
    }

    /* ===== POLLING PENDING ===== */
    async function pollPendingOrders(orders) {
        const pending = orders.filter(o => o.status === 'pending' && (!o.otp_code || !o.otp_code.trim()));
        if (pending.length === 0) return;

        let hasUpdate = false;

        for (const o of pending) {
            try {
                const res = await fetch('/api/cekotp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ order_id: o.order_id, otp_id: o.otp_id })
                });
                const data = await safeJson(res);

                if (data.updated || data.otp_code || data.status !== 'pending') {
                    hasUpdate = true;
                    if (data.otp_code) {
                        CacheManager.remove('user_profile');
                        swrFetch('/api/user', 'user_profile', (user) => {
                            if (!user) return;
                            document.getElementById('userBalance').textContent = formatRupiah(user.balance);
                            document.getElementById('balancePill').textContent = formatRupiah(user.balance);
                        });
                    }
                }
            } catch (err) {
                console.error(`Poll order ${o.order_id} error:`, err);
            }
        }

        if (hasUpdate) {
            invalidateInboxCache();
            loadOrders(true);
            loadCounts();
        }
    }

    /* ===== RESEND ===== */
    async function resendOrder(orderId, btn) {
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner loading-spinner-sm"></span>';

        try {
            const res = await fetch(`/api/nokos/order/${orderId}/resend`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await safeJson(res);
            if (!res.ok) throw new Error(data.error || 'Gagal resend');

            await showCustomAlert({
                title: 'Resend Berhasil',
                message: 'SMS resend berhasil dikirim. Tunggu kode OTP masuk.',
                type: 'success'
            });
            invalidateInboxCache();
            loadOrders(true);
        } catch (err) {
            await showCustomAlert({
                title: 'Gagal Resend',
                message: err.message,
                type: 'danger'
            });
            btn.disabled = false;
            btn.innerHTML = original;
        }
    }

    /* ===== CANCEL ===== */
    async function cancelOrder(orderId, btn) {
        const ok = await showCustomAlert({
            title: 'Batalkan Pesanan',
            message: 'Yakin mau batalkan pesanan ini? Saldo akan dikembalikan sesuai kebijakan.',
            type: 'warning',
            okText: 'Ya, Batalkan',
            showCancel: true
        });
        if (!ok) return;

        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner loading-spinner-sm"></span>';

        try {
            const res = await fetch(`/api/nokos/order/${orderId}/cancel`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await safeJson(res);
            if (!res.ok) throw new Error(data.error || 'Gagal batalkan');

            await showCustomAlert({
                title: 'Dibatalkan',
                message: 'Pesanan berhasil dibatalkan. Saldo sudah dikembalikan.',
                type: 'success'
            });

            CacheManager.remove('user_profile');
            swrFetch('/api/user', 'user_profile', (user) => {
                if (!user) return;
                document.getElementById('userBalance').textContent = formatRupiah(user.balance);
                document.getElementById('balancePill').textContent = formatRupiah(user.balance);
            });

            invalidateInboxCache();
            loadOrders(true);
            loadCounts();
        } catch (err) {
            await showCustomAlert({
                title: 'Gagal',
                message: err.message,
                type: 'danger'
            });
            btn.disabled = false;
            btn.innerHTML = original;
        }
    }

    /* ===== DETAIL ===== */
    async function showOrderDetail(orderId) {
        try {
            const res = await fetch(`/api/nokos/order/${orderId}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const o = await safeJson(res);

            const statusMap = {
                success: 'Berhasil', received: 'Berhasil',
                pending: 'Pending', failed: 'Gagal',
                cancelled: 'Dibatalkan', expired: 'Expired',
                refunded: 'Refund'
            };

            const formatDate = (date) => {
                if (!date) return '—';
                return new Date(date).toLocaleString('id-ID', {
                    day: '2-digit', month: 'long', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                });
            };

            const isRefunded = o.refunded_at && Number(o.refunded_at) > 0;

            const detailHtml = `
                <div style="text-align:center;margin-bottom:16px;">
                    <div style="width:56px;height:56px;border-radius:50%;background:var(--primary-light);border:2px solid var(--border-dark);display:flex;align-items:center;justify-content:center;color:var(--primary);margin:0 auto 12px;">
                        <svg class="icon-svg" viewBox="0 0 24 24" style="width:26px;height:26px;"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                    </div>
                    <h3 style="font-family:var(--font-display);font-size:1.1rem;margin-bottom:4px;">${o.service_name || o.service || '—'}</h3>
                    <p style="color:var(--text-gray);font-size:0.82rem;">${statusMap[o.status] || o.status}</p>
                </div>
                <div style="border:2px solid var(--border-dark);border-radius:10px;overflow:hidden;margin-bottom:16px;">
                    <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                        <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">OTP ID</span>
                        <span style="font-weight:800;font-family:var(--font-mono);color:var(--primary);">${o.otp_id || '—'}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                        <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">ORDER ID</span>
                        <span style="font-weight:700;font-family:var(--font-mono);word-break:break-all;text-align:right;">${o.order_id || '—'}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                        <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">NOMOR</span>
                        <span style="font-weight:700;font-family:var(--font-mono);">${o.phone_number || '—'}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                        <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">NEGARA</span>
                        <span style="font-weight:700;font-family:var(--font-mono);">${o.country_name || o.country || '—'}</span>
                    </div>
                    ${o.operator ? `
                        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                            <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">OPERATOR</span>
                            <span style="font-weight:700;font-family:var(--font-mono);">${o.operator}</span>
                        </div>
                    ` : ''}
                    <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                        <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">HARGA</span>
                        <span style="font-weight:800;font-family:var(--font-mono);color:var(--primary);">${formatRupiah(o.price)}</span>
                    </div>
                    ${o.otp_code ? `
                        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                            <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">OTP</span>
                            <span style="font-weight:800;font-family:var(--font-mono);color:var(--success);letter-spacing:0.1em;">${o.otp_code}</span>
                        </div>
                    ` : ''}
                    ${isRefunded ? `
                        <div style="display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-size:0.82rem;">
                            <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">REFUND</span>
                            <span style="font-weight:800;font-family:var(--font-mono);color:var(--purple);">${formatRupiah(o.refunded_amount || o.price)}</span>
                        </div>
                    ` : ''}
                    <div style="display:flex;justify-content:space-between;padding:10px 14px;font-size:0.82rem;">
                        <span style="color:var(--text-gray);font-family:var(--font-mono);font-size:0.72rem;">DIBUAT</span>
                        <span style="font-weight:700;font-family:var(--font-mono);font-size:0.72rem;text-align:right;">${formatDate(o.created_at)}</span>
                    </div>
                </div>
                <button class="btn btn-primary btn-block" type="button" onclick="document.getElementById('customAlert').classList.remove('active')">Tutup</button>
            `;

            const overlay = document.getElementById('customAlert');
            const iconEl = document.getElementById('customAlertIcon');
            const titleEl = document.getElementById('customAlertTitle');
            const msgEl = document.getElementById('customAlertMessage');
            const actionsEl = document.getElementById('customAlertActions');

            iconEl.className = 'custom-alert-icon info';
            iconEl.innerHTML = ICONS.info;
            titleEl.textContent = 'Detail Pesanan';
            msgEl.innerHTML = '';
            msgEl.style.textAlign = 'left';
            msgEl.insertAdjacentHTML('afterbegin', detailHtml);
            actionsEl.innerHTML = '';

            overlay.classList.add('active');
        } catch (err) {
            console.error(err);
        }
    }

    /* ===== TABS ===== */
    document.getElementById('inboxTabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.inbox-tab');
        if (!tab) return;

        document.querySelectorAll('.inbox-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        state.status = tab.dataset.status;
        state.page = 1;
        loadOrders();
    });

    /* ===== REFRESH BUTTON ===== */
    document.getElementById('refreshBtn').addEventListener('click', async function() {
        const btn = this;
        btn.classList.add('spinning');
        invalidateInboxCache();
        await checkRefunds();
        await loadOrders(true);
        await loadCounts();
        setTimeout(() => btn.classList.remove('spinning'), 500);
    });

    /* ===== AUTO REFRESH ===== */
    function startAutoRefresh() {
        if (state.refreshInterval) clearInterval(state.refreshInterval);
        state.refreshInterval = setInterval(async () => {
            // Polling order pending yang keliatan
            const container = document.getElementById('ordersContainer');
            const cards = container.querySelectorAll('.order-card.pending');
            const pendingOrders = Array.from(cards).map(c => ({
                order_id: c.dataset.orderId,
            }));

            if (pendingOrders.length > 0) {
                await pollPendingOrders(pendingOrders);
            }

            // Re-check refunds + reload (silent)
            if (state.refundChecked) {
                await checkRefunds();
                await loadOrders(true);
                await loadCounts();
            }
        }, 5000);
    }

    /* ===== LOGOUT ===== */
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
        } catch (err) {}

        CacheManager.clear();
        localStorage.removeItem('access_token');
        localStorage.removeItem('user');
        window.location.href = '/landing';
    });

    /* ===== INIT ===== */
    (async function init() {
        // 1. Load orders dari cache dulu
        loadOrders(true);

        // 2. Auto-check refund (backend cek semua pending yang expired/gagal)
        await checkRefunds();

        // 3. Load fresh orders
        await loadOrders(true);
        await loadCounts();

        // 4. Start auto-refresh
        startAutoRefresh();
    })();

    window.addEventListener('beforeunload', () => {
        if (state.refreshInterval) clearInterval(state.refreshInterval);
        Object.values(state.countdownIntervals).forEach(clearInterval);
    });
</script>

</body>
</html>
