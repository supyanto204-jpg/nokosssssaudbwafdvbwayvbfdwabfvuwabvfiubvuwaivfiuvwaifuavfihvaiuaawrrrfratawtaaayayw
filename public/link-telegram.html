<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0a84ff">
<meta name="robots" content="noindex, nofollow">
<title>Tautkan Telegram — AsyrofOTP</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js?render=6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg" async defer></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.5 'Inter',system-ui,-apple-system,sans-serif;background:#0a0b0d;color:#f2f4f6;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
img,svg{display:block;max-width:100%;height:auto}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #4aa3ff;outline-offset:2px}

.auth-wrap{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.auth-brand{display:flex;align-items:center;gap:8px}
.brand-mark{width:28px;height:28px;border-radius:6px;background:#f2f4f6;color:#0a0b0d;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;line-height:1}
.brand-txt{font-weight:600;font-size:.95rem;letter-spacing:-.01em}
.brand-txt span{color:#a6adb4;font-weight:400}

.auth-card{padding:28px 24px 22px;background:#14171a;border:1px solid #262a2f;border-radius:10px;animation:card .4s ease both}
@keyframes card{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

.auth-head{margin-bottom:20px}
.auth-head h1{font-size:1.35rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:4px}
.auth-head p{font-size:.875rem;color:#a6adb4}

.alert{display:none;align-items:flex-start;gap:8px;padding:10px 12px;border:1px solid;border-radius:6px;font-size:.8125rem;line-height:1.5;margin-bottom:16px;animation:alert .2s ease}
.alert.show{display:flex}
@keyframes alert{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.alert .ic{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.alert.error{background:rgba(255,107,107,.08);border-color:#ff6b6b;color:#ff6b6b}
.alert.success{background:rgba(74,196,122,.08);border-color:#4ac47a;color:#4ac47a}

.field{margin-bottom:14px}
.label{display:block;font-size:.8125rem;font-weight:500;margin-bottom:5px;color:#f2f4f6}
.input-box{position:relative;display:flex;align-items:center}
.input-ic{position:absolute;left:12px;color:#7a8188;pointer-events:none;width:16px;height:16px}
.input-box input{width:100%;padding:11px 12px 11px 38px;border:1px solid #262a2f;background:#0a0b0d;border-radius:6px;font-family:inherit;font-size:16px;color:#f2f4f6;outline:none;transition:.15s}
.input-box input:focus{border-color:#4aa3ff;box-shadow:0 0 0 3px rgba(74,163,255,.2)}
.input-box input::placeholder{color:#7a8188}

.btn{width:100%;height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:6px;background:#f2f4f6;color:#0a0b0d;font-family:inherit;font-weight:500;font-size:.9375rem;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){opacity:.88}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-tg{background:#229ed9;color:#fff}
.btn-tg:hover:not(:disabled){background:#1e8fc5}

.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#0a0b0d;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;padding:8px;text-align:center;background:#0a0b0d;border:1px solid #262a2f;border-radius:6px;font-size:.8125rem;cursor:pointer;transition:.15s;font-weight:500;color:#a6adb4}
.tab.active{background:#f2f4f6;color:#0a0b0d;border-color:#f2f4f6}
.hidden{display:none!important}

.info-box{background:#0a0b0d;border:1px solid #262a2f;border-radius:8px;padding:14px;margin-bottom:16px;font-size:.875rem}
.info-box .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #262a2f}
.info-box .row:last-child{border-bottom:none}
.info-box .row span:first-child{color:#a6adb4}
.info-box .row code{font-family:ui-monospace,monospace;color:#f2f4f6;font-weight:500}

.auth-foot{font-size:.8125rem;color:#a6adb4;margin-top:16px;text-align:center}
.auth-foot a{color:#f2f4f6;text-decoration:underline;text-underline-offset:2px}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="brand-mark" aria-hidden="true">A</div>
    <div class="brand-txt">Asyrof<span>OTP</span></div>
  </div>

  <div class="auth-card">
    <div class="auth-head">
      <h1>Tautkan Telegram</h1>
      <p id="subtitle">Hubungkan akun AsyrofOTP ke bot Telegram.</p>
    </div>

    <div class="alert" id="alert" role="alert" aria-live="polite">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="alertIcon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span id="alertText"></span>
    </div>

    <!-- STATE 1: Belum Login -->
    <div id="stateLogin">
      <div class="tabs">
        <div class="tab active" data-tab="login">Masuk</div>
        <div class="tab" data-tab="register">Daftar</div>
      </div>

      <div id="formLogin">
        <div class="field">
          <label class="label" for="lgUser">Username</label>
          <div class="input-box">
            <svg class="input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="lgUser" placeholder="username" autocomplete="username" spellcheck="false">
          </div>
        </div>
        <div class="field">
          <label class="label" for="lgPass">Password</label>
          <div class="input-box">
            <svg class="input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="lgPass" placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>
        <button class="btn" id="btnLogin">Masuk</button>
      </div>

      <div id="formRegister" class="hidden">
        <div class="field">
          <label class="label" for="rgUser">Username</label>
          <div class="input-box">
            <svg class="input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="rgUser" placeholder="huruf, angka, underscore" autocomplete="username">
          </div>
        </div>
        <div class="field">
          <label class="label" for="rgPass">Password</label>
          <div class="input-box">
            <svg class="input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="rgPass" placeholder="min 6 karakter" autocomplete="new-password">
          </div>
        </div>
        <div class="field">
          <label class="label" for="rgName">Nama (opsional)</label>
          <div class="input-box">
            <svg class="input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
            <input type="text" id="rgName" placeholder="Nama tampilan">
          </div>
        </div>
        <button class="btn" id="btnRegister">Daftar</button>
      </div>
    </div>

    <!-- STATE 2: Login, Belum Tertaut -->
    <div id="stateLink" class="hidden">
      <div class="info-box">
        <div class="row"><span>Login sebagai</span><code id="infoUsername">-</code></div>
        <div class="row"><span>Status Telegram</span><span style="color:#ff6b6b;font-weight:500">Belum tertaut</span></div>
      </div>
      <button class="btn btn-tg" id="btnLink">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        Tautkan Sekarang
      </button>
      <p style="margin-top:12px;font-size:.75rem;color:#7a8188;text-align:center">Kamu akan diarahkan ke bot Telegram untuk konfirmasi.</p>
    </div>

    <!-- STATE 3: Sudah Tertaut -->
    <div id="stateLinked" class="hidden">
      <div class="info-box">
        <div class="row"><span>Login sebagai</span><code id="infoUsername2">-</code></div>
        <div class="row"><span>Telegram ID</span><code id="infoTgId">-</code></div>
        <div class="row"><span>Username TG</span><code id="infoTgUsername">-</code></div>
        <div class="row"><span>Tertaut sejak</span><code id="infoLinkedAt" style="font-size:.75rem">-</code></div>
      </div>
      <button class="btn btn-tg" id="btnRelink">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
        Ganti Akun Telegram
      </button>
    </div>

    <div class="auth-foot">
      <a href="/dashboard">Kembali ke Dashboard</a>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const API = '';
const RECAPTCHA_KEY = '6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg';
const BOT_USERNAME = 'asyrofotp_bot'; // GANTI kalau username bot lo beda

let token = localStorage.getItem('access_token') || null;
let user = null;
let tgLinkData = null; 

const $ = (s) => document.querySelector(s);
const alertEl = $('#alert'), alertText = $('#alertText'), alertIcon = $('#alertIcon');

function showAlert(msg, type='error'){
    alertEl.className = 'alert show ' + type;
    alertText.textContent = msg;
    if(type === 'success') {
        alertIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
    } else {
        alertIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
    }
    setTimeout(() => alertEl.className = 'alert', 5000);
}

function toggle(el, show){ if(el) el.classList.toggle('hidden', !show); }

function switchTab(tab){
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    toggle($('#formLogin'), tab === 'login');
    toggle($('#formRegister'), tab === 'register');
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

async function api(path, opts={}){
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API + path, { ...opts, headers });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
}

function parseQuery(){
    const p = new URLSearchParams(location.search);
    const tgId = p.get('tg_id');
    const tgUser = p.get('tg_username');
    if (tgId) tgLinkData = { telegram_id: tgId, telegram_username: tgUser || null };
}

async function init(){
    parseQuery();

    if (token){
        const r = await api('/api/user');
        if (r.ok){ user = r.data; }
        else { token = null; localStorage.removeItem('access_token'); }
    }

    if (!user){
        toggle($('#stateLogin'), true);
        toggle($('#stateLink'), false);
        toggle($('#stateLinked'), false);
        return;
    }

    toggle($('#stateLogin'), false);
    $('#infoUsername').textContent = user.username;
    $('#infoUsername2').textContent = user.username;

    const r = await api('/api/telegram/status');
    if (r.ok && r.data.telegram_id){
        toggle($('#stateLink'), false);
        toggle($('#stateLinked'), true);
        $('#infoTgId').textContent = r.data.telegram_id;
        $('#infoTgUsername').textContent = r.data.telegram_username ? '@' + r.data.telegram_username : '-';
        $('#infoLinkedAt').textContent = r.data.telegram_linked_at
            ? new Date(r.data.telegram_linked_at).toLocaleString('id-ID') : '-';
    } else {
        toggle($('#stateLink'), true);
        toggle($('#stateLinked'), false);
    }

    // Kalau baru balik dari bot (bawa query tg_id), langsung link
    if (tgLinkData && tgLinkData.telegram_id){
        await linkTelegram();
    }
}

async function doLogin(){
    const username = $('#lgUser').value.trim();
    const password = $('#lgPass').value;
    if (!username || !password) return showAlert('Isi username dan password');
    const btn = $('#btnLogin'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

    try {
        await new Promise((resolve) => {
            if (window.grecaptcha && window.grecaptcha.execute) return resolve();
            const t = setInterval(() => {
                if (window.grecaptcha && window.grecaptcha.execute) { clearInterval(t); resolve(); }
            }, 100);
            setTimeout(() => { clearInterval(t); resolve(); }, 5000);
        });
        const recaptchaToken = await new Promise((resolve, reject) => {
            if (!window.grecaptcha) return reject(new Error('Gagal memuat reCAPTCHA'));
            window.grecaptcha.ready(() => {
                window.grecaptcha.execute(RECAPTCHA_KEY, { action: 'login' }).then(resolve).catch(reject);
            });
        });

        const r = await api('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ username, password, recaptcha_token: recaptchaToken })
        });
        if (!r.ok) throw new Error(r.data.error || 'Login gagal');

        token = r.data.session.access_token;
        localStorage.setItem('access_token', token);
        if (r.data.session.refresh_token) localStorage.setItem('refresh_token', r.data.session.refresh_token);
        user = r.data.user;
        showAlert('Login berhasil!', 'success');
        await init();
    } catch (err) {
        showAlert(err.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Masuk';
    }
}

async function doRegister(){
    const username = $('#rgUser').value.trim();
    const password = $('#rgPass').value;
    const name = $('#rgName').value.trim();
    if (!username || !password) return showAlert('Isi username dan password');
    if (password.length < 6) return showAlert('Password minimal 6 karakter');
    const btn = $('#btnRegister'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

    try {
        await new Promise((resolve) => {
            if (window.grecaptcha && window.grecaptcha.execute) return resolve();
            const t = setInterval(() => {
                if (window.grecaptcha && window.grecaptcha.execute) { clearInterval(t); resolve(); }
            }, 100);
            setTimeout(() => { clearInterval(t); resolve(); }, 5000);
        });
        const recaptchaToken = await new Promise((resolve, reject) => {
            if (!window.grecaptcha) return reject(new Error('Gagal memuat reCAPTCHA'));
            window.grecaptcha.ready(() => {
                window.grecaptcha.execute(RECAPTCHA_KEY, { action: 'register' }).then(resolve).catch(reject);
            });
        });

        const r = await api('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({ username, password, name, recaptcha_token: recaptchaToken })
        });
        if (!r.ok) throw new Error(r.data.error || 'Registrasi gagal');
        showAlert('Registrasi berhasil, silakan login.', 'success');
        switchTab('login');
        $('#lgUser').value = username;
        $('#lgPass').value = '';
    } catch (err) {
        showAlert(err.message);
    } finally {
        btn.disabled = false; btn.textContent = 'Daftar';
    }
}

async function linkTelegram(){
    if (!tgLinkData || !tgLinkData.telegram_id) return;
    const r = await api('/api/telegram/link', {
        method: 'POST',
        body: JSON.stringify(tgLinkData)
    });
    if (r.ok){
        showAlert('Telegram berhasil ditautkan!', 'success');
        history.replaceState({}, '', location.pathname);
        tgLinkData = null;
        await init();
    } else {
        showAlert(r.data.error || 'Gagal menautkan Telegram');
    }
}

async function startLinkFlow(){
    if (!token) return;
    const url = `https://t.me/${BOT_USERNAME}?start=link_${encodeURIComponent(token)}`;
    window.location.href = url;
}

$('#btnLogin').addEventListener('click', doLogin);
$('#btnRegister').addEventListener('click', doRegister);
$('#btnLink').addEventListener('click', startLinkFlow);
$('#btnRelink').addEventListener('click', startLinkFlow);
$('#lgPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('#rgPass').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

init();
})();
</script>
</body>
</html>
