<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="theme-color" content="#2563eb">
    <meta name="robots" content="noindex, nofollow">
    <title>Preload Icons - AsyrofOTP</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">

    <!-- 🚀 BOOSTER: preconnect + dns-prefetch ke CDN -->
    <link rel="preconnect" href="https://assets.cindigital.id" crossorigin>
    <link rel="dns-prefetch" href="https://assets.cindigital.id">

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
        h1 { font-size: 1.4rem; margin: 0 0 4px; color: #f1f5f9; }
        .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
        .sub code {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            color: #60a5fa;
            font-size: 0.8rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
        .stat-card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 12px 14px;
        }
        .stat-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-family: ui-monospace, monospace;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            font-family: ui-monospace, monospace;
            color: #f1f5f9;
        }
        .stat-value.ok { color: #4ade80; }
        .stat-value.fail { color: #f87171; }
        .stat-value.skip { color: #fbbf24; }
        .stat-value.speed { color: #60a5fa; }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        button {
            background: #2563eb;
            color: white;
            border: 2px solid #1e3a8a;
            border-radius: 10px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: inherit;
            transition: transform .15s, box-shadow .15s;
            box-shadow: 3px 3px 0 rgba(15, 23, 42, 1);
        }
        button:hover:not(:disabled) {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 rgba(15, 23, 42, 1);
        }
        button:active:not(:disabled) {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 rgba(15, 23, 42, 1);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.danger { background: #dc2626; border-color: #7f1d1d; }
        button.success { background: #16a34a; border-color: #14532d; }

        .speed-ctrl {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-left: auto;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-family: ui-monospace, monospace;
            color: #94a3b8;
        }
        .speed-ctrl select {
            background: #0f172a;
            color: #f1f5f9;
            border: 1.5px solid #334155;
            border-radius: 6px;
            padding: 4px 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .progress-wrap {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            height: 28px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 200% 100%;
            animation: gradientShift 3s linear infinite;
            width: 0%;
            transition: width .25s ease;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: ui-monospace, monospace;
            font-weight: 800;
            font-size: 0.78rem;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,.5);
        }

        .log {
            background: #020617;
            border: 2px solid #1e293b;
            border-radius: 10px;
            padding: 12px 14px;
            font-family: ui-monospace, monospace;
            font-size: 0.75rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            color: #cbd5e1;
        }
        .log-line { padding: 1px 0; }
        .log-line.ok { color: #4ade80; }
        .log-line.fail { color: #f87171; }
        .log-line.info { color: #60a5fa; }
        .log-line.warn { color: #fbbf24; }
        .log-time { color: #64748b; margin-right: 8px; }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
            gap: 6px;
            margin-top: 16px;
            padding: 14px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
        }
        .icon-cell {
            aspect-ratio: 1;
            background: #0f172a;
            border: 1.5px solid #334155;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            position: relative;
            overflow: hidden;
        }
        .icon-cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .icon-cell .fallback {
            font-size: 0.85rem;
            font-weight: 800;
            color: #64748b;
            font-family: ui-monospace, monospace;
            text-transform: uppercase;
        }
        .icon-cell .badge {
            position: absolute;
            top: 2px; right: 2px;
            font-size: 0.5rem;
            padding: 1px 4px;
            border-radius: 4px;
            font-weight: 800;
            font-family: ui-monospace, monospace;
        }
        .icon-cell .badge.ok { background: #16a34a; color: white; }
        .icon-cell .badge.fail { background: #dc2626; color: white; }
        .icon-cell .badge.skip { background: #ca8a04; color: white; }
        .icon-cell .label {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,.65);
            color: white;
            font-size: 0.5rem;
            text-align: center;
            padding: 2px;
            font-family: ui-monospace, monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="wrap">
    <h1>🔧 Preload Icons Cache</h1>
    <p class="sub">
        Halaman ini memuat semua icon dari <code>assets.cindigital.id</code> lewat tag
        <code>&lt;img&gt;</code> (tidak kena CORS) dan menyimpan URL-nya ke IndexedDB.
        Browser akan cache icon otomatis saat pertama kali load.
    </p>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Berhasil</div>
            <div class="stat-value ok" id="statOk">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Gagal</div>
            <div class="stat-value fail" id="statFail">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Sudah Ada</div>
            <div class="stat-value skip" id="statSkip">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Kecepatan</div>
            <div class="stat-value speed" id="statSpeed">0/s</div>
        </div>
    </div>

    <div class="actions">
        <button id="btnStart" type="button">🚀 Preload Semua Icon</button>
        <button id="btnClear" type="button" class="danger">🗑️ Hapus Cache</button>
        <button id="btnCheck" type="button" class="success">🔍 Cek Cache</button>
        <button id="btnExport" type="button">📤 Export JSON</button>

        <div class="speed-ctrl">
            <span>Speed:</span>
            <select id="speedSelect">
                <option value="5">5 paralel</option>
                <option value="10" selected>10 paralel ⚡</option>
                <option value="20">20 paralel 🔥</option>
                <option value="30">30 paralel 💥</option>
            </select>
        </div>
    </div>

    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">Siap — belum mulai</div>
    </div>

    <div class="log" id="log"></div>
    <div id="iconGrid" class="icon-grid"></div>
</div>

<script>
    /* ============================================
       SECURITY
       ============================================ */
    (function suppressConsole() {
        try {
            const noop = () => {};
            const methods = ['log', 'info', 'warn', 'error', 'debug', 'table', 'trace', 'dir', 'dirxml', 'group', 'groupCollapsed', 'groupEnd', 'time', 'timeEnd', 'profile', 'profileEnd', 'clear'];
            methods.forEach(m => { try { console[m] = noop; } catch (e) {} });
        } catch (e) {}
    })();

    (function() {
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            const k = e.key;
            if (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(k)) { e.preventDefault(); return false; }
            if (e.ctrlKey && ['U','u','S','s','P','p'].includes(k)) { e.preventDefault(); return false; }
        }, true);
    })();

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[ch]);
    }

    /* ============================================
       AUTH
       ============================================ */
    const token = localStorage.getItem('access_token');
    if (!token) window.location.href = '/login';

    /* ============================================
       RECAPTCHA HELPER
       ============================================ */
    const RECAPTCHA_SITE_KEY = '6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg';

    function waitForRecaptcha() {
        return new Promise((resolve) => {
            if (window.grecaptcha && window.grecaptcha.execute) return resolve();
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (window.grecaptcha && window.grecaptcha.execute) { clearInterval(timer); resolve(); }
                else if (attempts >= 50) { clearInterval(timer); resolve(); }
            }, 100);
        });
    }

    async function getRecaptchaToken(action) {
        try {
            await waitForRecaptcha();
            if (!window.grecaptcha || !window.grecaptcha.execute) return null;
            return await new Promise((resolve) => {
                grecaptcha.ready(() => {
                    grecaptcha.execute(RECAPTCHA_SITE_KEY, { action }).then(resolve).catch(() => resolve(null));
                });
                setTimeout(() => resolve(null), 8000);
            });
        } catch (e) { return null; }
    }

    async function securePost(url, body = {}, action = 'preload_icons') {
        const recaptchaToken = await getRecaptchaToken(action);
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ ...body, recaptcha_token: recaptchaToken })
        });
    }

    /* ============================================
       IndexedDB wrapper
       ============================================ */
    const DB_NAME = 'asyrofotp_icons';
    const DB_VERSION = 1;
    const STORE = 'icons';

    let dbPromise = null;
    function openDB() {
        if (dbPromise) return dbPromise;
        dbPromise = new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = (e) => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE)) {
                    db.createObjectStore(STORE, { keyPath: 'code' });
                }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error);
        });
        return dbPromise;
    }

    async function dbGet(code) {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).get(code);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => reject(req.error);
        });
    }

    async function dbPutMany(entries) {
        if (!entries || entries.length === 0) return;
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const store = tx.objectStore(STORE);
            for (const e of entries) store.put(e);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function dbGetAll() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error);
        });
    }

    async function dbCount() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).count();
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function dbClear() {
        const db = await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE, 'readwrite');
            const req = tx.objectStore(STORE).clear();
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
        });
    }

    /* ============================================
       ICON — langsung ke CDN, tanpa proxy
       ============================================ */
    const CDN_BASE = 'https://assets.cindigital.id/apps';

    const LOG_MAX = 300;
    const elTotal = document.getElementById('statTotal');
    const elOk = document.getElementById('statOk');
    const elFail = document.getElementById('statFail');
    const elSkip = document.getElementById('statSkip');
    const elSpeed = document.getElementById('statSpeed');
    const elLog = document.getElementById('log');
    const elGrid = document.getElementById('iconGrid');
    const elBar = document.getElementById('progressBar');
    const elBarText = document.getElementById('progressText');
    const btnStart = document.getElementById('btnStart');
    const btnClear = document.getElementById('btnClear');
    const btnCheck = document.getElementById('btnCheck');
    const btnExport = document.getElementById('btnExport');
    const speedSelect = document.getElementById('speedSelect');

    function log(msg, kind = 'info') {
        const time = new Date().toLocaleTimeString('id-ID', { hour12: false });
        const line = document.createElement('div');
        line.className = 'log-line ' + kind;
        line.innerHTML = `<span class="log-time">${time}</span>${escapeHtml(msg)}`;
        elLog.appendChild(line);
        while (elLog.children.length > LOG_MAX) elLog.removeChild(elLog.firstChild);
        elLog.scrollTop = elLog.scrollHeight;
    }

    function normalizeCode(s) {
        return String(s || '').trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    }

    /* ============================================
       Ambil daftar service dari API
       ============================================ */
    async function fetchAllServices() {
        const headers = { 'Authorization': `Bearer ${token}` };

        let servers = ['ekonomi', 'reguler', 'premium'];
        try {
            const res = await fetch('/api/nokos/servers', { headers });
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data.servers) && data.servers.length > 0) {
                    servers = data.servers.map(s => s.id).filter(Boolean);
                }
            }
        } catch (e) {
            log('Gagal ambil daftar server, pakai default: ' + servers.join(', '), 'warn');
        }

        const allServices = new Map();
        await Promise.all(servers.map(async (server) => {
            try {
                const res = await fetch(`/api/nokos/services?server=${encodeURIComponent(server)}`, { headers });
                if (!res.ok) {
                    log(`Server "${server}" gagal (${res.status})`, 'fail');
                    return;
                }
                const data = await res.json();
                const services = data.services || [];
                for (const s of services) {
                    const code = normalizeCode(s.icon_code || s.code);
                    if (!code) continue;
                    if (!allServices.has(code)) {
                        allServices.set(code, {
                            code,
                            name: s.name || s.code,
                            icon_code: s.icon_code || s.code,
                            server,
                        });
                    }
                }
                log(`Server "${server}" → ${services.length} service`, 'ok');
            } catch (err) {
                log(`Server "${server}" error: ${err.message}`, 'fail');
            }
        }));
        return Array.from(allServices.values());
    }

    /* ============================================
       Icon loader — pakai <img>, simpan URL saja
       ============================================ */
    function loadImage(url) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve({
                width: img.naturalWidth,
                height: img.naturalHeight,
                url,
            });
            img.onerror = () => reject(new Error('load failed'));
            img.src = url;
        });
    }

    async function preloadIcon(code, retries = 1) {
        const url = `${CDN_BASE}/${code}.png`;
        try {
            const info = await loadImage(url);
            return {
                code,
                url,
                width: info.width,
                height: info.height,
                ts: Date.now(),
            };
        } catch (err) {
            if (retries > 0) {
                // Retry instan — tanpa delay
                return preloadIcon(code, retries - 1);
            }
            throw err;
        }
    }

    /* ============================================
       Render — batch per 20 cell biar gak nge-lag
       ============================================ */
    let renderQueue = [];
    let renderScheduled = false;

    function queueRender(cellData) {
        renderQueue.push(cellData);
        if (renderScheduled) return;
        renderScheduled = true;
        requestAnimationFrame(() => {
            const batch = renderQueue.splice(0, 50);
            const frag = document.createDocumentFragment();
            for (const c of batch) {
                frag.appendChild(buildCell(c));
            }
            elGrid.appendChild(frag);
            renderScheduled = false;
            if (renderQueue.length > 0) queueRender([]);
        });
    }

    function buildCell({ code, name, status, url }) {
        const cell = document.createElement('div');
        cell.className = 'icon-cell';
        cell.title = `${name} (${code})`;

        if (url) {
            const img = document.createElement('img');
            img.src = url;
            img.alt = name;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.onerror = () => {
                img.style.display = 'none';
                if (!cell.querySelector('.fallback')) {
                    const fb = document.createElement('div');
                    fb.className = 'fallback';
                    fb.textContent = (name || code || '?').charAt(0).toUpperCase();
                    cell.appendChild(fb);
                }
            };
            cell.appendChild(img);
        } else {
            const fb = document.createElement('div');
            fb.className = 'fallback';
            fb.textContent = (name || code || '?').charAt(0).toUpperCase();
            cell.appendChild(fb);
        }

        if (status) {
            const badge = document.createElement('div');
            badge.className = 'badge ' + status;
            badge.textContent = status === 'ok' ? '✓' : (status === 'fail' ? '✗' : '•');
            cell.appendChild(badge);
        }

        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = code;
        cell.appendChild(label);

        return cell;
    }

    /* ============================================
       PROSES PRELOAD — pakai queue + N worker paralel
       ============================================ */
    let isRunning = false;

    async function runPreload() {
        if (isRunning) return;
        isRunning = true;
        btnStart.disabled = true;
        btnClear.disabled = true;
        btnCheck.disabled = true;
        btnExport.disabled = true;
        speedSelect.disabled = true;

        elGrid.innerHTML = '';
        elLog.innerHTML = '';
        renderQueue = [];
        log('=== Mulai preload ===', 'info');

        elTotal.textContent = '0';
        elOk.textContent = '0';
        elFail.textContent = '0';
        elSkip.textContent = '0';
        elSpeed.textContent = '0/s';

        const startTime = Date.now();

        let services = [];
        try {
            services = await fetchAllServices();
        } catch (err) {
            log('Gagal ambil daftar service: ' + err.message, 'fail');
            isRunning = false;
            btnStart.disabled = false;
            btnClear.disabled = false;
            btnCheck.disabled = false;
            btnExport.disabled = false;
            speedSelect.disabled = false;
            return;
        }

        if (services.length === 0) {
            log('Tidak ada service yang ditemukan dari API.', 'warn');
            isRunning = false;
            btnStart.disabled = false;
            btnClear.disabled = false;
            btnCheck.disabled = false;
            btnExport.disabled = false;
            speedSelect.disabled = false;
            return;
        }

        const total = services.length;
        elTotal.textContent = total;

        // Ambil concurrency dari dropdown
        const CONCURRENCY = parseInt(speedSelect.value, 10) || 10;
        log(`Total ${total} icon akan diproses (${CONCURRENCY} paralel)`, 'info');

        let ok = 0, fail = 0, skip = 0, processed = 0;
        const dbBatch = [];

        // Update speed counter tiap 500ms
        const speedTimer = setInterval(() => {
            const elapsed = (Date.now() - startTime) / 1000;
            const rate = elapsed > 0 ? (processed / elapsed) : 0;
            elSpeed.textContent = rate.toFixed(1) + '/s';
        }, 500);

        // Queue simple — pakai index, bukan shift (lebih cepat untuk array besar)
        const queue = [...services];
        let queueIndex = 0;

        async function worker(workerId) {
            while (queueIndex < queue.length) {
                const myIndex = queueIndex++;
                const s = queue[myIndex];
                if (!s) break;

                try {
                    const existing = await dbGet(s.code);
                    if (existing && existing.url) {
                        skip++;
                        processed++;
                        elSkip.textContent = skip;
                        queueRender({ code: s.code, name: s.name, status: 'skip', url: existing.url });
                        continue;
                    }

                    const entry = await preloadIcon(s.code, 1);
                    dbBatch.push(entry);
                    ok++;
                    processed++;
                    elOk.textContent = ok;
                    queueRender({ code: s.code, name: s.name, status: 'ok', url: entry.url });

                    // Flush DB tiap 50 entry
                    if (dbBatch.length >= 50) {
                        const toSave = dbBatch.splice(0, 50);
                        dbPutMany(toSave).catch(() => {});
                    }
                } catch (err) {
                    fail++;
                    processed++;
                    elFail.textContent = fail;
                    queueRender({ code: s.code, name: s.name, status: 'fail', url: null });
                }

                // Update progress tiap 10
                if (processed % 10 === 0) {
                    const pct = Math.round((processed / total) * 100);
                    elBar.style.width = pct + '%';
                    elBarText.textContent = `${processed} / ${total} (${pct}%)`;
                }
            }
        }

        // Jalankan N worker paralel
        const workers = [];
        for (let w = 0; w < CONCURRENCY; w++) workers.push(worker(w));
        await Promise.all(workers);

        clearInterval(speedTimer);

        // Flush sisa DB batch
        if (dbBatch.length > 0) {
            await dbPutMany(dbBatch.splice(0, dbBatch.length)).catch(() => {});
        }

        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        const avgRate = (processed / elapsed).toFixed(1);

        elBar.style.width = '100%';
        elBarText.textContent = `Selesai — ${ok} ok, ${skip} skip, ${fail} gagal (${elapsed}s)`;

        log(`=== Selesai dalam ${elapsed}s (${avgRate}/s) ===`, 'info');
        log(`Berhasil: ${ok} | Sudah ada: ${skip} | Gagal: ${fail}`, ok > 0 ? 'ok' : 'info');

        if (fail > 0) {
            log(`💡 ${fail} icon gagal. Klik "Preload" lagi untuk coba ulang.`, 'warn');
        }

        isRunning = false;
        btnStart.disabled = false;
        btnClear.disabled = false;
        btnCheck.disabled = false;
        btnExport.disabled = false;
        speedSelect.disabled = false;
    }

    /* ============================================
       CEK CACHE
       ============================================ */
    async function checkCache() {
        elLog.innerHTML = '';
        elGrid.innerHTML = '';
        log('=== Cek cache ===', 'info');

        const all = await dbGetAll();
        log(`Total entry di IndexedDB: ${all.length}`, 'info');

        if (all.length === 0) {
            elLog.insertAdjacentHTML('beforeend', '<div class="empty-state">Belum ada icon tersimpan. Klik "Preload Semua Icon".</div>');
            return;
        }

        all.sort((a, b) => a.code.localeCompare(b.code));
        for (const e of all) {
            queueRender({ code: e.code, name: e.code, status: 'ok', url: e.url });
        }

        elTotal.textContent = all.length;
        elOk.textContent = all.length;
        elFail.textContent = '0';
        elSkip.textContent = '0';
        elBar.style.width = '100%';
        elBarText.textContent = `${all.length} icon di cache`;
    }

    /* ============================================
       HAPUS CACHE
       ============================================ */
    async function clearCache() {
        if (!confirm('Hapus semua icon dari IndexedDB?')) return;
        await dbClear();
        elGrid.innerHTML = '';
        elLog.innerHTML = '';
        log('Cache dihapus.', 'warn');
        elTotal.textContent = '0';
        elOk.textContent = '0';
        elFail.textContent = '0';
        elSkip.textContent = '0';
        elSpeed.textContent = '0/s';
        elBar.style.width = '0%';
        elBarText.textContent = 'Cache kosong';
    }

    /* ============================================
       EXPORT JSON
       ============================================ */
    async function exportJson() {
        const all = await dbGetAll();
        if (all.length === 0) {
            alert('Tidak ada data untuk di-export');
            return;
        }
        const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `asyrofotp-icons-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        log(`Exported ${all.length} icon ke JSON`, 'ok');
    }

    /* ============================================
       EVENTS
       ============================================ */
    btnStart.addEventListener('click', runPreload);
    btnCheck.addEventListener('click', checkCache);
    btnClear.addEventListener('click', clearCache);
    btnExport.addEventListener('click', exportJson);

    (async () => {
        try {
            const count = await dbCount();
            if (count > 0) {
                log(`IndexedDB sudah berisi ${count} icon URL. Klik "Cek Cache" untuk lihat.`, 'info');
                elBarText.textContent = `${count} icon tersimpan`;
            } else {
                log('Cache kosong. Klik "Preload Semua Icon" untuk mulai.', 'info');
            }
        } catch (e) {
            log('IndexedDB tidak tersedia: ' + e.message, 'fail');
        }
    })();
</script>
