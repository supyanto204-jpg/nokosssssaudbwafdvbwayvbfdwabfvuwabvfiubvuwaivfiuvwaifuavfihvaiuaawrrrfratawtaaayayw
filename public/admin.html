<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0a84ff">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Admin — AsyrofOTP</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0a84ff;--p-ink:#ffffff;
  --ok:#1f9d55;--warn:#b8860b;--err:#c0392b;--purple:#7c3aed;
  --bg:#ffffff;--surface:#f4f5f7;--surface-2:#ebedf0;
  --border:#d8dbe0;--border-2:#b9bec5;
  --txt:#0d0f12;--txt2:#525860;--txt3:#7a8189;
  --r-sm:10px;--r:14px;--r-lg:16px;--r-pill:999px;
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  color-scheme:light;
}
[data-theme="dark"]{
  --p:#4aa3ff;--p-ink:#06101a;
  --ok:#34c46b;--warn:#e0a800;--err:#ff6b60;--purple:#a78bfa;
  --bg:#0a0b0d;--surface:#14171a;--surface-2:#1b1f23;
  --border:#2a2f35;--border-2:#3a4047;
  --txt:#f2f4f6;--txt2:#a6adb5;--txt3:#7d858d;
  color-scheme:dark;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font:400 15px/1.55 var(--font);background:var(--bg);color:var(--txt);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;overflow-x:hidden}
img,svg{display:block;max-width:100%;height:auto}
a{color:var(--p);text-decoration:none}
button{font:inherit}
.ic{width:18px;height:18px;display:inline-block;vertical-align:middle;flex-shrink:0;pointer-events:none}
.spinner-sm{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
.layout{display:flex;min-height:100vh;min-height:100dvh}

/* Sidebar */
.sidebar{
  position:fixed;top:12px;left:12px;bottom:12px;width:240px;
  padding:16px 12px;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  z-index:300;transition:width .3s var(--ease-out),transform .3s var(--ease-out);overflow:hidden;
}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:0 4px}
.sidebar-logo{display:flex;align-items:center;gap:10px;color:var(--txt)}
.logo-icon{width:34px;height:34px;border-radius:10px;background:var(--txt);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0}
.logo-text{font-weight:700;font-size:.98rem;white-space:nowrap}
.logo-text span{color:var(--txt2);font-weight:500}
.collapse-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.collapse-btn .ic{width:14px;height:14px;transition:transform .3s var(--ease-out)}
.sidebar.collapsed{width:72px}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-section,.sidebar.collapsed .user-details,.sidebar.collapsed .logout-btn{display:none}
.sidebar.collapsed .collapse-btn .ic{transform:rotate(180deg)}
.sidebar.collapsed .sidebar-header{flex-direction:column;gap:10px;justify-content:center}
.sidebar.collapsed .sidebar-logo{justify-content:center}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--txt2);font-size:.86rem;font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.nav-item .ic{width:17px;height:17px}
.nav-item.active{background:var(--txt);color:var(--bg);font-weight:600}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px 0}
.nav-section{padding:12px 12px 4px;font:600 .62rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--txt3)}
.sidebar-footer{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.user-info{display:flex;align-items:center;gap:8px;padding:4px;min-width:0}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--surface-2);color:var(--txt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.86rem;flex-shrink:0}
.user-details{flex:1;min-width:0;overflow:hidden}
.user-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-balance{font:500 .72rem var(--mono);color:var(--p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.logout-btn .ic{width:14px;height:14px}

/* Main */
.main{margin-left:264px;padding:12px 16px 80px 0;min-width:0;display:flex;flex-direction:column;gap:14px}
body.sidebar-collapsed .main{margin-left:96px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);position:sticky;top:12px;z-index:20;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.topbar h1{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}
.topbar p{font-size:.76rem;color:var(--txt2);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px}
.icon-btn,.theme-btn,.mobile-toggle{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--txt2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn .ic,.theme-btn .ic,.mobile-toggle .ic{width:17px;height:17px}
.mobile-toggle{display:none}
.theme-btn{position:relative;padding:0}
.theme-btn .ic{position:absolute;transition:transform .3s var(--ease-spring),opacity .2s}
.theme-btn .i-sun{transform:scale(1) rotate(0);opacity:1}
.theme-btn .i-moon{transform:scale(0) rotate(-90deg);opacity:0}
.theme-btn .i-auto{transform:scale(0) rotate(-90deg);opacity:0}
[data-theme-pref="light"]  .theme-btn .i-sun{transform:scale(1) rotate(0);opacity:1}
[data-theme-pref="dark"]   .theme-btn .i-moon{transform:scale(1) rotate(0);opacity:1}
[data-theme-pref="dark"]   .theme-btn .i-sun{transform:scale(0) rotate(90deg);opacity:0}
[data-theme-pref="system"] .theme-btn .i-auto{transform:scale(1) rotate(0);opacity:1}
[data-theme-pref="system"] .theme-btn .i-sun{transform:scale(0) rotate(90deg);opacity:0}
.icon-btn.spinning .ic{animation:spin .8s linear infinite}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);transition:background 0.3s;}
.stat.flash{animation:flash-bg 1s ease-out;}
@keyframes flash-bg{0%{background:var(--p);}100%{background:var(--surface);}}
.stat-label{font:600 .62rem var(--mono);color:var(--txt2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.stat-value{font:700 1.25rem var(--mono);color:var(--txt);letter-spacing:-.02em}

/* Tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:var(--r-pill);border:none;background:transparent;color:var(--txt2);font-weight:500;font-size:.78rem;white-space:nowrap;cursor:pointer;transition:background-color .2s,color .2s;min-height:34px}
.tab.active{background:var(--txt);color:var(--bg);font-weight:600}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-bar{position:relative;display:flex;align-items:center;flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 14px;min-height:40px}
.search-bar .ic{color:var(--txt3);width:16px;height:16px;position:absolute;left:14px;pointer-events:none}
.search-bar input{flex:1;padding:9px 0 9px 28px;border:none;outline:none;background:transparent;font:inherit;font-size:.88rem;color:var(--txt);min-width:0}
.filter-select{padding:9px 12px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--surface);color:var(--txt);font:inherit;font-size:.8rem;cursor:pointer;min-height:40px}

/* List */
#content{display:flex;flex-direction:column;gap:10px}
.card{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;gap:10px; transition: background 0.5s;}
.card.row-new-user { border-left: 4px solid var(--purple); background: color-mix(in srgb, var(--purple) 5%, var(--surface)); }
.card-header{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--border)}
.card-title{font-weight:600;font-size:.9rem;margin-bottom:2px;word-break:break-word}
.card-sub{font:.72rem var(--mono);color:var(--txt2);word-break:break-all}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field-label{font:600 .6rem var(--mono);color:var(--txt3);text-transform:uppercase;letter-spacing:.04em}
.field-value{font:600 .8rem var(--mono);color:var(--txt);word-break:break-all}
.field-value.primary{color:var(--p)}
.field-value.success{color:var(--ok)}
.field-value.warning{color:var(--warn)}
.field-value.danger{color:var(--err)}
.field-value.purple{color:var(--purple)}

.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--r-pill);font:600 .68rem var(--mono);flex-shrink:0}
.badge.success{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.badge.warning{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.danger{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.badge.gray{background:var(--surface-2);color:var(--txt3)}
.badge.info{background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--p)}
.badge.purple{background:color-mix(in srgb,var(--purple) 14%,transparent);color:var(--purple)}

.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:90px;font-size:.74rem;padding:7px 10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--txt);font-weight:500;font-size:.8rem;cursor:pointer;transition:background-color .2s,border-color .2s;min-height:38px}
.btn:active{transform:scale(.97)}
.btn .ic{width:14px;height:14px}
.btn-primary{background:var(--p);color:var(--p-ink);border-color:var(--p)}
.btn-danger{background:var(--err);color:#fff;border-color:var(--err)}
.btn-success{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Empty/Error */
.empty{text-align:center;padding:40px 20px;color:var(--txt2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty p{font-size:.85rem}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 0}
.page-btn{min-width:40px;height:40px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--border);background:transparent;color:var(--txt);font-weight:500;font-size:.78rem;cursor:pointer}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font:.76rem var(--mono);color:var(--txt2);font-weight:600}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:none;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s}
.modal-overlay.active{display:flex;opacity:1}
.modal{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);animation:modalPop .3s var(--ease-spring)}
@keyframes modalPop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);z-index:2;border-radius:var(--r-lg) var(--r-lg) 0 0}
.modal-title{font-weight:600;font-size:.9rem;flex:1;min-width:0}
.modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--txt);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.modal-close .ic{width:14px;height:14px}
.modal-body{padding:16px;display:flex;flex-direction:column;gap:12px}

/* Form */
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font:600 .66rem var(--mono);color:var(--txt2);text-transform:uppercase;letter-spacing:.04em}
.form-control{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--txt);font:inherit;font-size:.88rem;outline:none}
.form-control:focus{border-color:var(--p)}

/* Alert */
.alert-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
.alert-overlay.active{display:flex;opacity:1}
.alert-box{max-width:380px;width:100%;padding:24px 20px 20px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);animation:modalPop .3s var(--ease-spring)}
.alert-box h3{font-size:1rem;font-weight:600;margin-bottom:6px}
.alert-box p{font-size:.84rem;color:var(--txt2);line-height:1.5;margin-bottom:16px}
.alert-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.alert-actions .btn{flex:1;min-width:100px}

/* Log list */
.log-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;padding:6px;background:var(--surface);border-radius:8px}
.log-item{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font:.72rem var(--mono)}
.log-time{color:var(--txt3);font-size:.65rem;margin-bottom:2px}
.log-text{word-break:break-word}

/* Tools grid */
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.tool-card{padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;gap:8px}
.tool-card h4{font-size:.86rem;font-weight:600}
.tool-card p{font-size:.74rem;color:var(--txt2);line-height:1.4}
.tool-result{padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font:.68rem var(--mono);max-height:180px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;display:none}
.tool-result.show{display:block}
.tool-result.success{border-color:var(--ok);color:var(--ok)}
.tool-result.error{border-color:var(--err);color:var(--err)}

/* Security gate */
.gate{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.gate.hidden{display:none}
.gate-spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
.gate-spinner.frozen{animation:none;border-color:color-mix(in srgb,var(--err) 30%,transparent);border-top-color:var(--err)}
.gate-text{font:.84rem var(--mono);font-weight:500;color:var(--txt2);text-align:center}
.gate-text.frozen{color:var(--err)}

/* Login Form */
.login-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 300px; margin-top: 20px; }
.login-form input { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--txt); text-align: center; font-size: 16px; }
.login-form button { padding: 12px; border-radius: 8px; border: none; background: var(--p); color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }

/* Responsive */
@media (max-width:1024px){
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .sidebar{transform:translateX(-120%);width:260px;z-index:300;background:var(--bg)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:10px 12px 80px}
  body.sidebar-collapsed .main{margin-left:0}
  .mobile-toggle{display:flex}
  .collapse-btn{display:none}
  .topbar{padding:10px 12px;top:10px}
  .topbar h1{font-size:1rem}
  .topbar p{font-size:.72rem}
  .stats{gap:8px}
  .stat{padding:10px}
  .stat-value{font-size:1.05rem}
  .nav-item,.tab,.btn,.page-btn,.mobile-toggle,.icon-btn,.theme-btn{min-height:44px}
  .mobile-toggle,.icon-btn,.theme-btn{min-width:44px}
  input,select,textarea{font-size:16px}
}
@media (max-width:480px){
  .actions .btn{min-width:100%}
}
</style>
<script>
(function(){
  var d=document.documentElement;
  try{
    var pref=localStorage.getItem('asyrofotp_theme_pref');
    if(!pref){var old=localStorage.getItem('asyrofotp_theme');pref=(old==='light'||old==='dark')?old:'system';}
    var resolved=pref==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):pref;
    d.setAttribute('data-theme',resolved);d.setAttribute('data-theme-pref',pref);
  }catch(e){d.setAttribute('data-theme','light');d.setAttribute('data-theme-pref','system');}
})();
</script>
</head>
<body>

<!-- GATE / LOGIN SCREEN -->
<div class="gate" id="gate">
  <div class="gate-spinner" id="gateSpinner" style="display:none;"></div>
  <div class="gate-text" id="gateText" style="font-size:1.2rem; font-weight:bold; color:var(--p);">🔒 Admin Access</div>
  <div class="login-form" id="loginForm">
    <input type="password" id="adminPw" placeholder="Masukkan ADMIN_PW_UNIK">
    <button onclick="doAdminLogin()">Buka Akses</button>
  </div>
  <div class="gate-text" id="loginError" style="color:var(--err); display:none;">Password Salah!</div>
</div>

<div id="app" hidden>
<div class="layout">

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="/dashboard" class="sidebar-logo">
      <div class="logo-icon">A</div>
      <div class="logo-text">Asyrof<span>OTP</span></div>
    </a>
    <button class="collapse-btn" id="collapseBtn" type="button" title="Collapse">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <a href="/admin?user" class="nav-item" data-nav="user">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Users</span>
    </a>
    <a href="/admin?order" class="nav-item" data-nav="order">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      <span class="nav-label">Orders</span>
    </a>
    <a href="/admin?depo" class="nav-item" data-nav="depo">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <span class="nav-label">Deposits</span>
    </a>
    <a href="/admin?monitor" class="nav-item" data-nav="monitor">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <span class="nav-label">Monitor</span>
    </a>
    <a href="/admin?tools" class="nav-item" data-nav="tools">

<script>
(function(){
'use strict';

var D=document,W=window;
var $=function(id){return D.getElementById(id)};
var q=function(s,c){return (c||D).querySelector(s)};
var qa=function(s,c){return Array.prototype.slice.call((c||D).querySelectorAll(s))};

// STATE UNTUK LIVE POLLING
var adminPw = null;
var pollInterval = null;
var isFirstLoad = true;
var oldStats = { users: 0, orders: 0, pending: 0 };
const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");

// FUNGSI LOGIN
window.doAdminLogin = async function() {
  var pw = $('adminPw').value;
  if(!pw) return;
  
  var btn = q('#loginForm button');
  btn.disabled = true; btn.textContent = "Memverifikasi...";
  
  try {
    var res = await fetch('/api/admin/login-unik', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    var data = await res.json();
    
    if(data.ok) {
      adminPw = pw; // Simpen di memory
      $('gate').classList.add('hidden');
      $('app').hidden = false;
      
      // Mulai Live Polling
      loadStats();
      setActiveTab(getTabFromURL());
      startPolling();
    } else {
      $('loginError').style.display = 'block';
      btn.disabled = false; btn.textContent = "Buka Akses";
    }
  } catch(e) {
    alert('Gagal konek ke server');
    btn.disabled = false; btn.textContent = "Buka Akses";
  }
};

var Safe=(function(){
  var ls=null;
  try{ls=W.localStorage;ls.setItem('__t','1');ls.removeItem('__t')}catch(e){ls=null}
  var mem=new Map();
  return{
    get:function(k){try{return ls?ls.getItem(k):(mem.get(k)??null)}catch(e){return mem.get(k)??null}},
    set:function(k,v){try{if(ls)ls.setItem(k,v);else mem.set(k,v)}catch(e){mem.set(k,v)}},
    remove:function(k){try{if(ls)ls.removeItem(k);else mem.delete(k)}catch(e){mem.delete(k)}}
  };
})();

function safeJson(res){return res.json().catch(function(){return{}})}
function esc(v){return String(v??'').replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]})}
function fmtRp(n){return 'Rp'+(Number(n)||0).toLocaleString('id-ID')}
function fmtDate(iso){
  if(!iso)return '—';
  try{return new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}
}
function initial(name){return String(name||'?').trim().charAt(0).toUpperCase()||'?'}

async function api(url,opts){
  opts=opts||{};
  var headers=Object.assign({
    'Authorization':'Bearer '+adminPw, // PAKE PASSWORD ADMIN
    'Content-Type':'application/json'
  },opts.headers||{});
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort()},15000):null;
  var o=Object.assign({},opts,{headers:headers});
  if(ctrl)o.signal=ctrl.signal;
  try{
    var res=await fetch(url,o);
    var data=await safeJson(res);
    if(!res.ok)throw new Error(data.error||'Request failed ('+res.status+')');
    return data;
  }finally{if(timer)clearTimeout(timer)}
}

/* LIVE POLLING */
function startPolling() {
    pollInterval = setInterval(fetchLiveData, 5000);
}

async function fetchLiveData() {
    try {
        var data = await api('/api/admin/stats');
        
        if(!isFirstLoad) {
            // Cek apakah ada data baru masuk (User/Order/Pending Depo)
            if(data.total_users > oldStats.users || data.total_orders > oldStats.orders || data.pending_deposits > oldStats.pending) {
                audio.play().catch(e => console.log('Audio autoplay diblokir'));
                if(data.total_users > oldStats.users) flashCard('card-users');
                if(data.total_orders > oldStats.orders) flashCard('card-orders');
                if(data.pending_deposits > oldStats.pending) flashCard('card-pending');
            }
        }
        
        oldStats = { users: data.total_users||0, orders: data.total_orders||0, pending: data.pending_deposits||0 };
        isFirstLoad = false;
        
        $('statUsers').textContent = data.total_users||0;
        $('statOrders').textContent = data.total_orders||0;
        $('statPending').textContent = data.pending_deposits||0;
        $('statBalance').textContent = fmtRp(data.total_balance||0);
        
        // Kalau lagi di tab user/order/depo, refresh tabelnya juga tiap 5 detik
        if(['user', 'order', 'depo'].includes(state.tab)) {
            loadTab(); 
        }
        
    } catch(e) { console.error('Polling error', e); }
}

function flashCard(id) {
    var el = $(id);
    if(!el) return;
    el.classList.remove('flash');
    void el.offsetWidth; // trigger reflow
    el.classList.add('flash');
}

/* Alert */
function showAlert(opts){
  return new Promise(function(resolve){
    var ov=$('alertOverlay');
    if(!ov){resolve(W.confirm(opts.message||opts.title||'OK'));return}
    $('alertTitle').textContent=opts.title||'Info';
    $('alertMessage').textContent=opts.message||'';
    var act=$('alertActions');
    act.innerHTML='';
    if(opts.showCancel){
      var b=D.createElement('button');
      b.className='btn';b.type='button';b.textContent=opts.cancelText||'Batal';
      b.addEventListener('click',function(){ov.classList.remove('active');resolve(false)});
      act.appendChild(b);
    }
    var ok=D.createElement('button');
    ok.className='btn btn-primary'+(opts.type==='danger'||opts.type==='error'?' btn-danger':'');
    ok.type='button';ok.textContent=opts.okText||'OK';
    ok.addEventListener('click',function(){ov.classList.remove('active');resolve(true)});
    act.appendChild(ok);
    ov.classList.add('active');
  });
}

function confirmBox(msg,title){
  return showAlert({title:title||'Konfirmasi',message:msg,type:'warning',okText:'Ya',showCancel:true});
}

/* Theme */
(function(){
  var btn=$('themeBtn');
  if(!btn)return;
  var root=D.documentElement;
  var mq=W.matchMedia?W.matchMedia('(prefers-color-scheme: dark)'):null;
  function resolve(p){return p==='system'?(mq&&mq.matches?'dark':'light'):p}
  function paintMeta(t){
    var m=q('meta[name="theme-color"]');
    if(m)m.setAttribute('content',t==='dark'?'#0a0b0d':'#0a84ff');
  }
  function setPref(p,save){
    root.setAttribute('data-theme-pref',p);
    var r=resolve(p);
    root.setAttribute('data-theme',r);paintMeta(r);
    if(save)Safe.set('asyrofotp_theme_pref',p);
  }
  btn.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme-pref')||'system';
    setPref(cur==='light'?'dark':cur==='dark'?'system':'light',true);
  });
})();

/* Sidebar */
(function(){
  var sb=$('sidebar'),cb=$('collapseBtn'),mt=$('mobileToggle'),ov=$('sidebarOverlay');
  if(!sb)return;
  if(cb&&W.innerWidth>768){
    if(Safe.get('sidebar_collapsed')==='true'){
      sb.classList.add('collapsed');D.body.classList.add('sidebar-collapsed');
    }
    cb.addEventListener('click',function(){
      if(W.innerWidth<=768)return;
      var c=sb.classList.toggle('collapsed');
      D.body.classList.toggle('sidebar-collapsed',c);
      Safe.set('sidebar_collapsed',c?'true':'false');
    });
  }
  var open=false;
  function openSb(){if(open)return;open=true;sb.classList.add('open');if(ov)ov.classList.add('active');D.body.style.overflow='hidden'}
  function closeSb(){if(!open)return;open=false;sb.classList.remove('open');if(ov)ov.classList.remove('active');D.body.style.overflow=''}
  if(mt)mt.addEventListener('click',function(e){e.preventDefault();if(open)closeSb();else openSb()});
  if(ov)ov.addEventListener('click',closeSb);
  qa('.nav-item',sb).forEach(function(l){l.addEventListener('click',function(){if(W.innerWidth<=768)setTimeout(closeSb,100)})});
  D.addEventListener('keydown',function(e){if(e.key==='Escape'&&open)closeSb()});
})();

/* Logout */
function doLogout(){
    adminPw = null;
    clearInterval(pollInterval);
    W.location.reload();
}
var lb=$('logoutBtn');
if(lb)lb.addEventListener('click',function(){
  confirmBox('Yakin mau keluar dari akun ini?','Keluar Akun?').then(function(ok){if(ok)doLogout()});
});

/* Tabs & routing */
var TABS={
  user:{title:'Users',subtitle:'Kelola semua user',search:true,filter:false},
  order:{title:'Orders',subtitle:'Semua transaksi nokos',search:true,filter:true},
  depo:{title:'Deposits',subtitle:'Semua riwayat deposit',search:true,filter:true},
  monitor:{title:'Monitor',subtitle:'Log event webhook & sync',search:false,filter:false},
  tools:{title:'Tools',subtitle:'Utilitas admin',search:false,filter:false},
  audit:{title:'Audit Log',subtitle:'Rekam jejak aksi admin',search:false,filter:false}
};

var ORDER_STATUSES=['success','pending','failed','expired','cancelled','refunded'];
var DEPO_STATUSES=['success','pending','failed','expired','cancelled','refunded'];

var state={
  tab:'user',
  page:1,
  search:'',
  status:''
};

function getTabFromURL(){
  var p=new URLSearchParams(W.location.search);
  var t=p.get('tab')||p.get('t')||'';
  if(TABS[t])return t;
  var keys=Object.keys(TABS);
  for(var i=0;i<keys.length;i++){
    if(p.has(keys[i]))return keys[i];
  }
  return 'user';
}

function setActiveTab(tab){
  state.tab=tab;
  qa('.nav-item').forEach(function(n){
    n.classList.toggle('active',n.dataset.nav===tab);
  });
  var t=TABS[tab];
  $('pageTitle').textContent=t.title;
  $('pageSubtitle').textContent=t.subtitle;
  var sb=$('searchInput').closest('.search-bar');
  if(sb)sb.style.display=t.search?'flex':'none';
  var sf=$('statusFilter');
  if(sf){
    sf.style.display=t.filter?'block':'none';
    if(t.filter){
      var statuses=tab==='order'?ORDER_STATUSES:DEPO_STATUSES;
      sf.innerHTML='<option value="">Semua Status</option>'+statuses.map(function(s){
        return '<option value="'+s+'">'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'
      }).join('');
      sf.value=state.status;
    }
  }
  state.page=1;
  state.search='';
  state.status='';
  $('searchInput').value='';
  if(sf)sf.value='';
  loadTab();
}

function loadTab(){
  var tab=state.tab;
  $('pagination').hidden=true;
  if(tab==='user')loadUsers();
  else if(tab==='order')loadOrders();
  else if(tab==='depo')loadDeposits();
  else if(tab==='monitor')loadMonitor();
  else if(tab==='tools')loadTools();
  else if(tab==='audit')loadAudit();
}

/* Stats */
async function loadStats(){
  try{
    var data=await api('/api/admin/stats');
    $('statUsers').textContent=data.total_users||0;
    $('statOrders').textContent=data.total_orders||0;
    $('statPending').textContent=data.pending_deposits||0;
    $('statBalance').textContent=fmtRp(data.total_balance||0);
  }catch(e){}
}

/* Render helpers */
function emptyBlock(msg){return '<div class="empty"><p>'+esc(msg)+'</p></div>'}
function loadingBlock(msg){return '<div class="empty"><div class="spinner-sm"></div><p>'+esc(msg)+'</p></div>'}
function errorBlock(msg){return '<div class="empty"><p style="color:var(--err)">'+esc(msg)+'</p></div>'}

function renderPagination(data,onPage){
  var el=$('pagination');
  if(!el)return;
  if(!data.total_pages||data.total_pages<=1){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=
    '<button class="page-btn" data-page="'+(data.page-1)+'" '+(data.page<=1?'disabled':'')+'>← Prev</button>'+
    '<span class="page-info">'+data.page+' / '+data.total_pages+'</span>'+
    '<button class="page-btn" data-page="'+(data.page+1)+'" '+(data.page>=data.total_pages?'disabled':'')+'>Next →</button>';
  qa('.page-btn',el).forEach(function(b){
    b.addEventListener('click',function(){
      var p=Number(b.dataset.page);
      if(p>=1&&p<=data.total_pages)onPage(p);
    });
  });
}

/* USERS */
async function loadUsers(){
  var c=$('content');
  if(c.innerHTML.indexOf('spinner-sm')===-1) c.innerHTML=loadingBlock('Memuat users...');
  try{
    var qs=new URLSearchParams({page:state.page,limit:20,search:state.search});
    var data=await api('/api/admin/users?'+qs.toString());
    if(!data.users||data.users.length===0){c.innerHTML=emptyBlock('Belum ada user');return}
    c.innerHTML=data.users.map(function(u){
      var banned=u.status==='banned';
      
      // Cek user baru (dibuat < 5 menit lalu)
      var diff = new Date() - new Date(u.created_at);
      var isNew = diff < (5 * 60 * 1000);
      
      return '<div class="card '+(isNew?'row-new-user':'')+'">'+
        '<div class="card-header">'+
          '<div style="flex:1;min-width:0">'+
            '<div class="card-title">'+esc(u.name||u.username)+
              (u.role==='admin'?' <span class="badge info">ADMIN</span>':'')+
              (banned?' <span class="badge danger">BANNED</span>':'')+
              (isNew?' <span class="badge purple">NEW</span>':'')+
            '</div>'+
            '<div class="card-sub">@'+esc(u.username)+' · '+esc(u.user_code||'—')+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="grid-2">'+
          '<div class="field"><span class="field-label">Saldo</span><span class="field-value primary">'+fmtRp(u.balance)+'</span></div>'+
          '<div class="field"><span class="field-label">Order</span><span class="field-value">'+(u.total_orders||0)+'</span></div>'+
          '<div class="field"><span class="field-label">Deposit</span><span class="field-value">'+(u.total_deposits||0)+'</span></div>'+
          '<div class="field"><span class="field-label">Dibuat</span><span class="field-value" style="font-size:.7rem">'+fmtDate(u.created_at)+'</span></div>'+
        '</div>'+
        '<div class="actions">'+
          '<button class="btn" data-act="user-detail" data-id="'+esc(u.id)+'">Detail</button>'+
          '<button class="btn btn-primary" data-act="user-balance" data-id="'+esc(u.id)+'" data-name="'+esc(u.username)+'" data-balance="'+u.balance+'">Saldo</button>'+
          '<button class="btn" data-act="user-role" data-id="'+esc(u.id)+'" data-role="'+esc(u.role)+'">Role</button>'+
          '<button class="btn '+(banned?'btn-success':'btn-danger')+'" data-act="user-ban" data-id="'+esc(u.id)+'" data-status="'+esc(u.status)+'">'+(banned?'Unban':'Ban')+'</button>'+
          '<button class="btn" data-act="user-pass" data-id="'+esc(u.id)+'" data-name="'+esc(u.username)+'">Reset Pass</button>'+
        '</div>'+
      '</div>';
    }).join('');
    bindUserActions();
    renderPagination(data,function(p){state.page=p;loadUsers()});
  }catch(e){c.innerHTML=errorBlock(e.message)}
}

function bindUserActions(){
  qa('[data-act="user-detail"]').forEach(function(b){b.addEventListener('click',function(){showUserDetail(b.dataset.id)})});
  qa('[data-act="user-balance"]').forEach(function(b){b.addEventListener('click',function(){showBalanceModal(b.dataset.id,b.dataset.name,Number(b.dataset.balance))})});
  qa('[data-act="user-role"]').forEach(function(b){b.addEventListener('click',function(){showRoleModal(b.dataset.id,b.dataset.role)})});
  qa('[data-act="user-ban"]').forEach(function(b){b.addEventListener('click',function(){toggleBan(b.dataset.id,b.dataset.status)})});
  qa('[data-act="user-pass"]').forEach(function(b){b.addEventListener('click',function(){showResetPassModal(b.dataset.id,b.dataset.name)})});
}

async function showUserDetail(id){
  openModal('<div class="modal-body">'+loadingBlock('Memuat...')+'</div>');
  try{
    var data=await api('/api/admin/users/'+encodeURIComponent(id));
    var u=data.user,s=data.stats;
    var logs=(data.balance_logs||[]).map(function(l){
      var meta=l.metadata||{};
      var adj=Number(meta.adjustment||0);
      var adjTxt=adj>0?'+'+fmtRp(adj):(adj<0?'-'+fmtRp(Math.abs(adj)):'');
      return '<div class="log-item"><div class="log-time">'+fmtDate(l.created_at)+'</div><div class="log-text">'+esc(l.reason||'')+
        (adjTxt?' <strong style="color:'+(adj>0?'var(--ok)':'var(--err)')+'">'+adjTxt+'</strong>':'')+'</div></div>';
    }).join('')||'<div class="log-item" style="text-align:center;color:var(--txt3)">Belum ada</div>';

    openModal(
      '<div class="modal-header"><div class="modal-title">Detail User</div>'+
      '<button class="modal-close" data-close-modal type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'+
      '<div class="modal-body">'+
        '<div style="text-align:center">'+
          '<div style="width:56px;height:56px;border-radius:50%;background:var(--surface-2);color:var(--txt);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;margin:0 auto 8px">'+esc(initial(u.name||u.username))+'</div>'+
          '<h3 style="font-size:1rem;font-weight:600">'+esc(u.name||u.username)+'</h3>'+
          '<div style="color:var(--txt2);font-size:.74rem;font-family:var(--mono)">@'+esc(u.username)+'</div>'+

/* ORDERS */
function statusClass(s){
  if(['success','received','confirmed'].includes(s))return 'success';
  if(s==='pending')return 'warning';
  if(['cancelled','expired','failed'].includes(s))return 'danger';
  if(s==='refunded')return 'purple';
  return 'gray';
}

        '<div class="grid-2">'+
          '<div class="field"><span class="field-label">User</span><span class="field-value">@'+esc(o.username||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Nomor</span><span class="field-value">'+esc(o.phone_number||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Harga</span><span class="field-value primary">'+fmtRp(o.price)+'</span></div>'+

/* STATUS MODAL */
function showStatusModal(type,id,current){
  var statuses=type==='order'?ORDER_STATUSES:DEPO_STATUSES;
  openModal(
    '<div class="modal-header"><div class="modal-title">Ubah Status '+(type==='order'?'Order':'Deposit')+'</div>'+
    '<button class="modal-close" data-close-modal type="button"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><span class="field-label">ID</span><span class="field-value primary">'+esc(id)+'</span></div>'+
      '<div class="form-group"><label class="form-label">Status Baru</label><select class="form-control" id="statusSelect">'+
        statuses.map(function(s){return '<option value="'+s+'" '+(s===current?'selected':'')+'>'+s+'</option>'}).join('')+
      '</select></div>'+
      '<div class="form-group"><label class="form-label">Catatan (opsional)</label><input class="form-control" type="text" id="statusNote" placeholder="Alasan"></div>'+
      '<button class="btn btn-primary btn-block" type="button" id="statusSave">Simpan</button>'+
    '</div>'
  );
  $('statusSave').addEventListener('click',async function(){
    var ns=$('statusSelect').value;
    var note=$('statusNote').value.trim();
    if(ns===current)return closeModal();
    var ok=await confirmBox('Ubah status dari "'+current+'" ke "'+ns+'"? Saldo user akan disesuaikan.');
    if(!ok)return;
    var btn=$('statusSave');btn.disabled=true;btn.innerHTML='<span class="spinner-sm"></span>';
    try{
      var ep=type==='order'?'/api/admin/order/':'/api/admin/deposit/';
      var res=await api(ep+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:ns,note:note})});
      closeModal();
      var adj=Number(res.balance_adjustment)||0;
      var adjTxt=adj>0?'+'+fmtRp(adj):(adj<0?'-'+fmtRp(Math.abs(adj)):'tidak ada adjustment');
      showAlert({title:'Berhasil',message:'Status "'+ns+'". Saldo: '+adjTxt,type:'success'});
      loadTab();loadStats();
    }catch(e){btn.disabled=false;btn.innerHTML='Simpan';showAlert({title:'Gagal',message:e.message,type:'danger'})}
  });
}

/* MONITOR */
async function loadMonitor(){
  var c=$('content');
  c.innerHTML=loadingBlock('Memuat monitor...');
  try{
    var qs=new URLSearchParams({hours:'6',type:'all',limit:'100'});
    var data=await api('/api/admin/webhook-monitor?'+qs.toString());
    if(!data.events||data.events.length===0){c.innerHTML=emptyBlock('Tidak ada event');return}
    c.innerHTML=data.events.map(function(e){
      var isOtp=e.entity_type==='order';
      var cls=statusClass(e.new_status);
      var body='';
      if(isOtp&&e.order){
        var notified=!!e.order.notified_at;
        body='<div class="grid-2">'+
          '<div class="field"><span class="field-label">OTP ID</span><span class="field-value primary">'+esc(e.order.otp_id||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Service</span><span class="field-value">'+esc(e.order.service_name||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Phone</span><span class="field-value">'+esc(e.order.phone||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">OTP</span><span class="field-value success">'+esc(e.order.otp_code||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">User</span><span class="field-value">@'+esc((e.user&&e.user.username)||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Status</span><span class="field-value '+cls+'">'+esc(e.old_status||'—')+' → '+esc(e.new_status)+'</span></div>'+
        '</div>';
      }else if(e.deposit){
        body='<div class="grid-2">'+
          '<div class="field"><span class="field-label">Reference</span><span class="field-value primary">'+esc(e.deposit.reference_id||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Amount</span><span class="field-value success">'+fmtRp(e.deposit.amount)+'</span></div>'+
          '<div class="field"><span class="field-label">User</span><span class="field-value">@'+esc((e.user&&e.user.username)||'—')+'</span></div>'+
          '<div class="field"><span class="field-label">Status</span><span class="field-value '+cls+'">'+esc(e.old_status||'—')+' → '+esc(e.new_status)+'</span></div>'+
        '</div>';
      }
      return '<div class="card"><div class="card-header"><div style="flex:1;min-width:0">'+
        '<div class="card-title">'+(isOtp?'OTP':'Deposit')+'</div>'+
        '<div class="card-sub">'+fmtDate(e.created_at)+'</div>'+
        '</div><span class="badge '+cls+'">'+esc(e.new_status).toUpperCase()+'</span></div>'+body+'</div>';
    }).join('');
  }catch(e){c.innerHTML=errorBlock(e.message)}
}

/* TOOLS */
function loadTools(){
  var c=$('content');
  c.innerHTML=
    '<div class="tools-grid">'+
      toolCard('db-cleaner','🗑️ Bersihkan DB','Hapus user saldo 0 & last login > 30 hari lalu (atau null).')+
      toolCard('stats','📊 Stats Notif','Lihat jumlah notif terkirim & pending.')+
      toolCard('test-otp','🧪 Test Notif OTP','Kirim pesan test ke channel OTP.')+
      toolCard('test-depo','🧪 Test Notif Deposit','Kirim pesan test ke channel deposit.')+
      toolCard('backfill','🔄 Backfill Notif','Kirim notif ke yang belum terkirim.')+
      toolCard('profit','💰 Profit Report','Laporan profit nokos + fee deposit.')+
      toolCard('plocks','📈 Price Locks','Lihat cache harga yang di-lock.')+
      toolCard('srv','🔍 Server Balance','Cek saldo server provider.')+
    '</div>';

  qa('[data-tool]').forEach(function(b){
    b.addEventListener('click',function(){runTool(b.dataset.tool,b)});
  });
}

function toolCard(id,title,desc){
  return '<div class="tool-card">'+
    '<h4>'+title+'</h4>'+
    '<p>'+desc+'</p>'+
    '<div class="form-group" id="'+id+'Form" style="display:none"></div>'+
    '<button class="btn btn-primary" type="button" data-tool="'+id+'">Jalankan</button>'+
    '<div class="tool-result" id="res-'+id+'"></div>'+
  '</div>';
}

async function runTool(tool,btn){
  var resEl=$('res-'+tool);
  if(!resEl)return;
  resEl.classList.add('show');
  resEl.className='tool-result show';
  resEl.textContent='Loading...';
  var orig=btn.innerHTML;
  btn.disabled=true;btn.innerHTML='<span class="spinner-sm"></span>';

  try{
    var result;
    if(tool==='db-cleaner'){
      var dry=await confirmBox('Jalankan DRY RUN dulu buat lihat berapa user yang bakal dihapus?','DB Cleaner');
      if(dry){
        result=await api('/api/admin/cleanup-users',{method:'POST',body:JSON.stringify({dry_run:true,days:30})});
      }else{
        var ok=await confirmBox('⚠️ HAPUS PERMANEN user saldo 0 & last login > 30 hari? Tidak bisa dibatalkan.','Konfirmasi Hapus');
        if(!ok){btn.disabled=false;btn.innerHTML=orig;resEl.textContent='Dibatalkan';return}
        result=await api('/api/admin/cleanup-users',{method:'POST',body:JSON.stringify({dry_run:false,days:30})});
      }
    }else if(tool==='stats'){
      result=await api('/api/admin/test-notif',{method:'POST',body:JSON.stringify({type:'stats'})});
    }else if(tool==='test-otp'){
      result=await api('/api/admin/test-notif',{method:'POST',body:JSON.stringify({type:'otp'})});
    }else if(tool==='test-depo'){
      result=await api('/api/admin/test-notif',{method:'POST',body:JSON.stringify({type:'deposit'})});
    }else if(tool==='backfill'){
      var okBf=await confirmBox('Kirim notif ke semua yang belum terkirim? Batch 50.','Backfill');
      if(!okBf){btn.disabled=false;btn.innerHTML=orig;resEl.textContent='Dibatalkan';return}
      result=await api('/api/admin/backfill-notifs',{method:'POST',body:JSON.stringify({type:'all',days:30,limit:50,dry_run:false})});
    }else if(tool==='profit'){
      result=await api('/api/admin/profit?days=30');
    }else if(tool==='plocks'){
      result=await api('/api/admin/price-locks?limit=50');
    }else if(tool==='srv'){
      var eko=await api('/api/admin/server-balance?provider=ekonomi').catch(function(e){return {error:e.message}});
      var prem=await api('/api/admin/server-balance?provider=premium').catch(function(e){return {error:e.message}});
      result={ekonomi:eko,premium:prem};
    }
    resEl.classList.add('success');
    resEl.textContent=JSON.stringify(result,null,2);
  }catch(e){
    resEl.classList.add('error');
    resEl.textContent=e.message;
  }finally{
    btn.disabled=false;btn.innerHTML=orig;
  }
}

/* AUDIT */
async function loadAudit(){
  var c=$('content');
  c.innerHTML=loadingBlock('Memuat audit...');
  try{
    var qs=new URLSearchParams({page:state.page,limit:50});
    var data=await api('/api/admin/audit-log?'+qs.toString());
    if(!data.logs||data.logs.length===0){c.innerHTML=emptyBlock('Belum ada log');return}
    c.innerHTML=data.logs.map(function(l){
      var meta=l.metadata||{};
      return '<div class="card">'+
        '<div class="card-header"><div style="flex:1;min-width:0">'+
          '<div class="card-title">'+esc(l.new_status||l.reason||'action')+'</div>'+
          '<div class="card-sub">Admin: '+esc(meta.admin_username||meta.admin_id||'—')+' · Target: '+esc(l.entity_id||'—')+'</div>'+
        '</div></div>'+
        '<div class="grid-2">'+
          '<div class="field"><span class="field-label">Waktu</span><span class="field-value" style="font-size:.7rem">'+fmtDate(l.created_at)+'</span></div>'+
          (meta.adjustment!==undefined?'<div class="field"><span class="field-label">Adjustment</span><span class="field-value '+(Number(meta.adjustment)>0?'success':'danger')+'">'+(Number(meta.adjustment)>0?'+':'')+fmtRp(Math.abs(Number(meta.adjustment)||0))+'</span></div>':'')+
          (meta.note?'<div class="field"><span class="field-label">Catatan</span><span class="field-value">'+esc(meta.note)+'</span></div>':'')+
        '</div>'+
      '</div>';
    }).join('');
    renderPagination(data,function(p){state.page=p;loadAudit()});
  }catch(e){c.innerHTML=errorBlock(e.message)}
}

/* Modal helpers */
function openModal(html){
  var m=$('modalContent'),o=$('modal');
  if(!m||!o)return;
  m.innerHTML=html;
  o.classList.add('active');
  qa('[data-close-modal]',m).forEach(function(b){b.addEventListener('click',closeModal)});
}
function closeModal(){$('modal').classList.remove('active')}
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal()});
D.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});

/* Search & filter */
var searchTimer=null;
$('searchInput').addEventListener('input',function(e){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    state.search=e.target.value.trim();
    state.page=1;
    loadTab();
  },400);
});
$('statusFilter').addEventListener('change',function(e){
  state.status=e.target.value;
  state.page=1;
  loadTab();
});

/* Refresh */
$('refreshBtn').addEventListener('click',function(){
  var b=this;b.classList.add('spinning');
  loadStats();loadTab();
  setTimeout(function(){b.classList.remove('spinning')},600);
});

/* Nav routing */
qa('.nav-item').forEach(function(a){
  a.addEventListener('click',function(e){
    var tab=a.dataset.nav;
    if(!tab)return;
    e.preventDefault();
    var url=new URL(W.location.href);
    url.searchParams.set('tab',tab);
    W.history.pushState({tab:tab},'','/admin?tab='+tab);
    setActiveTab(tab);
    if(W.innerWidth<=768){var sb=$('sidebar');if(sb)sb.classList.remove('open');var ov=$('sidebarOverlay');if(ov)ov.classList.remove('active')}
  });
});
W.addEventListener('popstate',function(){
  setActiveTab(getTabFromURL());
});

})();
</script>
