<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a84ff">
<title>LIVE Admin — AsyrofOTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --surface: #121212;
  --surface-light: #1f1f22;
  --border: #000000;
  --text-main: #ffffff;
  --text-muted: #a1a1aa;
  
  --primary: #00e5ff;
  --success: #00e676;
  --danger: #ff5252;
  --warning: #ffd600;
  --purple: #d500f9;
  
  --radius: 14px;
  --font: 'Space Grotesk', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --shadow: 4px 4px 0px #000;
  --shadow-hover: 6px 6px 0px #000;
  --shadow-active: 2px 2px 0px #000;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font: 400 15px/1.55 var(--font);
  background-color: var(--bg);
  color: var(--text-main);
  min-height: 100vh; min-height: 100dvh;
  background-image: radial-gradient(#27272a 1px, transparent 1px);
  background-size: 20px 20px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* === LOADING GATE === */
.gate {
  position: fixed; inset: 0; z-index: 99999; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.gate.hidden { display: none; }
.gate-spinner {
  width: 50px; height: 50px; border: 4px solid var(--surface-light);
  border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.gate-text { font: 700 16px var(--mono); color: var(--primary); text-align: center; }
.gate-text.frozen { color: var(--danger); animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

/* === LAYOUT === */
.layout { display: flex; min-height: 100vh; }

/* === SIDEBAR === */
.sidebar {
  position: fixed; top: 16px; left: 16px; bottom: 16px; width: 260px;
  padding: 20px 16px; display: flex; flex-direction: column;
  background: var(--surface); border: 4px solid var(--border); border-radius: var(--radius);
  z-index: 300; box-shadow: var(--shadow); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
.sidebar-logo { display: flex; align-items: center; gap: 12px; color: var(--text-main); text-decoration: none; }
.logo-icon {
  width: 40px; height: 40px; border-radius: 10px; background: var(--primary); color: #000;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px;
  border: 3px solid var(--border); box-shadow: 2px 2px 0px #000;
}
.logo-text { font-weight: 800; font-size: 18px; letter-spacing: -1px; }
.logo-text span { color: var(--text-muted); font-weight: 600; }
.collapse-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 3px solid var(--border); background: var(--surface-light);
  color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 0px #000; transition: all 0.1s;
}
.collapse-btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
.sidebar.collapsed { width: 80px; }
.sidebar.collapsed .logo-text, .sidebar.collapsed .nav-label, .sidebar.collapsed .user-details, .sidebar.collapsed .logout-btn { display: none; }
.sidebar.collapsed .collapse-btn svg { transform: rotate(180deg); }
.sidebar.collapsed .sidebar-header { flex-direction: column; gap: 15px; }
.sidebar.collapsed .sidebar-logo { justify-content: center; }
.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px;
  color: var(--text-muted); font-size: 15px; font-weight: 700; text-decoration: none;
  border: 3px solid transparent; transition: all 0.2s; cursor: pointer;
}
.nav-item:hover { background: var(--surface-light); color: var(--text-main); }
.nav-item.active {
  background: var(--primary); color: #000; border-color: var(--border); box-shadow: 3px 3px 0px #000;
}
.sidebar.collapsed .nav-item { justify-content: center; padding: 12px 0; }
.sidebar-footer { border-top: 3px solid var(--border); padding-top: 15px; margin-top: 15px; }
.user-info { display: flex; align-items: center; gap: 10px; }
.user-avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--surface-light); color: var(--text-main);
  display: flex; align-items: center; justify-content: center; font-weight: 800; border: 2px solid var(--border);
}
.user-details { flex: 1; overflow: hidden; }
.user-name { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-balance { font: 700 12px var(--mono); color: var(--success); }
.logout-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 3px solid var(--border); background: var(--danger);
  color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0px #000;
}

/* === MAIN === */
.main { margin-left: 292px; padding: 16px 16px 80px 0; flex: 1; display: flex; flex-direction: column; gap: 20px; transition: all 0.3s; }
body.sidebar-collapsed .main { margin-left: 112px; }

/* === TOPBAR === */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 15px;
  padding: 16px 20px; background: var(--surface); border: 4px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow); position: sticky; top: 16px; z-index: 20;
}
.topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.topbar p { font-size: 13px; color: var(--text-muted); font-weight: 600; }
.topbar-right { display: flex; gap: 10px; }
.icon-btn, .theme-btn, .mobile-toggle {
  width: 44px; height: 44px; border-radius: 10px; border: 3px solid var(--border); background: var(--surface-light);
  color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 3px 3px 0px #000; transition: all 0.1s;
}
.icon-btn:active, .theme-btn:active, .mobile-toggle:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
.mobile-toggle { display: none; }

/* === STATS === */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
.stat {
  padding: 20px; background: var(--surface); border: 4px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); position: relative; overflow: hidden; transition: all 0.3s;
}
.stat.flash { animation: flash-bg 1s ease-out; }
@keyframes flash-bg { 0% { background: var(--primary); transform: scale(1.05); } 100% { background: var(--surface); transform: scale(1); } }
.stat-label { font: 700 11px var(--mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.stat-value { font: 800 26px var(--font); }
.stat:nth-child(1) .stat-value { color: var(--primary); }
.stat:nth-child(2) .stat-value { color: var(--warning); }
.stat:nth-child(3) .stat-value { color: var(--danger); }
.stat:nth-child(4) .stat-value { color: var(--success); }

/* === TABS & TOOLBAR === */
.tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
.tab {
  padding: 10px 20px; border-radius: var(--radius); border: 3px solid var(--border); background: var(--surface);
  color: var(--text-muted); font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 3px 3px 0px #000;
  transition: all 0.1s; white-space: nowrap;
}
.tab.active { background: var(--primary); color: #000; transform: translateY(-2px); box-shadow: 4px 4px 0px #000; }
.tab:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
.search-bar {
  position: relative; flex: 1; min-width: 200px; display: flex; align-items: center;
  background: var(--surface); border: 3px solid var(--border); border-radius: var(--radius);
  padding: 0 15px; box-shadow: var(--shadow);
}
.search-bar input { width: 100%; padding: 14px 10px 14px 30px; background: transparent; border: none; outline: none; color: var(--text-main); font-weight: 600; font-size: 15px; }
.filter-select {
  padding: 12px 15px; border-radius: var(--radius); border: 3px solid var(--border); background: var(--surface);
  color: var(--text-main); font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); outline: none;
}

/* === CARDS (LIST) === */
#content { display: flex; flex-direction: column; gap: 15px; }
.card {
  padding: 20px; background: var(--surface); border: 4px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 15px;
}
.card.row-new-user { border-color: var(--purple); background: color-mix(in srgb, var(--purple) 10%, var(--surface)); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--border); padding-bottom: 15px; }
.card-title { font-size: 18px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
.card-sub { font: 600 13px var(--mono); color: var(--text-muted); margin-top: 5px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field-label { font: 700 11px var(--mono); color: var(--text-muted); text-transform: uppercase; }
.field-value { font: 700 15px var(--mono); color: var(--text-main); word-break: break-all; }
.field-value.primary { color: var(--primary); }
.field-value.success { color: var(--success); }
.field-value.danger { color: var(--danger); }

/* === BADGES === */
.badge { padding: 4px 10px; border-radius: 6px; font: 800 11px var(--mono); border: 2px solid var(--border); text-transform: uppercase; box-shadow: 2px 2px 0px #000; }
.badge.success { background: var(--success); color: #000; }
.badge.warning { background: var(--warning); color: #000; }
.badge.danger { background: var(--danger); color: #fff; }
.badge.info { background: var(--primary); color: #000; }
.badge.purple { background: var(--purple); color: #fff; }
.badge.gray { background: var(--surface-light); color: var(--text-muted); }

/* === BUTTONS === */
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  padding: 10px 15px; border-radius: 10px; border: 3px solid var(--border); background: var(--surface-light);
  color: var(--text-main); font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 3px 3px 0px #000;
  transition: all 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
.btn-primary { background: var(--primary); color: #000; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #000; }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 3px 3px 0px #000; }

/* === MODAL & ALERT === */
.modal-overlay, .alert-overlay {
  position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.8);
  display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px);
}
.modal-overlay.active, .alert-overlay.active { display: flex; }
.modal, .alert-box {
  width: 100%; max-width: 500px; background: var(--surface); border: 4px solid var(--border);
  border-radius: var(--radius); box-shadow: 8px 8px 0px #000; animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes modalPop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.modal-header { padding: 20px; border-bottom: 4px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-size: 18px; font-weight: 800; }
.modal-close { width: 34px; height: 34px; border-radius: 8px; border: 3px solid var(--border); background: var(--danger); color: #fff; cursor: pointer; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
.alert-box { padding: 25px; text-align: center; max-width: 400px; }
.alert-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }

/* === FORM === */
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-label { font: 700 12px var(--mono); color: var(--text-muted); text-transform: uppercase; }
.form-control {
  width: 100%; padding: 12px 15px; border-radius: 10px; border: 3px solid var(--border); background: var(--bg);
  color: var(--text-main); font: 600 15px var(--mono); outline: none;
}
.form-control:focus { border-color: var(--primary); }

/* === LOG & TOOLS === */
.log-list { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
.log-item { padding: 10px; background: var(--bg); border: 2px solid var(--border); border-radius: 8px; font: 600 12px var(--mono); }
.log-time { color: var(--text-muted); font-size: 10px; margin-bottom: 5px; }
.tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
.tool-card { padding: 20px; background: var(--surface); border: 4px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.tool-card h4 { font-size: 16px; font-weight: 800; color: var(--primary); }
.tool-card p { font-size: 13px; color: var(--text-muted); }
.tool-result { padding: 10px; background: var(--bg); border: 2px solid var(--border); border-radius: 8px; font: 600 12px var(--mono); white-space: pre-wrap; display: none; }
.tool-result.show { display: block; }

/* === PAGINATION === */
.pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
.page-btn { padding: 10px 15px; border-radius: 8px; border: 3px solid var(--border); background: var(--surface); color: var(--text-main); font-weight: 800; cursor: pointer; box-shadow: 3px 3px 0px #000; }
.page-btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
.page-info { font: 700 14px var(--mono); display: flex; align-items: center; }

/* === RESPONSIVE === */
@media (max-width: 1024px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-150%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 16px; }
  .mobile-toggle { display: flex; }
  .collapse-btn { display: none; }
  .stats { grid-template-columns: 1fr; }
}
</style>
<script>
(function(){
  var d=document.documentElement;
  try {
    var pref=localStorage.getItem('asyrofotp_theme_pref')||'dark';
    d.setAttribute('data-theme','dark');
  } catch(e) { d.setAttribute('data-theme','dark'); }
})();
</script>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-spinner" id="gateSpinner"></div>
  <div class="gate-text" id="gateText">Memverifikasi Sesi...</div>
</div>

<div id="app" hidden>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/dashboard" class="sidebar-logo">
        <div class="logo-icon">A</div>
        <div class="logo-text">Asyrof<span>OTP</span></div>
      </a>
      <button class="collapse-btn" id="collapseBtn">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-nav="user">👤 <span class="nav-label">Users</span></a>
      <a class="nav-item" data-nav="order">📦 <span class="nav-label">Orders</span></a>
      <a class="nav-item" data-nav="depo">💰 <span class="nav-label">Deposits</span></a>
      <a class="nav-item" data-nav="monitor">📡 <span class="nav-label">Monitor</span></a>
      <a class="nav-item" data-nav="tools">🛠️ <span class="nav-label">Tools</span></a>
      <a class="nav-item" data-nav="audit">📝 <span class="nav-label">Audit</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userInitial">A</div>
        <div class="user-details">
          <div class="user-name" id="userName">Admin</div>
          <div class="user-balance" id="userBalance">—</div>
        </div>
        <button class="logout-btn" id="logoutBtn">🚪</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" id="mobileToggle">☰</button>
        <div>
          <h1 id="pageTitle">Admin Panel</h1>
          <p id="pageSubtitle">Kelola sistem</p>
        </div>
      </div>
      <div class="topbar-right">
        <button class="theme-btn" id="themeBtn">🌙</button>
        <button class="icon-btn" id="refreshBtn">🔄</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat" id="card-users"><div class="stat-label">Total User</div><div class="stat-value" id="statUsers">—</div></div>
      <div class="stat" id="card-orders"><div class="stat-label">Total Order</div><div class="stat-value" id="statOrders">—</div></div>
      <div class="stat" id="card-pending"><div class="stat-label">Pending Depo</div><div class="stat-value" id="statPending">—</div></div>
      <div class="stat"><div class="stat-label">Total Saldo</div><div class="stat-value" id="statBalance">—</div></div>
    </div>

    <div class="tabs" id="mainTabs">
      <button class="tab active" onclick="switchTab('user', this)">Users</button>
      <button class="tab" onclick="switchTab('order', this)">Orders</button>
      <button class="tab" onclick="switchTab('depo', this)">Deposits</button>
      <button class="tab" onclick="switchTab('monitor', this)">Monitor</button>
      <button class="tab" onclick="switchTab('tools', this)">Tools</button>
      <button class="tab" onclick="switchTab('audit', this)">Audit</button>
    </div>

    <div class="toolbar" id="toolbar">
      <div class="search-bar">
        <span>🔍</span>
        <input type="search" id="searchInput" placeholder="Cari data...">
      </div>
      <select class="filter-select" id="statusFilter" style="display:none">
        <option value="">Semua Status</option>
      </select>
    </div>

    <div id="content"></div>
    <div class="pagination" id="pagination" hidden></div>
  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>
<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box">
    <h3 id="alertTitle">Info</h3>
    <p id="alertMessage">—</p>
    <div class="alert-actions" id="alertActions"></div>
  </div>
</div>
</div>

<script>
(function(){
'use strict';

// === STATE ===
var D=document,W=window;
var $=function(id){return D.getElementById(id)};
var q=function(s,c){return (c||D).querySelector(s)};
var qa=function(s,c){return Array.prototype.slice.call((c||D).querySelectorAll(s))};

var token = localStorage.getItem('access_token');
var state = { tab: 'user', page: 1, search: '', status: '' };
var isFirstLoad = true;
var oldStats = { users: 0, orders: 0, pending: 0 };
var pollInterval = null;

// Audio Notif
const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");

// === UTILS ===
function safeJson(res){return res.json().catch(function(){return{}})}
function esc(v){return String(v??'').replace(/[&<>"']/g,function(ch){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]})}
function fmtRp(n){return 'Rp'+(Number(n)||0).toLocaleString('id-ID')}
function fmtDate(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}}
function initial(name){return String(name||'?').trim().charAt(0).toUpperCase()||'?'}

async function api(url,opts){
  opts=opts||{};
  var headers=Object.assign({'Authorization':'Bearer '+token,'Content-Type':'application/json'},opts.headers||{});
  var o=Object.assign({},opts,{headers:headers});
  try{
    var res=await fetch(url,o);
    var data=await safeJson(res);
    if(!res.ok)throw new Error(data.error||'Request failed ('+res.status+')');
    return data;
  } catch(e) { throw e; }
}

// === ALERT & CONFIRM ===
function showAlert(opts){
  return new Promise(function(resolve){
    var ov=$('alertOverlay');
    $('alertTitle').textContent=opts.title||'Info';
    $('alertMessage').textContent=opts.message||'';
    var act=$('alertActions');
    act.innerHTML='';
    if(opts.showCancel){
      var b=D.createElement('button');b.className='btn';b.textContent=opts.cancelText||'Batal';
      b.addEventListener('click',function(){ov.classList.remove('active');resolve(false)});
      act.appendChild(b);
    }
    var ok=D.createElement('button');
    ok.className='btn btn-primary'+(opts.type==='danger'?' btn-danger':'');
    ok.textContent=opts.okText||'OK';
    ok.addEventListener('click',function(){ov.classList.remove('active');resolve(true)});
    act.appendChild(ok);
    ov.classList.add('active');
  });
}
function confirmBox(msg,title){return showAlert({title:title||'Konfirmasi',message:msg,type:'warning',okText:'Ya',showCancel:true})}

// === LIVE POLLING (INTERVAL 5 DETIK) ===
function startLivePolling() {
  pollInterval = setInterval(async () => {
    if (token) {
      await loadStats();
      await loadTab();
    }
  }, 5000);
}

async function loadStats(){
  try{
    var data=await api('/api/admin/stats');
    
    // Cek jika ada data baru masuk
    if(!isFirstLoad) {
      if(data.total_users > oldStats.users || data.total_orders > oldStats.orders || data.pending_deposits > oldStats.pending) {
        audio.play().catch(e => console.log('Notif audio blocked'));
        if(data.total_users > oldStats.users) flashCard('card-users');
        if(data.total_orders > oldStats.orders) flashCard('card-orders');
        if(data.pending_deposits > oldStats.pending) flashCard('card-pending');
      }
    }
    
    oldStats = { users: data.total_users||0, orders: data.total_orders||0, pending: data.pending_deposits||0 };
    isFirstLoad = false;
    
    $('statUsers').textContent = data.total_users||0;
    $('statOrders').textContent = data.total_orders||0;
    $('statPending').textContent = data.pending_deposits||0;
    $('statBalance').textContent = fmtRp(data.total_balance||0);
  } catch(e) {}
}

function flashCard(id) {
  var el = $(id);
  if(!el) return;
  el.classList.remove('flash');
  void el.offsetWidth; 
  el.classList.add('flash');
}

// === RENDER HELPERS ===
function emptyBlock(msg){return '<div class="empty"><p>'+esc(msg)+'</p></div>'}
function loadingBlock(msg){return '<div class="empty"><div class="spinner-sm"></div><p>'+esc(msg)+'</p></div>'}
function errorBlock(msg){return '<div class="empty"><p style="color:var(--danger)">'+esc(msg)+'</p></div>'}

function renderPagination(data,onPage){
  var el=$('pagination');
  if(!el)return;
  if(!data.total_pages||data.total_pages<=1){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=
    '<button class="page-btn" data-page="'+(data.page-1)+'" '+(data.page<=1?'disabled':'')+'>← Prev</button>'+
    '<span class="page-info">'+data.page+' / '+data.total_pages+'</span>'+
    '<button class="page-btn" data-page="'+(data.page+1)+'" '+(data.page>=data.total_pages?'disabled':'')+'>Next →</button>';
  qa('.page-btn',el).forEach(function(b){
    b.addEventListener('click',function(){
      var p=Number(b.dataset.page);
      if(p>=1&&p<=data.total_pages)onPage(p);
    });
  });
}

// === TAB SWITCHING ===
window.switchTab = function(tab, el) {
  state.tab = tab;
  qa('.tab').forEach(t => t.classList.remove('active'));
  if(el) el.classList.add('active');
  
  qa('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.nav === tab));
  
  var titles = { user: 'Users', order: 'Orders', depo: 'Deposits', monitor: 'Monitor', tools: 'Tools', audit: 'Audit' };
  $('pageTitle').textContent = titles[tab] || 'Admin';
  
  var tb = $('toolbar');
  if(tab === 'user' || tab === 'order' || tab === 'depo') tb.style.display = 'flex';
  else tb.style.display = 'none';
  
  state.page = 1;
  state.search = '';
  state.status = '';
  $('searchInput').value = '';
  
  loadTab();
};

function loadTab(){
  $('pagination').hidden=true;
  if(state.tab==='user')loadUsers();
  else if(state.tab==='order')loadOrders();
  else if(state.tab==='depo')loadDeposits();
  else if(state.tab==='monitor')loadMonitor();
  else if(state.tab==='tools')loadTools();
  else if(state.tab==='audit')loadAudit();
}

function statusClass(s){
  if(['success','received','confirmed'].includes(s))return 'success';
  if(s==='pending')return 'warning';
  if(['cancelled','expired','failed'].includes(s))return 'danger';
  if(s==='refunded')return 'purple';
  return 'gray';
}

// === STATUS MODAL (FUNGSI ASLI) ===
function showStatusModal(type,id,current){
  var statuses=type==='order'?ORDER_STATUSES:DEPO_STATUSES;
  openModal(
    '<div class="modal-header"><div class="modal-title">Ubah Status '+(type==='order'?'Order':'Deposit')+'</div>'+
    '<button class="modal-close" data-close-modal type="button">✕</button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><span class="field-label">ID</span><span class="field-value primary">'+esc(id)+'</span></div>'+
      '<div class="form-group"><label class="form-label">Status Baru</label><select class="form-control" id="statusSelect">'+
        statuses.map(function(s){return '<option value="'+s+'" '+(s===current?'selected':'')+'>'+s+'</option>'}).join('')+
      '</select></div>'+
      '<div class="form-group"><label class="form-label">Catatan (opsional)</label><input class="form-control" type="text" id="statusNote" placeholder="Alasan"></div>'+
      '<button class="btn btn-primary btn-block" type="button" id="statusSave">Simpan</button>'+
    '</div>'
  );
  $('statusSave').addEventListener('click',async function(){
    var ns=$('statusSelect').value;
    var note=$('statusNote').value.trim();
    if(ns===current)return closeModal();
    var ok=await confirmBox('Ubah status dari "'+current+'" ke "'+ns+'"? Saldo user akan disesuaikan.');
    if(!ok)return;
    var btn=$('statusSave');btn.disabled=true;btn.innerHTML='<span class="spinner-sm"></span>';
    try{
      var ep=type==='order'?'/api/admin/order/':'/api/admin/deposit/';
      var res=await api(ep+encodeURIComponent(id)+'/status',{method:'POST',body:JSON.stringify({status:ns,note:note})});
      closeModal();
      var adj=Number(res.balance_adjustment)||0;
      var adjTxt=adj>0?'+'+fmtRp(adj):(adj<0?'-'+fmtRp(Math.abs(adj)):'tidak ada adjustment');
      showAlert({title:'Berhasil',message:'Status "'+ns+'". Saldo: '+adjTxt,type:'success'});
      loadTab();loadStats();
    }catch(e){btn.disabled=false;btn.innerHTML='Simpan';showAlert({title:'Gagal',message:e.message,type:'danger'})}
  });
}

// === TOOLS (FUNGSI ASLI) ===
function loadTools(){
  var c=$('content');
  c.innerHTML=
    '<div class="tools-grid">'+
      toolCard('db-cleaner','🗑️ Bersihkan DB','Hapus user saldo 0 & last login > 30 hari lalu (atau null).')+
      toolCard('stats','📊 Stats Notif','Lihat jumlah notif terkirim & pending.')+
      toolCard('test-otp','🧪 Test Notif OTP','Kirim pesan test ke channel OTP.')+
      toolCard('test-depo','🧪 Test Notif Deposit','Kirim pesan test ke channel deposit.')+
      toolCard('backfill','🔄 Backfill Notif','Kirim notif ke yang belum terkirim.')+
      toolCard('profit','💰 Profit Report','Laporan profit nokos + fee deposit.')+
      toolCard('plocks','📈 Price Locks','Lihat cache harga yang di-lock.')+
      toolCard('srv','🔍 Server Balance','Cek saldo server provider.')+
    '</div>';

  qa('[data-tool]').forEach(function(b){
    b.addEventListener('click',function(){runTool(b.dataset.tool,b)});
  });
}

function toolCard(id,title,desc){
  return '<div class="tool-card">'+
    '<h4>'+title+'</h4>'+
    '<p>'+desc+'</p>'+
    '<div class="form-group" id="'+id+'Form" style="display:none"></div>'+
    '<button class="btn btn-primary" type="button" data-tool="'+id+'">Jalankan</button>'+
    '<div class="tool-result" id="res-'+id+'"></div>'+
  '</div>';
}

async function runTool(tool,btn){
  var resEl=$('res-'+tool);
  if(!resEl)return;
  resEl.classList.add('show');
  resEl.className='tool-result show';
  resEl.textContent='Loading...';
  var orig=btn.innerHTML;
  btn.disabled=true;btn.innerHTML='<span class="spinner-sm"></span>';

  try{
    var result;
    if(tool==='db-cleaner'){
      var dry=await confirmBox('Jalankan DRY RUN dulu buat lihat berapa user yang bakal dihapus?','DB Cleaner');
      if(dry){
        result=await api('/api/admin/cleanup-users',{method:'POST',body:JSON.stringify({dry_run:true,days:30})});
      }else{
        var ok=await confirmBox('⚠️ HAPUS PERMANEN user saldo 0 & last login > 30 hari? Tidak bisa dibatalkan.','Konfirmasi Hapus');
        if(!ok){btn.disabled=false;btn.innerHTML=orig;resEl.textContent='Dibatalkan';return}
        result=await api('/api/admin/cleanup-users',{method:'POST',body:JSON.stringify({dry_run:false,days:30})});
      }
    }else if(tool==='stats'){
      result=await api('/api/admin/test-notif',{method:'POST',body:JSON.stringify({type:'stats'})});
    }else if(tool==='test-otp'){
      result=await api('/api/admin/test-notif',{method:'POST',body:JSON.stringify({type:'otp'})});
    }else if(tool==='test-depo'){
      result=await api('/api/admin/test-notif',{method:'POST',body:JSON.stringify({type:'deposit'})});
    }else if(tool==='backfill'){
      var okBf=await confirmBox('Kirim notif ke semua yang belum terkirim? Batch 50.','Backfill');
      if(!okBf){btn.disabled=false;btn.innerHTML=orig;resEl.textContent='Dibatalkan';return}
      result=await api('/api/admin/backfill-notifs',{method:'POST',body:JSON.stringify({type:'all',days:30,limit:50,dry_run:false})});
    }else if(tool==='profit'){
      result=await api('/api/admin/profit?days=30');
    }else if(tool==='plocks'){
      result=await api('/api/admin/price-locks?limit=50');
    }else if(tool==='srv'){
      var eko=await api('/api/admin/server-balance?provider=ekonomi').catch(function(e){return {error:e.message}});
      var prem=await api('/api/admin/server-balance?provider=premium').catch(function(e){return {error:e.message}});
      result={ekonomi:eko,premium:prem};
    }
    resEl.classList.add('success');
    resEl.textContent=JSON.stringify(result,null,2);
  }catch(e){
    resEl.classList.add('error');
    resEl.textContent=e.message;
  }finally{
    btn.disabled=false;btn.innerHTML=orig;
  }
}

// === INIT APLIKASI ===
(async function initApp(){
  if(!token) {
    $('gateSpinner').style.display='none';
    $('gateText').classList.add('frozen');
    $('gateText').innerText='Token tidak ditemukan. Harap login.';
    setTimeout(()=>window.location.href='/login', 1500);
    return;
  }
  
  try {
    // Cek admin pake API asli lo
    var user = await api('/api/user');
    var isAdmin = user.role === 'admin' || String(user.username).toLowerCase() === 'asyrofc' || String(user.user_code) === 'SRF2667442394';
    
    if(!isAdmin) {
      $('gateSpinner').style.display='none';
      $('gateText').classList.add('frozen');
      $('gateText').innerText='Akses ditolak: Bukan Admin.';
      setTimeout(()=>window.location.href='/dashboard', 1500);
      return;
    }
    
    // Set Info User
    $('userName').innerText = user.name || user.username;
    $('userBalance').innerText = fmtRp(user.balance);
    $('userInitial').innerText = initial(user.name || user.username);
    
    // Buka aplikasi
    $('gate').classList.add('hidden');
    $('app').hidden = false;
    
    // Mulai Live Polling 5 Detik
    loadStats();
    loadTab();
    startLivePolling();

  } catch(e) {
    $('gateSpinner').style.display='none';
    $('gateText').classList.add('frozen');
    $('gateText').innerText='Sesi habis / Error.';
    setTimeout(()=>window.location.href='/login', 1500);
  }
})();
