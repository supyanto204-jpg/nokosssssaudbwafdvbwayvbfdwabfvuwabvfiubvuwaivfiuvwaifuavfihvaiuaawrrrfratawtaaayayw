<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0a84ff">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>Admin — AsyrofOTP</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ADMIN.CSS — Simple, Lightweight, iOS Glass
   ============================================================ */

:root {
  --p: #0a84ff;
  --ok: #34c759;
  --warn: #ff9f0a;
  --err: #ff3b30;
  --purple: #af52de;
  --txt: #1c1c1e;
  --txt2: #6e6e73;
  --txt3: #8e8e93;
  --bg: #eef2f7;
  --gl-bg: rgba(255, 255, 255, 0.7);
  --gl-bd: rgba(255, 255, 255, 0.8);
  --gl-bd2: rgba(0, 0, 0, 0.08);
  --gl-sh: 0 4px 20px rgba(31, 38, 135, 0.08);
  --gl-in: inset 0 1px 0 rgba(255, 255, 255, 0.6);
  --grad: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 55%, #bf5af2 100%);
  --blur: blur(20px) saturate(180%);
  --r: 16px;
  --r-sm: 10px;
  --tr: 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: light;
}

[data-theme="dark"] {
  --txt: #f5f5f7;
  --txt2: #a1a1a6;
  --txt3: #8e8e93;
  --bg: #0a0a0c;
  --gl-bg: rgba(28, 28, 32, 0.7);
  --gl-bd: rgba(255, 255, 255, 0.12);
  --gl-bd2: rgba(255, 255, 255, 0.1);
  --gl-sh: 0 4px 20px rgba(0, 0, 0, 0.4);
  --gl-in: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  color-scheme: dark;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--txt);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

body, body * { user-select: none; -webkit-user-select: none; }
input, textarea, select, code, [contenteditable], [data-copy] { user-select: text; -webkit-user-select: text; }

a, button, [role="button"], input, select, textarea, label,
.nav-item, .tab, .stat-card, .card, .btn, .sidebar-overlay,
.modal-overlay, .alert-overlay, .collapse-btn, .logout-btn,
.mobile-toggle, .theme-btn, .icon-btn, .copy-btn {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

@media (hover: hover) {
  a, button, [role="button"], .nav-item, .tab, .btn, .collapse-btn,
  .logout-btn, .mobile-toggle, .theme-btn, .icon-btn, .copy-btn { cursor: pointer; }
}

.ic { width: 20px; height: 20px; display: inline-block; vertical-align: middle; flex-shrink: 0; pointer-events: none; }
.spinner-sm { width: 16px; height: 16px; border: 2px solid rgba(10,132,255,0.2); border-top-color: var(--p); border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* BG */
.bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 20% 20%, rgba(10,132,255,0.08), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(191,90,242,0.06), transparent 40%);
}

/* Glass */
.glass {
  background: var(--gl-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--gl-bd);
  box-shadow: var(--gl-sh), var(--gl-in);
  border-radius: var(--r);
}
.glass-card {
  background: var(--gl-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--gl-bd);
  box-shadow: var(--gl-sh), var(--gl-in);
  border-radius: var(--r);
}

/* Layout */
.layout {
  position: relative; z-index: 1;
  display: flex;
  min-height: 100vh; min-height: 100dvh;
}

/* SIDEBAR */
.sidebar {
  position: fixed; top: 12px; left: 12px; bottom: 12px;
  width: 240px; padding: 16px 12px;
  display: flex; flex-direction: column;
  z-index: 300;
  transition: width 0.3s var(--tr), transform 0.3s var(--tr);
  overflow: hidden;
}
.sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; padding: 0 4px; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--txt); }
.logo-icon {
  width: 36px; height: 36px; border-radius: 11px;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 900; font-size: 1.2rem;
  box-shadow: 0 4px 14px rgba(10,132,255,0.3);
  flex-shrink: 0;
}
.logo-text { font-weight: 900; font-size: 1rem; white-space: nowrap; }
.logo-text span { color: var(--p); }

.collapse-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.5);
  color: var(--txt2);
  display: flex; align-items: center; justify-content: center;
  transition: all var(--tr);
  flex-shrink: 0;
}
[data-theme="dark"] .collapse-btn { background: rgba(255,255,255,0.06); }
.collapse-btn:active { transform: scale(0.94); }
.collapse-btn .ic { width: 16px; height: 16px; transition: transform 0.3s var(--tr); }

.sidebar.collapsed { width: 72px; }
.sidebar.collapsed .logo-text,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .user-details,
.sidebar.collapsed .logout-btn { display: none; }
.sidebar.collapsed .collapse-btn .ic { transform: rotate(180deg); }
.sidebar.collapsed .sidebar-header { flex-direction: column; gap: 10px; justify-content: center; }
.sidebar.collapsed .sidebar-logo { justify-content: center; }

.sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--txt2); text-decoration: none;
  font-size: 0.88rem; font-weight: 600;
  transition: all var(--tr);
  white-space: nowrap;
}
.nav-item .ic { width: 18px; height: 18px; }
.nav-item.active { background: var(--grad); color: #fff; box-shadow: 0 4px 12px rgba(10,132,255,0.3); }
.nav-item:active { transform: scale(0.97); }
.sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }

.sidebar-footer { border-top: 1px solid var(--gl-bd2); padding-top: 12px; margin-top: 12px; }
.user-info { display: flex; align-items: center; gap: 8px; padding: 4px; }
.user-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--grad); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.9rem;
  flex-shrink: 0;
}
.user-details { flex: 1; min-width: 0; overflow: hidden; }
.user-name { font-size: 0.82rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-balance { font-size: 0.72rem; color: var(--p); font-weight: 700; font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logout-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.5);
  color: var(--txt2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all var(--tr);
}
[data-theme="dark"] .logout-btn { background: rgba(255,255,255,0.06); }
.logout-btn .ic { width: 16px; height: 16px; }
.logout-btn:active { transform: scale(0.94); }

@media (hover: hover) {
  .nav-item:hover { background: rgba(10,132,255,0.08); color: var(--p); }
  .collapse-btn:hover { background: var(--p); color: #fff; border-color: var(--p); }
  .logout-btn:hover { background: var(--err); color: #fff; border-color: var(--err); }
}

/* MAIN */
.main-content {
  flex: 1; margin-left: 268px;
  padding: 12px 16px 80px 0;
  min-width: 0;
  display: flex; flex-direction: column; gap: 14px;
  position: relative; z-index: 1;
}
body.sidebar-collapsed .main-content { margin-left: 100px; }

/* Topbar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 12px 16px;
  position: sticky; top: 12px; z-index: 20;
  flex-wrap: wrap;
}
body.sidebar-open .topbar { z-index: 10; }
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-left h1 { font-size: 1.15rem; font-weight: 900; letter-spacing: -0.02em; }
.topbar-left p { font-size: 0.78rem; color: var(--txt2); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.mobile-toggle, .icon-btn, .theme-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.5);
  color: var(--txt2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all var(--tr);
}
[data-theme="dark"] .mobile-toggle,
[data-theme="dark"] .icon-btn,
[data-theme="dark"] .theme-btn { background: rgba(255,255,255,0.06); }
.mobile-toggle { display: none; }
.mobile-toggle:active, .icon-btn:active, .theme-btn:active { transform: scale(0.94); }

.theme-btn { position: relative; }
.theme-btn .ic { width: 18px; height: 18px; position: absolute; transition: all 0.3s var(--tr); }
.theme-btn .i-sun { transform: rotate(0) scale(1); opacity: 1; }
.theme-btn .i-moon { transform: rotate(180deg) scale(0); opacity: 0; }
[data-theme="dark"] .theme-btn .i-sun { transform: rotate(-180deg) scale(0); opacity: 0; }
[data-theme="dark"] .theme-btn .i-moon { transform: rotate(0) scale(1); opacity: 1; }

@media (hover: hover) {
  .mobile-toggle:hover, .icon-btn:hover, .theme-btn:hover { background: var(--p); color: #fff; border-color: var(--p); }
}

/* STATS */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat-card { padding: 14px; }
.stat-label {
  font-size: 0.68rem; font-weight: 700; color: var(--txt2);
  text-transform: uppercase; letter-spacing: 0.04em;
  font-family: 'JetBrains Mono', monospace; margin-bottom: 4px;
}
.stat-value {
  font-size: 1.3rem; font-weight: 900;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -0.02em;
}

/* TABS */
.tabs {
  display: flex; gap: 4px; padding: 4px;
  overflow-x: auto; scrollbar-width: none;
  border-radius: 50px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px; border-radius: 50px;
  border: none; background: none;
  color: var(--txt2); font: inherit; font-weight: 700;
  font-size: 0.78rem; white-space: nowrap;
  transition: all var(--tr);
  min-height: 36px;
}
.tab.active { background: var(--grad); color: #fff; box-shadow: 0 4px 12px rgba(10,132,255,0.3); }
.tab:active { transform: scale(0.97); }

/* SEARCH */
.search-bar {
  position: relative; display: flex; align-items: center;
  background: var(--gl-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--gl-bd);
  border-radius: 50px;
  padding: 0 16px;
  min-height: 44px;
}
.search-bar .ic {
  color: var(--txt3); width: 18px; height: 18px; flex-shrink: 0;
  position: absolute; left: 16px;
  pointer-events: none;
}
.search-bar input {
  flex: 1; padding: 10px 0 10px 32px;
  border: none; outline: none; background: transparent;
  font: inherit; font-size: 0.9rem; color: var(--txt);
  min-width: 0;
}

/* Content cards */
#content { display: flex; flex-direction: column; gap: 10px; }

.card {
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.card-header { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 1px solid var(--gl-bd2); }
.card-title-wrap { flex: 1; min-width: 0; }
.card-title { font-weight: 800; font-size: 0.92rem; margin-bottom: 2px; word-break: break-word; }
.card-sub { font-size: 0.72rem; color: var(--txt2); font-family: 'JetBrains Mono', monospace; word-break: break-all; }

.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: 999px;
  font-size: 0.68rem; font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.badge.success { background: rgba(52,199,89,0.15); color: var(--ok); }
.badge.warning { background: rgba(255,159,10,0.15); color: var(--warn); }
.badge.danger { background: rgba(255,59,48,0.15); color: var(--err); }
.badge.gray { background: rgba(142,142,147,0.15); color: var(--txt3); }
.badge.info { background: rgba(10,132,255,0.15); color: var(--p); }
.badge.purple { background: rgba(191,90,242,0.15); color: var(--purple); }

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
}
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field-label {
  font-size: 0.62rem; font-weight: 700; color: var(--txt3);
  text-transform: uppercase; letter-spacing: 0.04em;
  font-family: 'JetBrains Mono', monospace;
}
.field-value {
  font-weight: 700; font-size: 0.82rem;
  font-family: 'JetBrains Mono', monospace;
  word-break: break-all;
}
.field-value.primary { color: var(--p); }
.field-value.success { color: var(--ok); }
.field-value.warning { color: var(--warn); }
.field-value.danger { color: var(--err); }

.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions .btn { flex: 1; min-width: 100px; font-size: 0.75rem; padding: 8px 10px; }

/* Button */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.5);
  color: var(--txt); font: inherit;
  font-weight: 700; font-size: 0.82rem;
  transition: all var(--tr);
  min-height: 40px;
}
[data-theme="dark"] .btn { background: rgba(255,255,255,0.06); }
.btn:active { transform: scale(0.97); }
.btn .ic { width: 14px; height: 14px; }
.btn-primary { background: var(--grad); color: #fff; border: none; box-shadow: 0 4px 14px rgba(10,132,255,0.3); }
.btn-danger { background: var(--err); color: #fff; border: none; }
.btn-success { background: var(--ok); color: #fff; border: none; }
.btn-block { width: 100%; }

@media (hover: hover) {
  .btn:hover { background: rgba(10,132,255,0.08); color: var(--p); border-color: var(--p); }
  .btn-primary:hover { background: var(--grad); color: #fff; border: none; }
}

/* Empty / Loading */
.empty-block {
  text-align: center; padding: 40px 20px;
  color: var(--txt2);
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.empty-block p { font-size: 0.85rem; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; flex-wrap: wrap;
  padding: 10px 0;
}
.page-btn {
  padding: 8px 14px; border-radius: 50px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.5);
  color: var(--txt);
  font: inherit; font-weight: 700; font-size: 0.78rem;
  min-height: 40px;
  transition: all var(--tr);
}
[data-theme="dark"] .page-btn { background: rgba(255,255,255,0.06); }
.page-btn:disabled { opacity: 0.4; }
.page-btn:active:not(:disabled) { transform: scale(0.96); }
.page-info {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem; color: var(--txt2); font-weight: 700;
}

/* Footer */
.site-footer {
  text-align: center; padding: 20px 0 10px;
  color: var(--txt3); font-size: 0.75rem;
}

/* Sidebar overlay */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 290;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}
.sidebar-overlay.active { display: block; opacity: 1; pointer-events: auto; }

/* Security Gate */
.gate {
  position: fixed; inset: 0; z-index: 99999;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 24px;
}
.gate.hidden { display: none; }
.gate-spinner {
  width: 56px; height: 56px;
  border: 4px solid rgba(10,132,255,0.15);
  border-top-color: var(--p);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.gate-spinner.frozen {
  animation: none;
  border-color: rgba(255,59,48,0.15);
  border-top-color: var(--err);
}
.gate-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem; font-weight: 600;
  color: var(--txt2);
  text-align: center;
}
.gate-text.frozen { color: var(--err); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 9000;
  align-items: center; justify-content: center;
  padding: 16px;
  pointer-events: none;
}
.modal-overlay.active { display: flex; pointer-events: auto; }
.modal {
  width: 100%; max-width: 480px;
  max-height: 90vh; overflow-y: auto;
  padding: 0;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  animation: modalPop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1.2);
}
@keyframes modalPop {
  from { opacity: 0; transform: scale(0.94) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 14px 16px; border-bottom: 1px solid var(--gl-bd2);
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
  position: sticky; top: 0;
  background: var(--gl-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  z-index: 2;
  border-radius: var(--r) var(--r) 0 0;
}
.modal-title { font-weight: 800; font-size: 0.95rem; flex: 1; min-width: 0; }
.modal-close {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.5);
  color: var(--txt);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
[data-theme="dark"] .modal-close { background: rgba(255,255,255,0.06); }
.modal-close .ic { width: 14px; height: 14px; }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* Form */
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-label {
  font-size: 0.68rem; font-weight: 700; color: var(--txt2);
  text-transform: uppercase; letter-spacing: 0.04em;
  font-family: 'JetBrains Mono', monospace;
}
.form-control {
  width: 100%; padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.7);
  color: var(--txt); font: inherit;
  font-size: 0.9rem;
  outline: none;
  transition: all 0.2s;
  -webkit-appearance: none; appearance: none;
}
[data-theme="dark"] .form-control { background: rgba(255,255,255,0.08); }
.form-control:focus { border-color: var(--p); box-shadow: 0 0 0 3px rgba(10,132,255,0.15); }

/* Alert */
.alert-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 99999;
  align-items: center; justify-content: center;
  padding: 20px;
  pointer-events: none;
}
.alert-overlay.active { display: flex; pointer-events: auto; }
.alert-box {
  max-width: 400px; width: 100%;
  padding: 24px 20px 20px;
  text-align: center;
  animation: modalPop 0.3s cubic-bezier(0.2, 0.8, 0.2, 1.2);
}
.alert-box h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; }
.alert-box p { font-size: 0.85rem; color: var(--txt2); line-height: 1.55; margin-bottom: 16px; }
.alert-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.alert-actions .btn { flex: 1; min-width: 100px; }

/* Code display */
.code-box {
  background: rgba(10,132,255,0.08);
  border: 1px solid rgba(10,132,255,0.25);
  border-radius: 8px;
  padding: 6px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  word-break: break-all;
  display: flex; align-items: center; gap: 6px;
}
.copy-btn {
  background: none; border: none; color: var(--txt3);
  padding: 4px; border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.copy-btn .ic { width: 12px; height: 12px; }
.copy-btn:active { transform: scale(0.9); }

/* Log list */
.log-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 200px; overflow-y: auto;
  padding: 6px;
  background: rgba(0,0,0,0.02);
  border-radius: 8px;
}
[data-theme="dark"] .log-list { background: rgba(255,255,255,0.03); }
.log-item {
  padding: 8px 10px;
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--gl-bd2);
  border-radius: 6px;
  font-size: 0.72rem;
  font-family: 'JetBrains Mono', monospace;
}
[data-theme="dark"] .log-item { background: rgba(255,255,255,0.04); }
.log-time { color: var(--txt3); font-size: 0.65rem; margin-bottom: 2px; }
.log-text { word-break: break-word; }

/* Tools grid */
.tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.tool-card { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tool-card h4 { font-size: 0.88rem; font-weight: 800; }
.tool-card p { font-size: 0.75rem; color: var(--txt2); line-height: 1.4; }
.tool-result {
  padding: 8px 10px;
  background: rgba(0,0,0,0.03);
  border: 1px solid var(--gl-bd2);
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  max-height: 160px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-all;
}
[data-theme="dark"] .tool-result { background: rgba(255,255,255,0.04); }
.tool-result.success { border-color: var(--ok); color: var(--ok); }
.tool-result.error { border-color: var(--err); color: var(--err); }

/* Monitor stats */
.monitor-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 10px; }
.monitor-stat { padding: 10px 12px; }
.monitor-stat .lbl { font-size: 0.6rem; font-weight: 700; color: var(--txt3); text-transform: uppercase; font-family: 'JetBrains Mono', monospace; margin-bottom: 2px; }
.monitor-stat .val { font-size: 1.2rem; font-weight: 900; font-family: 'JetBrains Mono', monospace; }

.monitor-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.monitor-toolbar select {
  padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--gl-bd2);
  background: rgba(255,255,255,0.7);
  font: inherit; font-size: 0.8rem;
  color: var(--txt);
  min-height: 40px;
}
[data-theme="dark"] .monitor-toolbar select { background: rgba(255,255,255,0.08); }

/* Responsive */
@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-120%);
    width: 260px;
    z-index: 300 !important;
    background: var(--gl-bg) !important;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay { display: none; }
  .sidebar-overlay.active { display: block; pointer-events: auto; z-index: 290 !important; }
  .main-content { margin-left: 0; padding: 10px 12px 80px; }
  body.sidebar-collapsed .main-content { margin-left: 0; }
  .mobile-toggle { display: flex; }
  .collapse-btn { display: none; }
  .topbar { padding: 10px 12px; top: 10px; }
  body.sidebar-open .topbar { z-index: 10 !important; }
  .stats-grid { gap: 8px; }
  .stat-card { padding: 10px; }
  .stat-value { font-size: 1.1rem; }
  .nav-item, .tab, .btn, .page-btn, .mobile-toggle, .icon-btn, .theme-btn,
  .collapse-btn, .logout-btn, .copy-btn {
    min-height: 44px;
  }
  .mobile-toggle, .icon-btn, .theme-btn, .collapse-btn, .logout-btn {
    min-width: 44px;
  }
  input, textarea, select { font-size: 16px !important; }
}

@media (max-width: 480px) {
  .topbar-left h1 { font-size: 1rem; }
  .stat-value { font-size: 1rem; }
  .actions .btn { min-width: 100%; }
}

/* Hover none */
@media (hover: none) {
  .nav-item:hover, .btn:hover, .tab:hover, .stat-card:hover {
    transform: none; box-shadow: inherit;
  }
}

/* Safe area */
@supports (padding: env(safe-area-inset-bottom)) {
  .main-content { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  .sidebar { top: calc(12px + env(safe-area-inset-top)); bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left)); }
}
</style>
</head>
<body>

<!-- SECURITY GATE -->
<div class="gate" id="securityGate">
  <div class="gate-spinner" id="gateSpinner"></div>
  <div class="gate-text" id="gateText">Verifikasi akses...</div>
</div>

<!-- APP -->
<div id="appRoot" hidden>

<div class="bg" aria-hidden="true"></div>

<div class="layout">

  <aside class="sidebar glass" id="sidebar">
    <div class="sidebar-header">

        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard" class="nav-item">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>

      <a href="/admin" class="nav-item active">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 9.5-8 10-4.5-.5-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="nav-label">Admin</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userInitial">?</div>
        <div class="user-details">
          <div class="user-name" id="userName">—</div>
          <div class="user-balance" id="userBalance">—</div>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Keluar" type="button">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

        <button class="theme-btn glass" id="themeBtn" type="button" aria-label="Tema">
          <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn glass" id="refreshBtn" type="button" title="Refresh">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>

    <div class="stats-grid" id="statsGrid">
      <div class="stat-card glass-card"><div class="stat-label">Total User</div><div class="stat-value" id="statUsers">—</div></div>
      <div class="stat-card glass-card"><div class="stat-label">Total Order</div><div class="stat-value" id="statOrders">—</div></div>
      <div class="stat-card glass-card"><div class="stat-label">Pending Dep</div><div class="stat-value" id="statPending">—</div></div>
      <div class="stat-card glass-card"><div class="stat-label">Total Saldo</div><div class="stat-value" id="statBalance">—</div></div>

    <div class="tabs glass" id="tabs">
      <button class="tab active" data-tab="users" type="button">Users</button>

      <button class="tab" data-tab="monitor" type="button">Monitor</button>
      <button class="tab" data-tab="tools" type="button">Tools</button>

    <div class="search-bar" id="searchBar">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" placeholder="Cari user / order / deposit...">

</div>

<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box glass-card">
    <h3 id="alertTitle">Info</h3>
    <p id="alertMessage">—</p>
    <div class="alert-actions" id="alertActions"></div>
  </div>
</div>

</div>

<script>
/* ============================================================
   ADMIN.JS — Simple, Full Tools
   ============================================================ */
(function () {
  'use strict';

  /* §0 — SAFE STORAGE */
  const Safe = (() => {
    let ls = null;
    try { ls = window.localStorage; ls.setItem('__t','1'); ls.removeItem('__t'); } catch(e) { ls = null; }
    const mem = new Map();
    return {
      get(k) { try { return ls ? ls.getItem(k) : (mem.get(k) ?? null); } catch(e) { return mem.get(k) ?? null; } },
      set(k,v) { try { if(ls) ls.setItem(k,v); else mem.set(k,v); } catch(e) { mem.set(k,v); } },
      remove(k) { try { if(ls) ls.removeItem(k); else mem.delete(k); } catch(e) { mem.delete(k); } },
    };
  })();

  /* §1 — HELPERS */
  const $ = (id) => document.getElementById(id);
  const token = Safe.get('access_token');

  function safeJson(res) { return res.json().catch(() => ({})); }
  function escapeHtml(v) {
    return String(v ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }
  function fmtRp(n) { return 'Rp' + (Number(n) || 0).toLocaleString('id-ID'); }
  function fmtDate(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleString('id-ID', {
        day: '2-digit', month: 'short', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    } catch(e) { return '—'; }
  }
  function initial(name) { return String(name || '?').trim().charAt(0).toUpperCase() || '?'; }

  async function api(url, opts = {}) {
    opts.headers = Object.assign({
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
    }, opts.headers || {});
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    opts.signal = ctrl.signal;
    try {
      const res = await fetch(url, opts);
      const data = await safeJson(res);
      if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
      return data;
    } finally { clearTimeout(timer); }
  }

  /* §2 — ALERT / CONFIRM */
  function showAlert({ title, message, type = 'info', okText = 'OK', showCancel = false, cancelText = 'Batal' }) {
    return new Promise((resolve) => {
      const overlay = $('alertOverlay');
      const t = $('alertTitle'), m = $('alertMessage'), a = $('alertActions');
      t.textContent = title || 'Info';
      m.textContent = message || '';
      a.innerHTML = '';
      if (showCancel) {
        const b = document.createElement('button');
        b.className = 'btn'; b.type = 'button'; b.textContent = cancelText;
        b.addEventListener('click', () => { overlay.classList.remove('active'); resolve(false); });
        a.appendChild(b);
      }
      const ok = document.createElement('button');
      ok.className = 'btn btn-primary' + (type === 'error' || type === 'danger' ? ' btn-danger' : '');
      ok.type = 'button'; ok.textContent = okText;
      ok.addEventListener('click', () => { overlay.classList.remove('active'); resolve(true); });
      a.appendChild(ok);
      overlay.classList.add('active');
    });
  }
  const confirmBox = (msg, title = 'Konfirmasi') => showAlert({ title, message: msg, type: 'warning', okText: 'Ya', showCancel: true });

  /* §3 — COPY */
  function copyText(text, btnEl) {
    const done = () => {
      if (!btnEl) return;
      const orig = btnEl.innerHTML;
      btnEl.innerHTML = '✓';
      setTimeout(() => btnEl.innerHTML = orig, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    } catch(e) {}
  }

  /* §4 — THEME */
  (function initTheme() {
    const btn = $('themeBtn');
    if (!btn) return;
    btn.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const nx = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nx);
      Safe.set('asyrofotp_theme', nx);
    });
  })();

  /* §5 — SIDEBAR */
  (function initSidebar() {
    const sidebar = $('sidebar');
    const collapseBtn = $('collapseBtn');
    const toggle = $('mobileToggle');
    const overlay = $('sidebarOverlay');
    if (!sidebar) return;

    // Desktop collapse
    if (collapseBtn && window.innerWidth > 768) {
      if (Safe.get('sidebar_collapsed') === 'true') {
        sidebar.classList.add('collapsed');
        document.body.classList.add('sidebar-collapsed');
      }
      collapseBtn.addEventListener('click', () => {
        if (window.innerWidth <= 768) return;
        const c = sidebar.classList.toggle('collapsed');
        document.body.classList.toggle('sidebar-collapsed', c);
        Safe.set('sidebar_collapsed', c);
      });
    }

    // Mobile toggle
    let open = false;
    let lastToggle = 0;
    function openSb() {
      if (open) return;
      open = true;
      sidebar.classList.add('open');
      if (overlay) overlay.classList.add('active');
      document.body.classList.add('sidebar-open');
    }
    function closeSb() {
      if (!open) return;
      open = false;
      sidebar.classList.remove('open');
      if (overlay) overlay.classList.remove('active');
      document.body.classList.remove('sidebar-open');
    }
    function onToggle(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      const now = Date.now();
      if (now - lastToggle < 300) return;
      lastToggle = now;
      if (open) closeSb(); else openSb();
    }
    if (toggle) {
      toggle.addEventListener('click', onToggle);
      toggle.addEventListener('touchend', onToggle, { passive: false });
    }
    if (overlay) {
      overlay.addEventListener('click', (e) => { e.preventDefault(); closeSb(); });
      overlay.addEventListener('touchstart', (e) => { e.preventDefault(); closeSb(); }, { passive: false });
    }
    sidebar.querySelectorAll('.nav-item').forEach(l => {
      l.addEventListener('click', () => {
        if (window.innerWidth <= 768) setTimeout(closeSb, 100);
      });
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 768 && open) closeSb();
    });
  })();

  /* §6 — LOGOUT */
  async function doLogout() {
    try {
      await api('/api/auth/logout', { method: 'POST' });
    } catch(e) {}
    try {
      Safe.remove('access_token');
      Safe.remove('user');
      Safe.remove('refresh_token');
    } catch(e) {}
    location.href = '/landing';
  }
  $('logoutBtn')?.addEventListener('click', async () => {
    if (await confirmBox('Yakin mau keluar dari akun ini?', 'Keluar Akun?')) doLogout();
  });

  /* §7 — SECURITY GATE */
  function gateFreeze(msg) {
    const sp = $('gateSpinner');
    const tx = $('gateText');
    if (sp) sp.classList.add('frozen');
    if (tx) { tx.classList.add('frozen'); tx.textContent = msg || 'Akses ditolak'; }
  }
  function gateOpen() {
    const g = $('securityGate');
    const app = $('appRoot');
    if (g) g.classList.add('hidden');
    if (app) app.hidden = false;
  }

  /* §8 — STATE */
  const state = {
    tab: 'users',
    search: '',
    page: 1,
    limit: 20,
    totalPages: 1,
    isLoading: false,
  };

  /* §9 — STATS */
  async function loadStats() {
    try {
      const data = await api('/api/admin/stats');
      $('statUsers').textContent = data.total_users || 0;
      $('statOrders').textContent = data.total_orders || 0;
      $('statPending').textContent = data.pending_deposits || 0;
      $('statBalance').textContent = fmtRp(data.total_balance || 0);
    } catch(e) {}
  }

  /* §10 — LOAD CURRENT TAB */
  function loadTab() {
    const searchBar = $('searchBar');
    if (searchBar) searchBar.style.display = (state.tab === 'tools' || state.tab === 'audit' || state.tab === 'monitor') ? 'none' : 'flex';
    $('pagination').hidden = true;

    if (state.tab === 'users') loadUsers();
    else if (state.tab === 'orders') loadOrders();
    else if (state.tab === 'deposits') loadDeposits();
    else if (state.tab === 'monitor') loadMonitor();
    else if (state.tab === 'tools') loadTools();
    else if (state.tab === 'audit') loadAudit();
  }

  /* §11 — RENDER HELPERS */
  function emptyBlock(msg = 'Belum ada data') {
    return `<div class="empty-block"><p>${escapeHtml(msg)}</p></div>`;
  }
  function loadingBlock(msg = 'Memuat...') {
    return `<div class="empty-block"><div class="spinner-sm"></div><p>${escapeHtml(msg)}</p></div>`;
  }
  function errorBlock(msg) {
    return `<div class="empty-block"><p style="color:var(--err);">${escapeHtml(msg)}</p></div>`;
  }
  function renderPagination(data, onPage) {
    const el = $('pagination');
    if (!el) return;
    if (!data.total_pages || data.total_pages <= 1) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = `
      <button class="page-btn" type="button" data-page="${data.page - 1}" ${data.page <= 1 ? 'disabled' : ''}>← Prev</button>
      <span class="page-info">${data.page} / ${data.total_pages}</span>
      <button class="page-btn" type="button" data-page="${data.page + 1}" ${data.page >= data.total_pages ? 'disabled' : ''}>Next →</button>
    `;
    el.querySelectorAll('.page-btn').forEach(b => {
      b.addEventListener('click', () => {
        const p = Number(b.dataset.page);
        if (p >= 1 && p <= data.total_pages) onPage(p);
      });
    });
  }

  /* §12 — USERS */
  async function loadUsers() {
    const c = $('content');
    c.innerHTML = loadingBlock('Memuat users...');
    try {
      const q = new URLSearchParams({ page: state.page, limit: state.limit, search: state.search });
      const data = await api('/api/admin/users?' + q);
      if (!data.users || data.users.length === 0) { c.innerHTML = emptyBlock('Belum ada user'); return; }
      c.innerHTML = data.users.map(u => {
        const banned = u.status === 'banned';
        return `
          <div class="card glass-card">
            <div class="card-header">
              <div class="card-title-wrap">
                <div class="card-title">
                  ${escapeHtml(u.name || u.username)}
                  ${u.role === 'admin' ? '<span class="badge info">ADMIN</span>' : ''}
                  ${banned ? '<span class="badge danger">BANNED</span>' : ''}
                </div>
                <div class="card-sub">@${escapeHtml(u.username)} · ${escapeHtml(u.user_code || '—')}</div>
              </div>
            </div>
            <div class="grid-2">
              <div class="field"><span class="field-label">Saldo</span><span class="field-value primary">${fmtRp(u.balance)}</span></div>
              <div class="field"><span class="field-label">Order</span><span class="field-value">${u.total_orders || 0}</span></div>
              <div class="field"><span class="field-label">Deposit</span><span class="field-value">${u.total_deposits || 0}</span></div>
              <div class="field"><span class="field-label">Dibuat</span><span class="field-value" style="font-size:0.72rem;">${fmtDate(u.created_at)}</span></div>
            </div>
            <div class="actions">
              <button class="btn" type="button" data-act="user-detail" data-id="${escapeHtml(u.id)}">Detail</button>

  /* §14 — BALANCE MODAL */
  function showBalanceModal(id, username, current) {
    openModal(`
      <div class="modal-header">
        <div class="modal-title">Edit Saldo — @${escapeHtml(username)}</div>
        <button class="modal-close" type="button" data-close-modal>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

      </div>

        <div class="form-group">
          <label class="form-label">Mode</label>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-primary" type="button" data-mode="add" style="flex:1;">+ Tambah</button>
            <button class="btn" type="button" data-mode="subtract" style="flex:1;">− Kurangi</button>
            <button class="btn" type="button" data-mode="set" style="flex:1;">= Set</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Jumlah (Rp)</label>
          <input class="form-control" type="number" id="balAmount" min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Catatan (opsional)</label>
          <input class="form-control" type="text" id="balNote" placeholder="Alasan edit saldo">
        </div>
        <button class="btn btn-primary btn-block" type="button" id="balSave">Simpan</button>
      </div>
    `);

    let mode = 'add';
    document.querySelectorAll('[data-mode]').forEach(b => {
      b.addEventListener('click', () => {
        mode = b.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach(x => { x.className = 'btn'; x.style.flex = '1'; });
        b.className = 'btn btn-primary';
        b.style.flex = '1';
      });
    });

    $('balSave').addEventListener('click', async () => {
      const amount = Number($('balAmount').value);
      const note = $('balNote').value.trim();
      if (!Number.isFinite(amount) || amount < 0) return showAlert({ title: 'Error', message: 'Jumlah harus angka >= 0', type: 'error' });
      const btn = $('balSave');
      const orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>';
      try {
        const res = await api('/api/admin/users/' + encodeURIComponent(id) + '/balance', {
          method: 'POST',
          body: JSON.stringify({ mode, amount, note }),
        });
        closeModal();
        await showAlert({ title: 'Berhasil', message: `Saldo diupdate: ${fmtRp(res.old_balance)} → ${fmtRp(res.new_balance)}`, type: 'success' });
        loadUsers(); loadStats();
      } catch(e) {
        btn.disabled = false; btn.innerHTML = orig;
        showAlert({ title: 'Gagal', message: e.message, type: 'error' });
      }
    });
  }

  async function toggleBan(id, status) {
    const newStatus = status === 'banned' ? 'active' : 'banned';

    try {
      await api('/api/admin/users/' + encodeURIComponent(id) + '/status', {

        body: JSON.stringify({ status: newStatus }),
      });
      showAlert({ title: 'Berhasil', message: `User di-${newStatus === 'banned' ? 'ban' : 'unban'}`, type: 'success' });
      loadUsers();
    } catch(e) { showAlert({ title: 'Gagal', message: e.message, type: 'error' }); }
  }

  /* §18 — ORDERS */
  async function loadOrders() {
    const c = $('content');
    c.innerHTML = loadingBlock('Memuat orders...');
    try {
      const q = new URLSearchParams({ page: state.page, limit: state.limit, search: state.search });
      const data = await api('/api/admin/orders?' + q);
      if (!data.orders || data.orders.length === 0) { c.innerHTML = emptyBlock('Belum ada order'); return; }
      c.innerHTML = data.orders.map(o => {
        const cls = ['success','received','confirmed'].includes(o.status) ? 'success'
                  : o.status === 'pending' ? 'warning'
                  : ['cancelled','expired','failed'].includes(o.status) ? 'danger'
                  : o.status === 'refunded' ? 'purple' : 'gray';
        const canNotif = ['received','success','confirmed'].includes(o.status) && o.otp_code && o.otp_id;
        const notifBtn = canNotif ? `<button class="btn ${o.notified_at ? 'btn-danger' : 'btn-success'}" type="button" data-act="order-notif" data-id="${escapeHtml(o.otp_id)}" data-force="${o.notified_at ? '1' : '0'}">${o.notified_at ? 'Resend Notif' : 'Kirim Notif'}</button>` : '';
        return `
          <div class="card glass-card">
            <div class="card-header">
              <div class="card-title-wrap">
                <div class="card-title">${escapeHtml(o.service_name || o.service || '—')} · ${escapeHtml(o.country_name || o.country || '—')}</div>
                <div class="card-sub">${escapeHtml(o.order_id)} · ${escapeHtml(o.otp_id || '—')}</div>
              </div>
              <span class="badge ${cls}">${escapeHtml(o.status).toUpperCase()}</span>
            </div>
            <div class="grid-2">
              <div class="field"><span class="field-label">User</span><span class="field-value">@${escapeHtml(o.username || '—')}</span></div>
              <div class="field"><span class="field-label">Nomor</span><span class="field-value">${escapeHtml(o.phone_number || '—')}</span></div>
              <div class="field"><span class="field-label">Harga</span><span class="field-value primary">${fmtRp(o.price)}</span></div>
              <div class="field"><span class="field-label">OTP</span><span class="field-value success">${escapeHtml(o.otp_code || '—')}</span></div>
              <div class="field"><span class="field-label">Profit</span><span class="field-value ${o.profit > 0 ? 'success' : 'danger'}">${fmtRp(o.profit)}</span></div>
              <div class="field"><span class="field-label">Dibuat</span><span class="field-value" style="font-size:0.72rem;">${fmtDate(o.created_at)}</span></div>
            </div>
            <div class="actions">
              <button class="btn" type="button" data-act="order-detail" data-id="${escapeHtml(o.order_id)}">Detail</button>
              <button class="btn btn-primary" type="button" data-act="order-status" data-id="${escapeHtml(o.order_id)}" data-status="${escapeHtml(o.status)}">Ubah Status</button>
              ${notifBtn}
            </div>
          </div>
        `;
      }).join('');
      bindOrderActions();
      renderPagination(data, (p) => { state.page = p; loadOrders(); });
    } catch(e) { c.innerHTML = errorBlock(e.message); }
  }

      const logs = (data.logs || []).map(l => `<div class="log-item"><div class="log-time">${fmtDate(l.created_at)}</div><div class="log-text">${escapeHtml(l.old_status || '—')} → ${escapeHtml(l.new_status)} (${escapeHtml(l.reason || '')})</div></div>`).join('') || '<div class="log-item" style="text-align:center;color:var(--txt3);">Belum ada log</div>';
      openModal(`
        <div class="modal-header">
          <div class="modal-title">Detail Deposit</div>
          <button class="modal-close" type="button" data-close-modal>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="grid-2">
            <div class="field"><span class="field-label">Reference</span><span class="field-value primary">${escapeHtml(d.reference_id)}</span></div>
            <div class="field"><span class="field-label">Method</span><span class="field-value">${d.method === 'qrispy' ? 'QRIS Otomatis' : 'QRIS DANA'}</span></div>
            <div class="field"><span class="field-label">Saldo Top Up</span><span class="field-value primary">${fmtRp(d.amount)}</span></div>
            <div class="field"><span class="field-label">Total Bayar</span><span class="field-value">${fmtRp(d.total_amount)}</span></div>
            <div class="field"><span class="field-label">Fee</span><span class="field-value warning">${fmtRp(d.fee)}</span></div>
            <div class="field"><span class="field-label">Status</span><span class="field-value">${escapeHtml(d.status)}</span></div>
            <div class="field"><span class="field-label">User</span><span class="field-value">@${escapeHtml(d.username || '—')}</span></div>
            <div class="field"><span class="field-label">Saldo User</span><span class="field-value">${fmtRp(d.user_balance)}</span></div>
            <div class="field"><span class="field-label">Dibuat</span><span class="field-value" style="font-size:0.72rem;">${fmtDate(d.created_at)}</span></div>
          </div>
          <div>
            <div class="field-label" style="margin-bottom:4px;">Log Status</div>
            <div class="log-list">${logs}</div>
          </div>
        </div>
      `);
    } catch(e) { openModal('<div class="modal-body">' + errorBlock(e.message) + '</div>'); }
  }

  async function sendDepositNotif(ref, force) {
    const ok = await confirmBox(`Kirim notif deposit untuk ${ref}${force ? ' (resend)' : ''}?`);
    if (!ok) return;
    try {
      const res = await api('/api/admin/notif-deposit/' + encodeURIComponent(ref), {
        method: 'POST',
        body: JSON.stringify({ force }),
      });
      showAlert({ title: 'Berhasil', message: `Notif terkirim. Message ID: ${res.message_id || '—'}`, type: 'success' });
      loadDeposits();
    } catch(e) { showAlert({ title: 'Gagal', message: e.message, type: 'error' }); }
  }

  /* §20 — STATUS MODAL */
  function showStatusModal(type, id, current) {
    const orderStatuses = ['pending','success','received','confirmed','cancelled','expired','failed','refunded'];
    const depositStatuses = ['pending','success','cancelled','expired','failed','refunded'];
    const opts = type === 'order' ? orderStatuses : depositStatuses;
    openModal(`
      <div class="modal-header">
        <div class="modal-title">Ubah Status ${type === 'order' ? 'Order' : 'Deposit'}</div>
        <button class="modal-close" type="button" data-close-modal>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="field"><span class="field-label">${type === 'order' ? 'Order ID' : 'Reference'}</span><span class="field-value primary">${escapeHtml(id)}</span></div>
        <div class="form-group">
          <label class="form-label">Status Baru</label>
          <select class="form-control" id="statusSelect">
            ${opts.map(s => `<option value="${s}" ${s === current ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Catatan (opsional)</label>
          <input class="form-control" type="text" id="statusNote" placeholder="Alasan ubah status">
        </div>
        <button class="btn btn-primary btn-block" type="button" id="statusSave">Simpan</button>
      </div>
    `);
    $('statusSave').addEventListener('click', async () => {
      const newStatus = $('statusSelect').value;
      const note = $('statusNote').value.trim();
      if (newStatus === current) return closeModal();
      const ok = await confirmBox(`Ubah status dari "${current}" ke "${newStatus}"? Saldo user akan otomatis disesuaikan.`);
      if (!ok) return;
      const btn = $('statusSave');
      btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>';
      try {
        const endpoint = type === 'order'
          ? '/api/admin/order/' + encodeURIComponent(id) + '/status'
          : '/api/admin/deposit/' + encodeURIComponent(id) + '/status';
        const res = await api(endpoint, { method: 'POST', body: JSON.stringify({ status: newStatus, note }) });
        closeModal();
        const adj = Number(res.balance_adjustment) || 0;
        const adjTxt = adj > 0 ? `+${fmtRp(adj)}` : (adj < 0 ? `-${fmtRp(Math.abs(adj))}` : 'tidak ada adjustment');
        showAlert({ title: 'Berhasil', message: `Status "${newStatus}". Saldo: ${adjTxt}`, type: 'success' });
        if (type === 'order') loadOrders(); else loadDeposits();
        loadStats();
      } catch(e) {
        btn.disabled = false; btn.innerHTML = 'Simpan';
        showAlert({ title: 'Gagal', message: e.message, type: 'error' });
      }
    });
  }

  /* §21 — MONITOR */
  async function loadMonitor() {
    const c = $('content');
    c.innerHTML = `
      <div class="monitor-toolbar">
        <select id="mHours">
          <option value="1">1 jam</option>
          <option value="3">3 jam</option>
          <option value="6" selected>6 jam</option>
          <option value="12">12 jam</option>
          <option value="24">24 jam</option>
          <option value="72">3 hari</option>
          <option value="168">7 hari</option>
        </select>
        <select id="mType">
          <option value="all">Semua</option>
          <option value="otp">OTP</option>
          <option value="deposit">Deposit</option>
        </select>
        <select id="mFilter">
          <option value="">Semua status</option>
          <option value="unnotified">Belum di-notif</option>
          <option value="notified">Sudah di-notif</option>
        </select>
        <button class="btn btn-primary" type="button" id="mRefresh">Refresh</button>
      </div>
      <div id="monitorContent">${loadingBlock('Memuat events...')}</div>
    `;
    $('mRefresh').addEventListener('click', loadMonitor);
    $('mHours').addEventListener('change', loadMonitor);
    $('mType').addEventListener('change', loadMonitor);
    $('mFilter').addEventListener('change', loadMonitor);
    try {
      const hours = $('mHours').value;
      const type = $('mType').value;
      const filter = $('mFilter').value;
      const q = new URLSearchParams({ hours, type, limit: 100 });
      if (filter === 'notified') q.set('only_notified', '1');
      if (filter === 'unnotified') q.set('only_unnotified', '1');
      const data = await api('/api/admin/webhook-monitor?' + q);
      const mc = $('monitorContent');
      const stats = `
        <div class="monitor-stats">
          <div class="monitor-stat glass-card"><div class="lbl">Total Events</div><div class="val">${data.total || 0}</div></div>
          <div class="monitor-stat glass-card"><div class="lbl">Range</div><div class="val">${hours}j</div></div>
        </div>
      `;
      if (!data.events || data.events.length === 0) {
        mc.innerHTML = stats + emptyBlock('Tidak ada event');
        return;
      }
      mc.innerHTML = stats + data.events.map(e => {
        const isOtp = e.entity_type === 'order';
        const isSuccess = ['received','success','confirmed'].includes(e.new_status);
        const isFail = ['cancelled','expired','failed','refunded'].includes(e.new_status);
        const cls = isSuccess ? 'success' : (isFail ? 'danger' : 'warning');
        let body = '';
        if (isOtp && e.order) {
          const notified = !!e.order.notified_at;
          body = `
            <div class="grid-2">
              <div class="field"><span class="field-label">OTP ID</span><span class="field-value primary">${escapeHtml(e.order.otp_id || '—')}</span></div>
              <div class="field"><span class="field-label">Service</span><span class="field-value">${escapeHtml(e.order.service_name || '—')}</span></div>
              <div class="field"><span class="field-label">Phone</span><span class="field-value">${escapeHtml(e.order.phone || '—')}</span></div>
              <div class="field"><span class="field-label">OTP</span><span class="field-value success">${escapeHtml(e.order.otp_code || '—')}</span></div>
              <div class="field"><span class="field-label">User</span><span class="field-value">@${escapeHtml(e.user?.username || '—')}</span></div>
              <div class="field"><span class="field-label">Status</span><span class="field-value ${cls}">${escapeHtml(e.old_status || '—')} → ${escapeHtml(e.new_status)}</span></div>
              <div class="field"><span class="field-label">Notif</span><span class="field-value ${notified ? 'success' : 'danger'}">${notified ? '✓ Terkirim' : '✗ Belum'}</span></div>
            </div>
            ${isSuccess && e.order.otp_id ? `<div class="actions"><button class="btn ${notified ? 'btn-danger' : 'btn-success'}" type="button" data-act="mon-notif" data-id="${escapeHtml(e.order.otp_id)}" data-force="${notified ? '1' : '0'}">${notified ? 'Resend Notif' : 'Kirim Notif'}</button></div>` : ''}
          `;
        } else if (e.deposit) {
          const notified = !!e.deposit.notified_at;
          body = `
            <div class="grid-2">
              <div class="field"><span class="field-label">Reference</span><span class="field-value primary">${escapeHtml(e.deposit.reference_id || '—')}</span></div>
              <div class="field"><span class="field-label">Method</span><span class="field-value">${escapeHtml(e.deposit.method || '—')}</span></div>
              <div class="field"><span class="field-label">Amount</span><span class="field-value success">${fmtRp(e.deposit.amount)}</span></div>
              <div class="field"><span class="field-label">User</span><span class="field-value">@${escapeHtml(e.user?.username || '—')}</span></div>
              <div class="field"><span class="field-label">Status</span><span class="field-value ${cls}">${escapeHtml(e.old_status || '—')} → ${escapeHtml(e.new_status)}</span></div>
              <div class="field"><span class="field-label">Notif</span><span class="field-value ${notified ? 'success' : 'danger'}">${notified ? '✓ Terkirim' : '✗ Belum'}</span></div>
            </div>
            ${isSuccess && e.deposit.reference_id ? `<div class="actions"><button class="btn ${notified ? 'btn-danger' : 'btn-success'}" type="button" data-act="mon-notif-dep" data-id="${escapeHtml(e.deposit.reference_id)}" data-force="${notified ? '1' : '0'}">${notified ? 'Resend Notif' : 'Kirim Notif'}</button></div>` : ''}
          `;
        } else {
          body = `<div class="field"><span class="field-label">Entity</span><span class="field-value">${escapeHtml(e.entity_type)} · ${escapeHtml(e.entity_id)}</span></div>`;
        }
        return `
          <div class="card glass-card">
            <div class="card-header">
              <div class="card-title-wrap">
                <div class="card-title">${isOtp ? 'OTP' : 'Deposit'}</div>
                <div class="card-sub">${fmtDate(e.created_at)}</div>
              </div>
              <span class="badge ${cls}">${escapeHtml(e.new_status).toUpperCase()}</span>
            </div>
            ${body}
          </div>
        `;
      }).join('');

      document.querySelectorAll('[data-act="mon-notif"]').forEach(b => {
        b.addEventListener('click', () => sendOrderNotif(b.dataset.id, b.dataset.force === '1'));
      });
      document.querySelectorAll('[data-act="mon-notif-dep"]').forEach(b => {
        b.addEventListener('click', () => sendDepositNotif(b.dataset.id, b.dataset.force === '1'));
      });
    } catch(e) {
      $('monitorContent').innerHTML = errorBlock(e.message);
    }
  }

  /* §22 — TOOLS */
  function loadTools() {
    const c = $('content');
    c.innerHTML = `
      <div class="tools-grid">
        <div class="tool-card glass-card">
          <h4>📊 Stats Notif</h4>
          <p>Lihat berapa order/deposit yang sudah dikirim notif</p>
          <button class="btn btn-primary" type="button" data-tool="stats">Cek Stats</button>
          <div class="tool-result" id="res-stats" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>🧪 Test Notif OTP</h4>
          <p>Kirim pesan test ke channel OTP</p>
          <button class="btn btn-primary" type="button" data-tool="test-otp">Kirim Test</button>
          <div class="tool-result" id="res-test-otp" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>🧪 Test Notif Deposit</h4>
          <p>Kirim pesan test ke channel Deposit</p>
          <button class="btn btn-primary" type="button" data-tool="test-deposit">Kirim Test</button>
          <div class="tool-result" id="res-test-deposit" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>🔄 Backfill (Dry Run)</h4>
          <p>Cek berapa yang belum di-notif. TIDAK kirim apa-apa.</p>
          <input class="form-control" type="number" id="bfDays" value="30" min="1" max="365" style="margin-bottom:6px;">
          <button class="btn btn-primary" type="button" data-tool="bf-dry">Cek Dry Run</button>
          <div class="tool-result" id="res-bf-dry" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>🚀 Backfill (Kirim)</h4>
          <p>Kirim notif ke semua yang belum. Batch 50.</p>
          <input class="form-control" type="number" id="bfDaysReal" value="30" min="1" max="365" style="margin-bottom:6px;">
          <button class="btn btn-danger" type="button" data-tool="bf-real">⚠️ Kirim</button>
          <div class="tool-result" id="res-bf-real" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>🔍 Server Balance</h4>
          <p>Cek saldo server ekonomi / premium</p>
          <div style="display:flex;gap:6px;margin-bottom:6px;">
            <button class="btn" type="button" data-tool="srv-ekonomi" style="flex:1;">Ekonomi</button>
            <button class="btn" type="button" data-tool="srv-premium" style="flex:1;">Premium</button>
          </div>
          <div class="tool-result" id="res-srv" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>📈 Price Locks</h4>
          <p>Lihat cache harga yang di-lock</p>
          <button class="btn btn-primary" type="button" data-tool="plocks">Lihat</button>
          <div class="tool-result" id="res-plocks" hidden></div>
        </div>
        <div class="tool-card glass-card">
          <h4>💰 Profit Report</h4>
          <p>Profit nokos + fee deposit</p>
          <input class="form-control" type="number" id="profDays" value="30" min="1" max="365" style="margin-bottom:6px;">
          <button class="btn btn-primary" type="button" data-tool="profit">Cek</button>
          <div class="tool-result" id="res-profit" hidden></div>
        </div>
      </div>
    `;

    document.querySelectorAll('[data-tool]').forEach(b => {
      b.addEventListener('click', () => runTool(b.dataset.tool, b));
    });
  }

  async function runTool(tool, btn) {
    const map = { stats: 'res-stats', 'test-otp': 'res-test-otp', 'test-deposit': 'res-test-deposit', 'bf-dry': 'res-bf-dry', 'bf-real': 'res-bf-real', 'srv-ekonomi': 'res-srv', 'srv-premium': 'res-srv', plocks: 'res-plocks', profit: 'res-profit' };
    const resEl = $(map[tool]);
    if (!resEl) return;
    resEl.hidden = false;
    resEl.className = 'tool-result';
    resEl.textContent = 'Loading...';
    const orig = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = '<span class="spinner-sm"></span>';
    try {
      let result;
      if (tool === 'stats') {
        result = await api('/api/admin/test-notif', { method: 'POST', body: JSON.stringify({ type: 'stats' }) });
      } else if (tool === 'test-otp') {
        result = await api('/api/admin/test-notif', { method: 'POST', body: JSON.stringify({ type: 'otp' }) });
      } else if (tool === 'test-deposit') {
        result = await api('/api/admin/test-notif', { method: 'POST', body: JSON.stringify({ type: 'deposit' }) });
      } else if (tool === 'bf-dry') {
        const days = Number($('bfDays').value) || 30;
        result = await api('/api/admin/backfill-notifs', { method: 'POST', body: JSON.stringify({ type: 'all', days, limit: 50, dry_run: true }) });
      } else if (tool === 'bf-real') {
        const ok = await confirmBox('Backfill ini bakal KIRIM notif ke semua. Yakin?');
        if (!ok) { btn.disabled = false; btn.innerHTML = orig; resEl.textContent = 'Dibatalkan'; return; }
        const days = Number($('bfDaysReal').value) || 30;
        result = await api('/api/admin/backfill-notifs', { method: 'POST', body: JSON.stringify({ type: 'all', days, limit: 50, dry_run: false }) });
      } else if (tool === 'srv-ekonomi') {
        result = await api('/api/admin/server-balance?provider=ekonomi');
      } else if (tool === 'srv-premium') {
        result = await api('/api/admin/server-balance?provider=premium');
      } else if (tool === 'plocks') {
        result = await api('/api/admin/price-locks?limit=50');
      } else if (tool === 'profit') {
        const days = Number($('profDays').value) || 30;
        result = await api('/api/admin/profit?days=' + days);
      }
      resEl.classList.add('success');
      resEl.textContent = JSON.stringify(result, null, 2);
    } catch(e) {
      resEl.classList.add('error');
      resEl.textContent = e.message;
    } finally {
      btn.disabled = false; btn.innerHTML = orig;
    }
  }

  /* §23 — AUDIT */
  async function loadAudit() {
    const c = $('content');
    c.innerHTML = loadingBlock('Memuat audit log...');
    try {
      const q = new URLSearchParams({ page: state.page, limit: 50 });
      const data = await api('/api/admin/audit-log?' + q);
      if (!data.logs || data.logs.length === 0) { c.innerHTML = emptyBlock('Belum ada log'); return; }
      c.innerHTML = data.logs.map(l => {
        const meta = l.metadata || {};
        return `
          <div class="card glass-card">
            <div class="card-header">
              <div class="card-title-wrap">
                <div class="card-title">${escapeHtml(l.new_status || l.reason || 'action')}</div>
                <div class="card-sub">Admin: ${escapeHtml(meta.admin_username || meta.admin_id || '—')} · Target: ${escapeHtml(l.entity_id || '—')}</div>
              </div>
            </div>
            <div class="grid-2">
              <div class="field"><span class="field-label">Waktu</span><span class="field-value" style="font-size:0.72rem;">${fmtDate(l.created_at)}</span></div>
              ${meta.adjustment !== undefined ? `<div class="field"><span class="field-label">Adjustment</span><span class="field-value ${Number(meta.adjustment) > 0 ? 'success' : 'danger'}">${Number(meta.adjustment) > 0 ? '+' : ''}${fmtRp(Math.abs(Number(meta.adjustment) || 0))}</span></div>` : ''}
              ${meta.note ? `<div class="field"><span class="field-label">Catatan</span><span class="field-value">${escapeHtml(meta.note)}</span></div>` : ''}
            </div>
          </div>
        `;
      }).join('');
      renderPagination(data, (p) => { state.page = p; loadAudit(); });
    } catch(e) { c.innerHTML = errorBlock(e.message); }
  }

  /* §24 — MODAL HELPERS */
  function openModal(html) {
    const m = $('modalContent');
    const o = $('modal');
    if (!m || !o) return;
    m.innerHTML = html;
    o.classList.add('active');
    m.querySelectorAll('[data-close-modal]').forEach(b => {
      b.addEventListener('click', closeModal);
    });
  }
  function closeModal() {
    $('modal').classList.remove('active');
  }
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')) closeModal();
  });
  $('modal').addEventListener('touchstart', (e) => {
    if (e.target === $('modal')) { e.preventDefault(); closeModal(); }
  }, { passive: false });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  /* §25 — TABS */
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      state.tab = t.dataset.tab;
      state.page = 1;
      state.search = '';
      const s = $('searchInput'); if (s) s.value = '';
      loadTab();
    });
  });

  /* §26 — SEARCH */
  let searchTimer = null;
  $('searchInput')?.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.search = e.target.value.trim();
      state.page = 1;
      loadTab();
    }, 400);
  });

  /* §27 — REFRESH */
  $('refreshBtn')?.addEventListener('click', () => {
    loadStats();
    loadTab();
  });

  /* §28 — INIT + SECURITY CHECK */
  (async function init() {
    if (!token) {
      gateFreeze('Token tidak ditemukan. Redirect...');
      setTimeout(() => location.href = '/login', 800);
      return;
    }
    try {
      const user = await api('/api/user');
      if (!user || !user.username) {
        gateFreeze('Data user invalid');
        return;
      }
      if (user.status === 'banned') {
        gateFreeze('Akun diblokir');
        setTimeout(() => location.href = '/landing', 1500);
        return;
      }
      const isAdmin = user.role === 'admin'
        || String(user.username).toLowerCase() === 'asyrofc'
        || String(user.user_code) === 'SRF2667442394';
      if (!isAdmin) {
        gateFreeze('Bukan admin');
        await showAlert({ title: 'Akses Ditolak', message: 'Halaman ini khusus admin.', type: 'error' });
        location.href = '/dashboard';
        return;
      }

      // Render user info
      const name = user.name || user.username || '—';
      $('userName').textContent = name;
      $('userBalance').textContent = fmtRp(user.balance);
      $('userInitial').textContent = initial(name);

      gateOpen();
      loadStats();
      loadTab();
    } catch(e) {
      gateFreeze('Gagal verifikasi: ' + e.message);
      if (e.message.includes('401') || e.message.includes('403')) {
        Safe.remove('access_token');
        setTimeout(() => location.href = '/login', 1200);
      }
    }
  })();

})();
</script>
