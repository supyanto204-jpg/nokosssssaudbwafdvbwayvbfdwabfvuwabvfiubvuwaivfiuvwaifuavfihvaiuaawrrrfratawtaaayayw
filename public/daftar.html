<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - AsyrofOTP</title>
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- reCAPTCHA v3 (invisible) -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg" async defer></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --bg-light: #f8fafc;
            --border-dark: #0f172a;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 160vmax;
            height: 160vmax;
            transform: translate3d(-50%, -50%, 0);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(37, 99, 235, 0.06) 0deg 10deg,
                transparent 10deg 20deg
            );
            -webkit-mask-image: radial-gradient(circle, black 0%, transparent 60%);
            mask-image: radial-gradient(circle, black 0%, transparent 60%);
            animation: spin 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes spin {
            from { transform: translate3d(-50%, -50%, 0) rotate(0deg); }
            to { transform: translate3d(-50%, -50%, 0) rotate(360deg); }
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 900;
            font-size: 1.5rem;
        }

        .auth-logo .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
            border: 2.5px solid var(--border-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 1.8rem;
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            text-shadow: 1.5px 1.5px 0px rgba(15, 23, 42, 0.4);
            transform: rotate(-3deg);
        }

        .auth-logo span { color: var(--primary); }

        .auth-card {
            background: white;
            border: 2px solid var(--border-dark);
            border-radius: 16px;
            box-shadow: 6px 6px 0px rgba(15, 23, 42, 1);
            padding: 32px;
        }

        .auth-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .auth-card .subtitle {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* ===== Progress steps ===== */
        .steps {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
        }

        .step-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-light);
            border: 2px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--text-gray);
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .step-dot.active {
            background: var(--primary);
            color: white;
            transform: scale(1.15);
        }

        .step-dot.done {
            background: var(--success);
            color: white;
            border-color: var(--border-dark);
        }

        .step-line {
            flex: 1;
            height: 2px;
            background: var(--border-dark);
            opacity: 0.15;
            border-radius: 2px;
            transition: opacity 0.3s;
        }

        .step-line.done { opacity: 1; background: var(--success); }

        /* ===== Form group reveal ===== */
        .form-group {
            margin-bottom: 0;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
        }

        .form-group.visible {
            max-height: 200px;
            opacity: 1;
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: white;
            color: var(--text-dark);
            transition: all 0.2s;
            outline: none;
        }

        .form-control.with-eye { padding-right: 46px; }

        .form-control:focus {
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            transform: translate(-1px, -1px);
        }

        .form-control::placeholder { color: #94a3b8; }

        .form-control.invalid {
            border-color: var(--danger);
            background: #fef2f2;
        }

        .form-control.valid { border-color: var(--success); }

        .form-hint {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 6px;
            min-height: 16px;
        }

        .form-hint.error { color: var(--danger); font-weight: 600; }
        .form-hint.success { color: var(--success); font-weight: 600; }

        .eye-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .eye-btn:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .eye-btn .icon-svg { width: 18px; height: 18px; }

        /* ===== Checkbox persetujuan ===== */
        .terms-group {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
        }

        .terms-group.visible {
            max-height: 300px;
            opacity: 1;
            margin-bottom: 18px;
        }

        .terms-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 14px;
            background: var(--bg-light);
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .terms-box:hover { background: var(--primary-light); }

        .terms-box input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-top: 2px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .terms-text {
            font-size: 0.82rem;
            color: var(--text-dark);
            line-height: 1.5;
            font-weight: 500;
        }

        .terms-text a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .terms-text a:hover { text-decoration: underline; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: 2px solid var(--border-dark);
            box-shadow: 4px 4px 0px rgba(15, 23, 42, 1);
            transition: all 0.2s;
            background: var(--primary);
            color: white;
            margin-top: 4px;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(15, 23, 42, 1);
            background: var(--primary-dark);
        }

        .btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px rgba(15, 23, 42, 1);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            margin-bottom: 20px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .alert.show { display: flex; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }

        .alert .icon-svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner { to { transform: rotate(360deg); } }

        .recaptcha-notice {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-gray);
            margin-top: 16px;
            line-height: 1.5;
        }

        .recaptcha-notice a {
            color: var(--primary);
            text-decoration: none;
        }

        .recaptcha-notice a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-container">
    <a href="/landing" class="auth-logo">
        <div class="logo-icon">A</div>
        <div>Asyrof<span>OTP</span></div>
    </a>

    <div class="auth-card">
        <h1>Buat Akun</h1>
        <p class="subtitle">Daftar gratis, langsung bisa pakai.</p>

        <!-- Progress dots -->
        <div class="steps" id="steps">
            <div class="step-dot active" data-step="1">1</div>
            <div class="step-line" data-line="1"></div>
            <div class="step-dot" data-step="2">2</div>
            <div class="step-line" data-line="2"></div>
            <div class="step-dot" data-step="3">3</div>
            <div class="step-line" data-line="3"></div>
            <div class="step-dot" data-step="4">4</div>
        </div>

        <div class="alert" id="alert">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span id="alert-text"></span>
        </div>

        <form id="registerForm" autocomplete="on" novalidate>
            <!-- Step 1: Username -->
            <div class="form-group visible" id="group-username">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="username" autocomplete="username" autofocus>
                <div class="form-hint" id="hint-username">Huruf, angka, underscore. 3-20 karakter.</div>
            </div>

            <!-- Step 2: Nama Tampilan -->
            <div class="form-group" id="group-name">
                <label class="form-label">Nama Tampilan <span style="font-weight:500;color:var(--text-gray);">(opsional)</span></label>
                <input type="text" class="form-control" id="name" placeholder="Nama kamu" autocomplete="name">
                <div class="form-hint" id="hint-name">Boleh dikosongin.</div>
            </div>

            <!-- Step 3: Password -->
            <div class="form-group" id="group-password">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <input type="password" class="form-control with-eye" id="password" placeholder="Minimal 6 karakter" autocomplete="new-password">
                    <button type="button" class="eye-btn" id="togglePassword" aria-label="Lihat password">
                        <svg class="icon-svg" viewBox="0 0 24 24" id="eyeIcon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="form-hint" id="hint-password">Minimal 6 karakter.</div>
            </div>

            <!-- Step 4: Konfirmasi Password -->
            <div class="form-group" id="group-password2">
                <label class="form-label">Konfirmasi Password</label>
                <div class="input-wrap">
                    <input type="password" class="form-control with-eye" id="password2" placeholder="Ulangi password" autocomplete="new-password">
                    <button type="button" class="eye-btn" id="togglePassword2" aria-label="Lihat password">
                        <svg class="icon-svg" viewBox="0 0 24 24" id="eyeIcon2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="form-hint" id="hint-password2">Ulangi password yang sama.</div>
            </div>

            <!-- Persetujuan -->
            <div class="terms-group" id="group-terms">
                <label class="terms-box" for="agree">
                    <input type="checkbox" id="agree">
                    <span class="terms-text">
                        Saya menyetujui <a href="/syarat" target="_blank" rel="noopener">Syarat & Ketentuan</a> serta <a href="/ketentuan" target="_blank" rel="noopener">Kebijakan Privasi</a> AsyrofOTP.
                    </span>
                </label>
            </div>

            <button type="submit" class="btn" id="submitBtn" disabled>
                <span id="btnText">Daftar</span>
                <svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>

        <div class="auth-footer">
            Sudah punya akun? <a href="/login">Login di sini</a>
        </div>

        <div class="recaptcha-notice">
            Dilindungi oleh reCAPTCHA.
            <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy</a> ·
            <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms</a>
        </div>
    </div>
</div>

<script>
    const RECAPTCHA_SITE_KEY = '6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg';

    const form = document.getElementById('registerForm');
    const alertEl = document.getElementById('alert');
    const alertText = document.getElementById('alert-text');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');

    const usernameInput = document.getElementById('username');
    const nameInput = document.getElementById('name');
    const passwordInput = document.getElementById('password');
    const password2Input = document.getElementById('password2');
    const agreeCheckbox = document.getElementById('agree');

    const hintUsername = document.getElementById('hint-username');
    const hintName = document.getElementById('hint-name');
    const hintPassword = document.getElementById('hint-password');
    const hintPassword2 = document.getElementById('hint-password2');

    const groupUsername = document.getElementById('group-username');
    const groupName = document.getElementById('group-name');
    const groupPassword = document.getElementById('group-password');
    const groupPassword2 = document.getElementById('group-password2');
    const groupTerms = document.getElementById('group-terms');

    const stepDots = document.querySelectorAll('.step-dot');
    const stepLines = document.querySelectorAll('.step-line');

    /* ===== Alert ===== */
    function showAlert(message, type = 'error') {
        alertEl.className = 'alert show ' + type;
        alertText.textContent = message;
        alertEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    function hideAlert() { alertEl.classList.remove('show'); }

    /* ===== Toggle mata ===== */
    const EYE_OPEN = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const EYE_CLOSED = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    function setupEye(btnId, iconId, input) {
        const btn = document.getElementById(btnId);
        const icon = document.getElementById(iconId);
        let visible = false;
        btn.addEventListener('click', () => {
            visible = !visible;
            input.type = visible ? 'text' : 'password';
            icon.innerHTML = visible ? EYE_CLOSED : EYE_OPEN;
        });
    }
    setupEye('togglePassword', 'eyeIcon', passwordInput);
    setupEye('togglePassword2', 'eyeIcon2', password2Input);

    /* ===== Validasi ===== */
    const USERNAME_RE = /^[a-zA-Z0-9_]{3,20}$/;

    function validateUsername() {
        const v = usernameInput.value.trim();
        if (!v) {
            usernameInput.classList.remove('valid', 'invalid');
            hintUsername.className = 'form-hint';
            hintUsername.textContent = 'Huruf, angka, underscore. 3-20 karakter.';
            return false;
        }
        if (!USERNAME_RE.test(v)) {
            usernameInput.classList.add('invalid');
            usernameInput.classList.remove('valid');
            hintUsername.className = 'form-hint error';
            hintUsername.textContent = 'Username hanya boleh huruf, angka, underscore (3-20 karakter).';
            return false;
        }
        usernameInput.classList.add('valid');
        usernameInput.classList.remove('invalid');
        hintUsername.className = 'form-hint success';
        hintUsername.textContent = '✓ Format username OK';
        return true;
    }

    function validatePassword() {
        const v = passwordInput.value;
        if (!v) {
            passwordInput.classList.remove('valid', 'invalid');
            hintPassword.className = 'form-hint';
            hintPassword.textContent = 'Minimal 6 karakter.';
            return false;
        }
        if (v.length < 6) {
            passwordInput.classList.add('invalid');
            passwordInput.classList.remove('valid');
            hintPassword.className = 'form-hint error';
            hintPassword.textContent = 'Password minimal 6 karakter.';
            return false;
        }
        passwordInput.classList.add('valid');
        passwordInput.classList.remove('invalid');
        hintPassword.className = 'form-hint success';
        hintPassword.textContent = '✓ Password cukup kuat';
        return true;
    }

    function validatePassword2() {
        const v = password2Input.value;
        if (!v) {
            password2Input.classList.remove('valid', 'invalid');
            hintPassword2.className = 'form-hint';
            hintPassword2.textContent = 'Ulangi password yang sama.';
            return false;
        }
        if (v !== passwordInput.value) {
            password2Input.classList.add('invalid');
            password2Input.classList.remove('valid');
            hintPassword2.className = 'form-hint error';
            hintPassword2.textContent = 'Password tidak cocok.';
            return false;
        }
        password2Input.classList.add('valid');
        password2Input.classList.remove('invalid');
        hintPassword2.className = 'form-hint success';
        hintPassword2.textContent = '✓ Password cocok';
        return true;
    }

    /* ===== Reveal langkah berikutnya (TANPA auto-focus) ===== */
    function revealNext() {
        // Username valid → muncul Nama
        if (validateUsername() && !groupName.classList.contains('visible')) {
            groupName.classList.add('visible');
            updateSteps(2);
            return;
        }
        // Username valid → muncul Password
        if (groupName.classList.contains('visible') && !groupPassword.classList.contains('visible') && validateUsername()) {
            groupPassword.classList.add('visible');
            updateSteps(3);
            return;
        }
        // Password valid → muncul Konfirmasi
        if (groupPassword.classList.contains('visible') && !groupPassword2.classList.contains('visible') && validatePassword()) {
            groupPassword2.classList.add('visible');
            updateSteps(4);
            return;
        }
        // Konfirmasi valid → muncul Terms
        if (groupPassword2.classList.contains('visible') && !groupTerms.classList.contains('visible') && validatePassword2()) {
            groupTerms.classList.add('visible');
            updateSteps(5);
        }
        checkReady();
    }

    function checkReady() {
        const ok = validateUsername()
            && validatePassword()
            && validatePassword2()
            && agreeCheckbox.checked;
        submitBtn.disabled = !ok;
    }

    function updateSteps(activeStep) {
        stepDots.forEach(dot => {
            const s = Number(dot.dataset.step);
            dot.classList.toggle('active', s === activeStep);
            dot.classList.toggle('done', s < activeStep);
            if (s < activeStep) dot.textContent = '✓';
            else dot.textContent = String(s);
        });
        stepLines.forEach(line => {
            const l = Number(line.dataset.line);
            line.classList.toggle('done', l < activeStep);
        });
    }

    /* ===== Event: reveal saat user pindah field (blur) atau selesai ngetik ===== */
    usernameInput.addEventListener('blur', () => {
        if (validateUsername()) revealNext();
    });
    usernameInput.addEventListener('input', () => {
        if (validateUsername()) revealNext();
        else checkReady();
    });

    nameInput.addEventListener('blur', () => {
        if (groupName.classList.contains('visible')) revealNext();
    });
    nameInput.addEventListener('input', () => {
        // Nama opsional → begitu group visible, langsung reveal berikutnya
        if (groupName.classList.contains('visible')) revealNext();
    });

    passwordInput.addEventListener('input', () => {
        validatePassword();
        if (validatePassword()) revealNext();
        if (password2Input.value) validatePassword2();
        checkReady();
    });
    passwordInput.addEventListener('blur', () => {
        if (validatePassword()) revealNext();
    });

    password2Input.addEventListener('input', () => {
        validatePassword2();
        if (validatePassword2()) revealNext();
        checkReady();
    });
    password2Input.addEventListener('blur', () => {
        if (validatePassword2()) revealNext();
    });

    agreeCheckbox.addEventListener('change', () => {
        checkReady();
        if (agreeCheckbox.checked && validateUsername() && validatePassword() && validatePassword2()) {
            updateSteps(5);
        }
    });

    /* ===== reCAPTCHA helper ===== */
    function waitForRecaptcha() {
        return new Promise((resolve) => {
            if (window.grecaptcha && window.grecaptcha.execute) return resolve();
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (window.grecaptcha && window.grecaptcha.execute) {
                    clearInterval(timer);
                    resolve();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                    resolve();
                }
            }, 100);
        });
    }

    /* ===== Submit ===== */
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        if (!validateUsername()) { showAlert('Username tidak valid', 'error'); return; }
        if (!validatePassword()) { showAlert('Password minimal 6 karakter', 'error'); return; }
        if (!validatePassword2()) { showAlert('Konfirmasi password tidak cocok', 'error'); return; }
        if (!agreeCheckbox.checked) { showAlert('Kamu harus menyetujui Syarat & Ketentuan', 'error'); return; }

        const username = usernameInput.value.trim();
        const name = nameInput.value.trim();
        const password = passwordInput.value;

        submitBtn.disabled = true;
        btnText.textContent = 'Memproses...';
        btnIcon.outerHTML = '<div class="spinner" id="btnIcon"></div>';

        try {
            await waitForRecaptcha();

            if (!window.grecaptcha || !window.grecaptcha.execute) {
                throw new Error('Verifikasi keamanan gagal dimuat. Refresh halaman.');
            }

            const recaptchaToken = await new Promise((resolve, reject) => {
                grecaptcha.ready(() => {
                    grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'register' })
                        .then(resolve)
                        .catch(reject);
                });
                setTimeout(() => reject(new Error('Timeout verifikasi keamanan')), 10000);
            });

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username,
                    password,
                    name: name || undefined,
                    recaptcha_token: recaptchaToken,
                })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Registrasi gagal');

            updateSteps(6);
            showAlert('Registrasi berhasil! Mengalihkan ke login...', 'success');

            setTimeout(() => {
                window.location.href = '/login';
            }, 1200);

        } catch (err) {
            showAlert(err.message, 'error');
            submitBtn.disabled = false;
            btnText.textContent = 'Daftar';
            const oldIcon = document.getElementById('btnIcon');
            if (oldIcon) oldIcon.outerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        }
    });

    checkReady();
</script>

<script src="/js/cache.js"></script>
