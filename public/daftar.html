<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - AsyrofOTP</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --bg-light: #f8fafc;
            --border-dark: #0f172a;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 160vmax;
            height: 160vmax;
            transform: translate3d(-50%, -50%, 0);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(37, 99, 235, 0.06) 0deg 10deg,
                transparent 10deg 20deg
            );
            -webkit-mask-image: radial-gradient(circle, black 0%, transparent 60%);
            mask-image: radial-gradient(circle, black 0%, transparent 60%);
            animation: spin 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes spin {
            from { transform: translate3d(-50%, -50%, 0) rotate(0deg); }
            to { transform: translate3d(-50%, -50%, 0) rotate(360deg); }
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 900;
            font-size: 1.5rem;
        }

        .auth-logo .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
            border: 2.5px solid var(--border-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 1.8rem;
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            text-shadow: 1.5px 1.5px 0px rgba(15, 23, 42, 0.4);
            transform: rotate(-3deg);
        }

        .auth-logo span { color: var(--primary); }

        .auth-card {
            background: white;
            border: 2px solid var(--border-dark);
            border-radius: 16px;
            box-shadow: 6px 6px 0px rgba(15, 23, 42, 1);
            padding: 32px;
        }

        .auth-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .auth-card .subtitle {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: white;
            color: var(--text-dark);
            transition: all 0.2s;
            outline: none;
        }

        .form-control:focus {
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            transform: translate(-1px, -1px);
        }

        .form-control::placeholder { color: #94a3b8; }

        .form-hint {
            font-size: 0.78rem;
            color: var(--text-gray);
            margin-top: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: 2px solid var(--border-dark);
            box-shadow: 4px 4px 0px rgba(15, 23, 42, 1);
            transition: all 0.2s;
            background: var(--primary);
            color: white;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(15, 23, 42, 1);
            background: var(--primary-dark);
        }

        .btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px rgba(15, 23, 42, 1);
        }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            margin-bottom: 20px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .alert.show { display: flex; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }

        .alert .icon-svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="auth-container">
    <a href="/landing" class="auth-logo">
        <div class="logo-icon">A</div>
        <div>Asyrof<span>OTP</span></div>
    </a>

    <div class="auth-card">
        <h1>Buat Akun</h1>
        <p class="subtitle">Daftar gratis, langsung bisa pakai.</p>

        <div class="alert" id="alert">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span id="alert-text"></span>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="username" required autocomplete="username">
                <div class="form-hint">Huruf, angka, underscore. 3-20 karakter.</div>
            </div>
            <div class="form-group">
                <label class="form-label">Nama Tampilan (opsional)</label>
                <input type="text" class="form-control" id="name" placeholder="Nama kamu" autocomplete="name">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label">Konfirmasi Password</label>
                <input type="password" class="form-control" id="password2" placeholder="Ulangi password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar</span>
                <svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>

        <div class="auth-footer">
            Sudah punya akun? <a href="/login">Login di sini</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('registerForm');
    const alertEl = document.getElementById('alert');
    const alertText = document.getElementById('alert-text');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    function showAlert(message, type = 'error') {
        alertEl.className = 'alert show ' + type;
        alertText.textContent = message;
    }

    function hideAlert() {
        alertEl.classList.remove('show');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const username = document.getElementById('username').value.trim();
        const name = document.getElementById('name').value.trim();
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;

        if (password !== password2) {
            showAlert('Konfirmasi password tidak cocok', 'error');
            return;
        }

        if (password.length < 6) {
            showAlert('Password minimal 6 karakter', 'error');
            return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Memproses...';

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, name })
            });

            const data = await res.json();

            if (!res.ok) throw new Error(data.error || 'Registrasi gagal');

            showAlert('Registrasi berhasil! Mengalihkan ke login...', 'success');

            setTimeout(() => {
                window.location.href = '/login';
            }, 1200);

        } catch (err) {
            showAlert(err.message, 'error');
            submitBtn.disabled = false;
            btnText.textContent = 'Daftar';
        }
    });
</script>

</body>
</html>
