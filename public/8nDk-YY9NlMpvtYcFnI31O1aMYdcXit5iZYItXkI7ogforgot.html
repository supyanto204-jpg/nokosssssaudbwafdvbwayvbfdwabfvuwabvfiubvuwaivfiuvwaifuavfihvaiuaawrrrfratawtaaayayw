<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0a84ff">
<meta name="robots" content="noindex,nofollow">
<title>Lupa Password — AsyrofOTP</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/8nDk-YY9NlMpvtYcFnI31O1aMYdcXit5iZYItXkI7ogforgot.css">
<script>
(function(){
  var d=document.documentElement;
  try{
    var p=localStorage.getItem('asyrofotp_theme_pref');
    if(!p){var o=localStorage.getItem('asyrofotp_theme');p=(o==='light'||o==='dark')?o:'system';}
    d.setAttribute('data-theme-pref',p);
    d.setAttribute('data-theme',p==='system'
      ?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p);
  }catch(e){
    d.setAttribute('data-theme-pref','system');
    d.setAttribute('data-theme','light');
  }
})();
</script>
</head>
<body>

<a href="/login" class="back-btn" aria-label="Kembali ke login">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  <span>Login</span>
</a>

<button class="theme-btn" id="themeBtn" type="button" aria-label="Ganti tema">
  <svg class="ic i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  <svg class="ic i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="ic i-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
</button>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="brand-mark" aria-hidden="true">A</div>
    <div class="brand-txt">Asyrof<span>OTP</span></div>
  </div>

  <div class="auth-card">
    <div class="auth-head">
      <h1>Lupa Password</h1>
      <p>Masukkan email yang terdaftar. Kami akan kirim link reset password.</p>
    </div>

    <div class="alert" id="alert" role="alert" aria-live="polite">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="alertIcon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span id="alert-text"></span>
    </div>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <div class="input-box">
          <svg class="ic input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="email" placeholder="nama@email.com" required autofocus spellcheck="false" autocapitalize="off">
        </div>
      </div>

      <div class="status" id="statusRow" aria-live="polite">
        <div class="status-bar"><div class="status-bar-fill" id="statusBarFill"></div></div>
        <span class="status-label" id="statusLabel">Menunggu</span>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Kirim Link Reset</span>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="btnIcon" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>

    <div class="auth-foot">
      Ingat password? <a href="/login">Masuk</a>
    </div>
  </div>
</div>

<script src="/js/7XFJMaLsLgJHPqVWFyYlHCfmZXT5sFKdS91I5g9n2UQforgot.js" defer></script>
</body>
</html>
