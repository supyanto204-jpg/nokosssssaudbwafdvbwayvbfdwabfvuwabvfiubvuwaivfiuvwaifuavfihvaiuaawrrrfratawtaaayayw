<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>Login - AsyrofOTP</title>

    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">

    <!-- reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg" async defer></script>

    <!-- Dark mode: set sebelum render biar gak flicker -->
    <script>
        (function() {
            try {
                const saved = localStorage.getItem('asyrofotp_theme');
                let theme = saved;
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --border-dark: #0f172a;
            --danger: #ef4444;
            --success: #22c55e;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-light: #1e293b;
            --primary-dark: #2563eb;
            --text-dark: #f1f5f9;
            --text-gray: #94a3b8;
            --bg-light: #0f172a;
            --bg-card: #1e293b;
            --border-dark: #e2e8f0;
            --danger: #f87171;
            --success: #4ade80;
        }

        html, body { transition: background-color 0.3s ease, color 0.3s ease; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        input, textarea, select {
            -webkit-user-select: text;
            -moz-user-select: text;
            user-select: text;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 160vmax;
            height: 160vmax;
            transform: translate3d(-50%, -50%, 0);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(37, 99, 235, 0.06) 0deg 10deg,
                transparent 10deg 20deg
            );
            -webkit-mask-image: radial-gradient(circle, black 0%, transparent 60%);
            mask-image: radial-gradient(circle, black 0%, transparent 60%);
            animation: spin 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        [data-theme="dark"] body::before {
            background: repeating-conic-gradient(
                from 0deg,
                rgba(59, 130, 246, 0.08) 0deg 10deg,
                transparent 10deg 20deg
            );
        }

        @keyframes spin {
            from { transform: translate3d(-50%, -50%, 0) rotate(0deg); }
            to { transform: translate3d(-50%, -50%, 0) rotate(360deg); }
        }

        /* ===== Theme toggle ===== */
        .theme-toggle-fab {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 2px solid var(--border-dark);
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0 rgba(15, 23, 42, 1);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .theme-toggle-fab:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0 rgba(15, 23, 42, 1);
        }
        .theme-toggle-fab:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 rgba(15, 23, 42, 1);
        }
        .theme-toggle-fab .icon-svg { width: 20px; height: 20px; }
        .theme-toggle-fab .moon-icon { display: none; }
        [data-theme="dark"] .theme-toggle-fab .sun-icon { display: none; }
        [data-theme="dark"] .theme-toggle-fab .moon-icon { display: block; }

        .auth-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 900;
            font-size: 1.5rem;
        }

        .auth-logo .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
            border: 2.5px solid var(--border-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 1.8rem;
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            text-shadow: 1.5px 1.5px 0px rgba(15, 23, 42, 0.4);
            transform: rotate(-3deg);
        }

        .auth-logo span { color: var(--primary); }

        .auth-card {
            background: var(--bg-card);
            border: 2px solid var(--border-dark);
            border-radius: 16px;
            box-shadow: 6px 6px 0px rgba(15, 23, 42, 1);
            padding: 32px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        [data-theme="dark"] .auth-card {
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.5);
        }

        .auth-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .auth-card .subtitle {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg-card);
            color: var(--text-dark);
            transition: all 0.2s;
            outline: none;
        }

        .form-control.with-eye { padding-right: 46px; }

        .form-control:focus {
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            transform: translate(-1px, -1px);
        }

        .form-control::placeholder { color: var(--text-gray); opacity: 0.7; }

        .eye-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .eye-btn:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .eye-btn .icon-svg { width: 18px; height: 18px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: 2px solid var(--border-dark);
            box-shadow: 4px 4px 0px rgba(15, 23, 42, 1);
            transition: all 0.2s;
            background: var(--primary);
            color: white;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(15, 23, 42, 1);
            background: var(--primary-dark);
        }

        .btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px rgba(15, 23, 42, 1);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px rgba(15, 23, 42, 1);
            margin-bottom: 20px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .alert.show { display: flex; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }

        [data-theme="dark"] .alert.error { background: #450a0a; color: #fca5a5; }
        [data-theme="dark"] .alert.success { background: #052e16; color: #86efac; }

        .alert .icon-svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner { to { transform: rotate(360deg); } }

        .recaptcha-notice {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-gray);
            margin-top: 16px;
            line-height: 1.5;
        }

        .recaptcha-notice a {
            color: var(--primary);
            text-decoration: none;
        }

        .recaptcha-notice a:hover { text-decoration: underline; }

        /* ===== Anti-devtools overlay ===== */
        #securityOverlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: white;
            animation: fadeIn 0.2s ease;
        }

        #securityOverlay.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .sec-box {
            max-width: 400px;
            padding: 32px 24px;
            background: #1e293b;
            border: 2px solid #ef4444;
            border-radius: 16px;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.15), 8px 8px 0 rgba(239, 68, 68, 0.3);
        }

        .sec-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
        }

        .sec-icon .icon-svg { width: 36px; height: 36px; }

        .sec-box h2 {
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #fca5a5;
        }

        .sec-box p {
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .sec-box .btn-close-sec {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            background: #ef4444;
            color: white;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid #fff;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sec-box .btn-close-sec:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

<!-- Security overlay (devtools detected) -->
<div id="securityOverlay">
    <div class="sec-box">
        <div class="sec-icon">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 9.5-8 10-4.5-.5-8-5-8-10V6l8-4z"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h2>Akses Dibatasi</h2>
        <p>Kami mendeteksi Developer Tools terbuka. Untuk alasan keamanan, silakan tutup Developer Tools untuk melanjutkan.</p>
        <button class="btn-close-sec" id="secCloseBtn" type="button">
            <svg class="icon-svg" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Sudah Ditutup
        </button>
    </div>
</div>

<!-- Theme toggle -->
<button class="theme-toggle-fab" id="themeToggle" type="button" aria-label="Ganti tema">
    <svg class="icon-svg sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    <svg class="icon-svg moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="auth-container">
    <a href="/landing" class="auth-logo">
        <div class="logo-icon">A</div>
        <div>Asyrof<span>OTP</span></div>
    </a>

    <div class="auth-card">
        <h1>Masuk</h1>
        <p class="subtitle">Selamat datang kembali! Silakan login.</p>

        <div class="alert" id="alert">
            <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span id="alert-text"></span>
        </div>

        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="username" required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="input-wrap">
                    <input type="password" class="form-control with-eye" id="password" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="eye-btn" id="togglePassword" aria-label="Lihat password">
                        <svg class="icon-svg" viewBox="0 0 24 24" id="eyeIcon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Login</span>
                <svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </form>

        <div class="auth-footer">
            Belum punya akun? <a href="/daftar">Daftar sekarang</a>
        </div>

        <div class="recaptcha-notice">
            Dilindungi oleh reCAPTCHA.
            <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy</a> ·
            <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms</a>
        </div>
    </div>
</div>

<script src="/js/security.js"></script>
<script>
    const RECAPTCHA_SITE_KEY = '6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg';

    const form = document.getElementById('loginForm');
    const alertEl = document.getElementById('alert');
    const alertText = document.getElementById('alert-text');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    /* ===== Theme toggle ===== */
    document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('asyrofotp_theme', next); } catch (e) {}
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', next === 'dark' ? '#0f172a' : '#2563eb');
    });

    /* ===== Toggle mata password ===== */
    const EYE_OPEN = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const EYE_CLOSED = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    let passwordVisible = false;
    togglePassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        eyeIcon.innerHTML = passwordVisible ? EYE_CLOSED : EYE_OPEN;
    });

    /* ===== Alert ===== */
    function showAlert(message, type = 'error') {
        alertEl.className = 'alert show ' + type;
        alertText.textContent = message;
    }
    function hideAlert() { alertEl.classList.remove('show'); }

    /* ===== reCAPTCHA ===== */
    function waitForRecaptcha() {
        return new Promise((resolve) => {
            if (window.grecaptcha && window.grecaptcha.execute) return resolve();
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (window.grecaptcha && window.grecaptcha.execute) {
                    clearInterval(timer);
                    resolve();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                    resolve();
                }
            }, 100);
        });
    }

    /* ===== Submit ===== */
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const username = document.getElementById('username').value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showAlert('Username dan password wajib diisi', 'error');
            return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Memproses...';
        btnIcon.outerHTML = '<div class="spinner" id="btnIcon"></div>';

        try {
            await waitForRecaptcha();
            if (!window.grecaptcha || !window.grecaptcha.execute) {
                throw new Error('Verifikasi keamanan gagal dimuat. Refresh halaman.');
            }

            const recaptchaToken = await new Promise((resolve, reject) => {
                grecaptcha.ready(() => {
                    grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'login' })
                        .then(resolve)
                        .catch(reject);
                });
                setTimeout(() => reject(new Error('Timeout verifikasi keamanan')), 10000);
            });

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({ username, password, recaptcha_token: recaptchaToken })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login gagal');

            localStorage.setItem('access_token', data.session.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));

            showAlert('Login berhasil! Mengalihkan...', 'success');
            setTimeout(() => { window.location.href = '/dashboard'; }, 800);

        } catch (err) {
            showAlert(err.message, 'error');
            submitBtn.disabled = false;
            btnText.textContent = 'Login';
            const oldIcon = document.getElementById('btnIcon');
            if (oldIcon) oldIcon.outerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        }
    });
</script>

<script src="/js/cache.js"></script>

</body>
</html>
