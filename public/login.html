<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Login - AsyrofOTP</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/core.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/login.css">

    <!-- 🔒 SECURITY + Fake DevTools error screen -->
    <script>
        (function() {
            const saved = localStorage.getItem('asyrofotp_theme');
            const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();

        if (window.top !== window.self) {
            try { window.top.location = window.self.location; } catch (e) {}
            document.documentElement.innerHTML = '<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;"><div style="text-align:center;"><h1>⛔ Dilarang</h1><p>Halaman ini tidak boleh di-embed.</p></div></body>';
        }

        // DevTools lock — tampilkan fake 500 error page
        (function() {
            const LOCK_FLAG = 'asyrof_devtools_lock';
            if (sessionStorage.getItem(LOCK_FLAG) === '1') {
                document.documentElement.innerHTML = '<head></head><body></body>';
                function showFakeError() {
                    document.body.innerHTML = `
                        <div class="fake-error-page">
                            <div class="fake-error-inner">
                                <div class="fake-error-logo">
                                    <div class="fake-logo-icon">A</div>
                                    <div class="fake-logo-text">Asyrof<span>OTP</span></div>
                                </div>
                                <div class="fake-error-code">500</div>
                                <h1 class="fake-error-title">Internal Server Error</h1>
                                <p class="fake-error-desc">
                                    Terjadi kesalahan pada server kami. Tim teknis telah menerima laporan otomatis
                                    dan sedang menangani masalah ini.
                                </p>
                                <div class="fake-error-meta">
                                    <div class="fake-error-meta-row">
                                        <span class="label">Reference ID:</span>
                                        <span class="value">ERR-${Date.now().toString(36).toUpperCase()}-${Math.random().toString(36).slice(2, 8).toUpperCase()}</span>
                                    </div>
                                    <div class="fake-error-meta-row">
                                        <span class="label">Timestamp:</span>
                                        <span class="value">${new Date().toISOString()}</span>
                                    </div>
                                    <div class="fake-error-meta-row">
                                        <span class="label">Server:</span>
                                        <span class="value">prod-id-01</span>
                                    </div>
                                </div>
                                <div class="fake-error-actions">
                                    <button type="button" class="fake-btn fake-btn-primary" id="fakeRetryBtn">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                                        Coba Lagi
                                    </button>
                                    <a href="/" class="fake-btn fake-btn-secondary">Kembali ke Beranda</a>
                                </div>
                                <div class="fake-error-hint">
                                    Kode kesalahan: <code>ASYROF_500_INTERNAL</code>
                                </div>
                            </div>
                            <div class="fake-error-grid" aria-hidden="true"></div>
                        </div>
                        <style>
                            html, body {
                                margin: 0; padding: 0;
                                background: #f8fafc;
                                min-height: 100vh;
                                font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                                color: #0f172a;
                                -webkit-font-smoothing: antialiased;
                            }
                            [data-theme="dark"] html, [data-theme="dark"] body {
                                background: #0f172a;
                                color: #f1f5f9;
                            }
                            .fake-error-page {
                                min-height: 100vh;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                padding: 24px;
                                position: relative;
                                overflow: hidden;
                            }
                            .fake-error-grid {
                                position: absolute;
                                inset: 0;
                                background-image:
                                    linear-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px),
                                    linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px);
                                background-size: 48px 48px;
                                -webkit-mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 70%);
                                mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 70%);
                                pointer-events: none;
                                z-index: 0;
                            }
                            .fake-error-inner {
                                position: relative;
                                z-index: 1;
                                max-width: 520px;
                                width: 100%;
                                text-align: center;
                                background: #ffffff;
                                border: 1px solid rgba(15, 23, 42, 0.08);
                                border-radius: 20px;
                                padding: 48px 40px 36px;
                                box-shadow:
                                    0 1px 2px rgba(15, 23, 42, 0.04),
                                    0 8px 32px rgba(15, 23, 42, 0.08),
                                    0 24px 64px rgba(15, 23, 42, 0.06);
                            }
                            [data-theme="dark"] .fake-error-inner {
                                background: #1e293b;
                                border-color: rgba(255, 255, 255, 0.06);
                                box-shadow:
                                    0 1px 2px rgba(0, 0, 0, 0.4),
                                    0 8px 32px rgba(0, 0, 0, 0.5),
                                    0 24px 64px rgba(0, 0, 0, 0.4);
                            }
                            .fake-error-logo {
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                gap: 10px;
                                margin-bottom: 28px;
                                font-weight: 900;
                                font-size: 1.1rem;
                                color: inherit;
                            }
                            .fake-error-logo .fake-logo-icon {
                                width: 36px;
                                height: 36px;
                                border-radius: 10px;
                                background: linear-gradient(135deg, #3b82f6, #1d4ed8);
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                color: white;
                                font-weight: 900;
                                font-size: 1.3rem;
                                box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
                            }
                            .fake-error-logo .fake-logo-text span { color: #2563eb; }
                            [data-theme="dark"] .fake-error-logo .fake-logo-text span { color: #3b82f6; }
                            .fake-error-code {
                                font-size: 6rem;
                                font-weight: 900;
                                line-height: 1;
                                background: linear-gradient(135deg, #ef4444, #dc2626, #b91c1c);
                                background-size: 200% 200%;
                                -webkit-background-clip: text;
                                background-clip: text;
                                -webkit-text-fill-color: transparent;
                                letter-spacing: -0.06em;
                                margin-bottom: 8px;
                                font-family: 'JetBrains Mono', monospace;
                                animation: errorGlow 3s ease-in-out infinite;
                            }
                            @keyframes errorGlow {
                                0%, 100% { background-position: 0% 50%; }
                                50% { background-position: 100% 50%; }
                            }
                            .fake-error-title {
                                font-size: 1.5rem;
                                font-weight: 800;
                                margin: 0 0 12px;
                                letter-spacing: -0.02em;
                                color: inherit;
                            }
                            .fake-error-desc {
                                font-size: 0.92rem;
                                line-height: 1.7;
                                color: #64748b;
                                margin: 0 0 24px;
                            }
                            [data-theme="dark"] .fake-error-desc { color: #94a3b8; }
                            .fake-error-meta {
                                text-align: left;
                                background: #f8fafc;
                                border: 1px solid rgba(15, 23, 42, 0.06);
                                border-radius: 12px;
                                padding: 14px 16px;
                                margin-bottom: 24px;
                                font-family: 'JetBrains Mono', monospace;
                                font-size: 0.75rem;
                            }
                            [data-theme="dark"] .fake-error-meta {
                                background: #0f172a;
                                border-color: rgba(255, 255, 255, 0.06);
                            }
                            .fake-error-meta-row {
                                display: flex;
                                justify-content: space-between;
                                gap: 12px;
                                padding: 5px 0;
                            }
                            .fake-error-meta-row:not(:last-child) {
                                border-bottom: 1px dashed rgba(15, 23, 42, 0.08);
                            }
                            [data-theme="dark"] .fake-error-meta-row:not(:last-child) {
                                border-bottom-color: rgba(255, 255, 255, 0.06);
                            }
                            .fake-error-meta-row .label {
                                color: #94a3b8;
                                font-weight: 600;
                                flex-shrink: 0;
                            }
                            .fake-error-meta-row .value {
                                color: #0f172a;
                                font-weight: 700;
                                word-break: break-all;
                                text-align: right;
                            }
                            [data-theme="dark"] .fake-error-meta-row .value { color: #f1f5f9; }
                            .fake-error-actions {
                                display: flex;
                                gap: 10px;
                                justify-content: center;
                                flex-wrap: wrap;
                                margin-bottom: 20px;
                            }
                            .fake-btn {
                                display: inline-flex;
                                align-items: center;
                                justify-content: center;
                                gap: 8px;
                                padding: 11px 22px;
                                border-radius: 10px;
                                font-family: inherit;
                                font-weight: 700;
                                font-size: 0.88rem;
                                cursor: pointer;
                                border: none;
                                text-decoration: none;
                                transition: all 0.2s;
                                -webkit-tap-highlight-color: transparent;
                            }
                            .fake-btn-primary {
                                background: #2563eb;
                                color: white;
                                box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
                            }
                            .fake-btn-primary:hover {
                                background: #1d4ed8;
                                transform: translateY(-1px);
                                box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
                            }
                            .fake-btn-secondary {
                                background: transparent;
                                color: #64748b;
                                border: 1px solid rgba(15, 23, 42, 0.1);
                            }
                            [data-theme="dark"] .fake-btn-secondary {
                                color: #94a3b8;
                                border-color: rgba(255, 255, 255, 0.1);
                            }
                            .fake-btn-secondary:hover {
                                background: rgba(15, 23, 42, 0.04);
                                color: #0f172a;
                            }
                            [data-theme="dark"] .fake-btn-secondary:hover {
                                background: rgba(255, 255, 255, 0.04);
                                color: #f1f5f9;
                            }
                            .fake-error-hint {
                                font-size: 0.72rem;
                                color: #94a3b8;
                                font-family: 'JetBrains Mono', monospace;
                                padding-top: 16px;
                                border-top: 1px dashed rgba(15, 23, 42, 0.08);
                            }
                            [data-theme="dark"] .fake-error-hint { border-top-color: rgba(255, 255, 255, 0.06); }
                            .fake-error-hint code {
                                background: rgba(15, 23, 42, 0.06);
                                padding: 2px 8px;
                                border-radius: 4px;
                                font-weight: 700;
                                color: #475569;
                            }
                            [data-theme="dark"] .fake-error-hint code {
                                background: rgba(255, 255, 255, 0.06);
                                color: #cbd5e1;
                            }
                        </style>
                    `;
                    document.getElementById('fakeRetryBtn')?.addEventListener('click', () => {
                        sessionStorage.removeItem('asyrof_devtools_lock');
                        window.location.reload();
                    });

                    // Polling: kalau DevTools ditutup → reload
                    const THRESHOLD = 200;
                    setInterval(() => {
                        const wDiff = window.outerWidth - window.innerWidth;
                        const hDiff = window.outerHeight - window.innerHeight;
                        if (wDiff <= THRESHOLD && hDiff <= THRESHOLD) {
                            sessionStorage.removeItem('asyrof_devtools_lock');
                            window.location.reload();
                        }
                    }, 500);
                }
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showFakeError);
                else showFakeError();
                throw new Error('__DEVTOOLS_LOCK__');
            }
        })();
    </script>

    <script src="https://www.google.com/recaptcha/api.js?render=6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg" async defer></script>
</head>
<body>

<!-- ===== AURORA BG (WebGL) ===== -->
<div class="aurora-bg" id="auroraBg" aria-hidden="true"></div>

<!-- ===== Theme toggle ===== -->
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Ganti tema">
    <svg class="icon-svg sun-icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg class="icon-svg moon-icon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
</button>

<div class="auth-container">

    <!-- ===== STICKER LOGO (draggable + peel) ===== -->
    <div class="sticker-wrapper" id="stickerWrapper">
        <!-- SVG filters -->
        <svg width="0" height="0" aria-hidden="true">
            <defs>
                <filter id="pointLight">
                    <feGaussianBlur stdDeviation="1" result="blur" />
                    <feSpecularLighting result="spec" in="blur" specularExponent="100" specularConstant="0.1" lightingColor="white">
                        <fePointLight id="pointLightRef" x="100" y="100" z="300" />
                    </feSpecularLighting>
                    <feComposite in="spec" in2="SourceGraphic" result="lit" />
                    <feComposite in="lit" in2="SourceAlpha" operator="in" />
                </filter>
                <filter id="pointLightFlipped">
                    <feGaussianBlur stdDeviation="10" result="blur" />
                    <feSpecularLighting result="spec" in="blur" specularExponent="100" specularConstant="0.7" lightingColor="white">
                        <fePointLight id="pointLightFlippedRef" x="100" y="100" z="300" />
                    </feSpecularLighting>
                    <feComposite in="spec" in2="SourceGraphic" result="lit" />
                    <feComposite in="lit" in2="SourceAlpha" operator="in" />
                </filter>
                <filter id="dropShadow">
                    <feDropShadow dx="2" dy="4" stdDeviation="3" floodColor="black" floodOpacity="0.35" />
                </filter>
                <filter id="expandAndFill">
                    <feOffset dx="0" dy="0" in="SourceAlpha" result="shape" />
                    <feFlood floodColor="rgb(200,200,200)" result="flood" />
                    <feComposite operator="in" in="flood" in2="shape" />
                </filter>
            </defs>
        </svg>

        <a href="/" class="sticker-link" id="stickerLink" aria-label="AsyrofOTP Home">
            <div class="sticker-container" id="stickerContainer">
                <div class="sticker-main">
                    <div class="sticker-lighting">
                        <img
                            src="/icon-180.png"
                            alt="AsyrofOTP"
                            class="sticker-image"
                            draggable="false"
                            onerror="this.src='/icon.svg'; this.onerror=null;"
                        >
                    </div>
                </div>
                <div class="flap">
                    <div class="flap-lighting">
                        <img
                            src="/icon-180.png"
                            alt=""
                            class="flap-image"
                            draggable="false"
                            onerror="this.src='/icon.svg'; this.onerror=null;"
                        >
                    </div>
                </div>
            </div>
        </a>
    </div>

    <!-- Logo text (di bawah sticker) -->
    <div class="logo-text-wrap">
        <div class="logo-text">Asyrof<span>OTP</span></div>
    </div>

    <!-- BORDER GLOW CARD -->
    <div class="border-glow-card" id="loginCard">
        <span class="edge-light"></span>
        <div class="border-glow-inner">
            <div class="auth-card-content">
                <h1>Masuk</h1>
                <p class="subtitle">Selamat datang kembali! Silakan login.</p>

                <div class="alert" id="alert" role="alert">
                    <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    <span id="alert-text"></span>
                </div>

                <form id="loginForm" autocomplete="on" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="username" required autocomplete="username" autofocus spellcheck="false">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-wrap">
                            <input type="password" class="form-control with-eye" id="password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="eye-btn" id="togglePassword" aria-label="Lihat password" tabindex="-1">
                                <svg class="icon-svg" viewBox="0 0 24 24" id="eyeIcon">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="status-row" id="statusRow" aria-hidden="true">
                        <span class="status-mark" id="statusMark" data-status="pending">
                            <svg class="status-mark__glyph" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                                <circle class="status-mark__track" cx="12" cy="12" r="9" transform="rotate(-90 12 12)"/>
                                <circle class="status-mark__ring" cx="12" cy="12" r="9" transform="rotate(-90 12 12)"/>
                                <path class="status-mark__check" d="M7.5 12.25 10.5 15.25 16.75 8.75" pathLength="1"/>
                                <path class="status-mark__cross" d="M8.5 8.5 15.5 15.5M15.5 8.5 8.5 15.5" pathLength="1"/>
                            </svg>
                            <span class="status-mark__label">
                                <span id="statusLabel">Menunggu</span>
                                <span class="status-mark__strike" aria-hidden="true"></span>
                            </span>
                        </span>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        <span id="btnText">Login</span>
                        <svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </form>

                <div class="auth-footer">
                    Belum punya akun? <a href="/daftar">Daftar sekarang</a>
                </div>

                <div class="recaptcha-notice">
                    Dilindungi oleh reCAPTCHA.
                    <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Privacy</a> ·
                    <a href="https://policies.google.com/terms" target="_blank" rel="noopener">Terms</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/login.js" defer></script>

</body>
</html>
