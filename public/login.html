    <!-- 🔒 SECURITY: Anti-FOUC + Anti-iframe + DevTools lock (jalan paling awal) -->
    <script>
        // Anti-FOUC: apply theme sebelum render
        (function() {
            const saved = localStorage.getItem('asyrofotp_theme');
            const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();

        // Anti-iframe (clickjacking protection)
        if (window.top !== window.self) {
            try { window.top.location = window.self.location; } catch (e) {}
            document.documentElement.innerHTML = '<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;"><div style="text-align:center;"><h1>⛔ Dilarang</h1><p>Halaman ini tidak boleh di-embed.</p></div></body>';
        }

        // 🔒 DevTools LOCK SCREEN — jalan sebelum DOM render
        (function() {
            const LOCK_FLAG = 'asyrof_devtools_lock';

            if (sessionStorage.getItem(LOCK_FLAG) === '1') {
                // Sembunyikan semua konten sejak awal
                document.documentElement.innerHTML = '<head></head><body></body>';

                function showLockScreen() {
                    document.body.innerHTML = `
                        <div id="devtoolsLockScreen">
                            <div class="lock-box">
                                <div class="lock-icon">🔒</div>
                                <h2>Akses Dibatasi</h2>
                                <p>Developer Tools terdeteksi. Konten telah dihapus sementara demi keamanan.</p>
                                <p class="lock-hint">Tutup Developer Tools untuk memuat ulang halaman secara normal.</p>
                            </div>
                        </div>
                        <style>
                            #devtoolsLockScreen {
                                position: fixed;
                                inset: 0;
                                background: #0f172a;
                                z-index: 2147483647;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                padding: 24px;
                                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                                user-select: none;
                                -webkit-user-select: none;
                                overflow: hidden;
                                margin: 0;
                            }
                            #devtoolsLockScreen .lock-box {
                                background: #1e293b;
                                border: 3px solid #475569;
                                border-radius: 20px;
                                padding: 40px 32px;
                                max-width: 440px;
                                text-align: center;
                                box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.5);
                            }
                            #devtoolsLockScreen .lock-icon {
                                font-size: 3rem;
                                margin-bottom: 16px;
                                line-height: 1;
                            }
                            #devtoolsLockScreen h2 {
                                color: #dc2626;
                                font-size: 1.5rem;
                                font-weight: 800;
                                margin: 0 0 12px;
                                font-family: inherit;
                            }
                            #devtoolsLockScreen p {
                                color: #cbd5e1;
                                font-size: 0.95rem;
                                line-height: 1.6;
                                margin: 0 0 8px;
                            }
                            #devtoolsLockScreen .lock-hint {
                                color: #64748b;
                                font-size: 0.78rem;
                                font-family: ui-monospace, monospace;
                                margin-top: 20px;
                                padding-top: 16px;
                                border-top: 1px dashed #334155;
                            }
                            body { margin: 0; background: #0f172a; }
                        </style>
                    `;

                    // Polling: kalau DevTools ditutup → clear flag → reload
                    const THRESHOLD = 200;
                    setInterval(() => {
                        const wDiff = window.outerWidth - window.innerWidth;
                        const hDiff = window.outerHeight - window.innerHeight;
                        const stillOpen = wDiff > THRESHOLD || hDiff > THRESHOLD;

                        if (!stillOpen) {
                            sessionStorage.removeItem(LOCK_FLAG);
                            window.location.reload();
                        }
                    }, 500);
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', showLockScreen);
                } else {
                    showLockScreen();
                }

                throw new Error('__DEVTOOLS_LOCK__');
            }
        })();
    </script>

    <script src="https://www.google.com/recaptcha/api.js?render=6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg" async defer></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --primary-dark: #1d4ed8;
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --bg-light: #f8fafc;
            --bg-card: #ffffff;
            --border-dark: #0f172a;
            --danger: #ef4444;
            --success: #22c55e;
            --shadow-color: rgba(15, 23, 42, 1);
            color-scheme: light;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-light: #1e3a8a;
            --primary-dark: #2563eb;
            --text-dark: #f1f5f9;
            --text-gray: #94a3b8;
            --bg-light: #0f172a;
            --bg-card: #1e293b;
            --border-dark: #334155;
            --danger: #f87171;
            --success: #4ade80;
            --shadow-color: rgba(0, 0, 0, 0.6);
            color-scheme: dark;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 🔒 ANTI-LEAK */
        body,
        body * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        input, textarea, select, code, [contenteditable="true"] {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }

        img, svg {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            user-drag: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 160vmax;
            height: 160vmax;
            transform: translate3d(-50%, -50%, 0);
            background: repeating-conic-gradient(
                from 0deg,
                rgba(37, 99, 235, 0.06) 0deg 10deg,
                transparent 10deg 20deg
            );
            -webkit-mask-image: radial-gradient(circle, black 0%, transparent 60%);
            mask-image: radial-gradient(circle, black 0%, transparent 60%);
            animation: spin 60s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        [data-theme="dark"] body::before {
            background: repeating-conic-gradient(
                from 0deg,
                rgba(59, 130, 246, 0.08) 0deg 10deg,
                transparent 10deg 20deg
            );
        }

        @keyframes spin {
            from { transform: translate3d(-50%, -50%, 0) rotate(0deg); }
            to { transform: translate3d(-50%, -50%, 0) rotate(360deg); }
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 900;
            font-size: 1.5rem;
        }

        .auth-logo .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, var(--primary-dark));
            border: 2.5px solid var(--border-dark);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 1.8rem;
            box-shadow: 3px 3px 0px var(--shadow-color);
            text-shadow: 1.5px 1.5px 0px rgba(15, 23, 42, 0.4);
            transform: rotate(-3deg);
            user-select: none;
            -webkit-user-select: none;
        }

        .auth-logo span { color: var(--primary); }

        .auth-card {
            background: var(--bg-card);
            border: 2px solid var(--border-dark);
            border-radius: 16px;
            box-shadow: 6px 6px 0px var(--shadow-color);
            padding: 32px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .auth-card h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .auth-card .subtitle {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .form-group { margin-bottom: 18px; }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            background: var(--bg-card);
            color: var(--text-dark);
            transition: all 0.2s;
            outline: none;
        }

        .form-control.with-eye { padding-right: 46px; }

        .form-control:focus {
            box-shadow: 3px 3px 0px var(--shadow-color);
            transform: translate(-1px, -1px);
        }

        .form-control::placeholder { color: var(--text-gray); opacity: 0.6; }

        .eye-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .eye-btn:hover {
            background: var(--bg-light);
            color: var(--text-dark);
        }

        .eye-btn .icon-svg { width: 18px; height: 18px; pointer-events: none; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: 2px solid var(--border-dark);
            box-shadow: 4px 4px 0px var(--shadow-color);
            transition: all 0.2s;
            background: var(--primary);
            color: white;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--shadow-color);
            background: var(--primary-dark);
        }

        .btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px var(--shadow-color);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .icon-svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        .auth-footer a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover { text-decoration: underline; }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border-dark);
            box-shadow: 3px 3px 0px var(--shadow-color);
            margin-bottom: 20px;
            display: none;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .alert.show { display: flex; }
        .alert.error { background: #fee2e2; color: #991b1b; }
        .alert.success { background: #dcfce7; color: #166534; }

        [data-theme="dark"] .alert.error { background: #450a0a; color: #fecaca; }
        [data-theme="dark"] .alert.success { background: #052e16; color: #bbf7d0; }

        .alert .icon-svg { width: 20px; height: 20px; flex-shrink: 0; margin-top: 2px; }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spinner 0.6s linear infinite;
        }

        @keyframes spinner { to { transform: rotate(360deg); } }

        .recaptcha-notice {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-gray);
            margin-top: 16px;
            line-height: 1.5;
        }

        .recaptcha-notice a {
            color: var(--primary);
            text-decoration: none;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-dark);
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 3px 0px var(--shadow-color);
            transition: all 0.2s;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .theme-toggle:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px var(--shadow-color);
        }

        .theme-toggle:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--shadow-color);
        }

        .theme-toggle .icon-svg { width: 20px; height: 20px; }
        .theme-toggle .moon-icon { display: none; }
        [data-theme="dark"] .theme-toggle .sun-icon { display: none; }
        [data-theme="dark"] .theme-toggle .moon-icon { display: block; }

        /* ===== ANTI-PRINT ===== */
        @media print {
            body {
                display: none !important;
                visibility: hidden !important;
            }
            body::after {
                content: '⚠️ Halaman ini tidak dapat dicetak / disimpan.';
                display: block !important;
                visibility: visible !important;
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: system-ui, sans-serif;
                font-size: 1.2rem;
                color: #dc2626;
                text-align: center;
                padding: 20px;
                background: white;
            }
        }

        /* ===== REDUCED MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<script>
    /* ============================================
       SECURITY HARDENING — Frontend
       ============================================ */

    // 1. Console warning
    (function() {
        const style = 'color:#dc2626;font-size:20px;font-weight:900;';
        const styleSub = 'color:#64748b;font-size:12px;';
        try {
            console.log('%c⚠️ STOP!', style);
            console.log('%cIni fitur browser untuk developer. Kalau ada yang menyuruh kamu paste sesuatu di sini, itu SCAM.', styleSub);
            console.log('%cJangan pernah share password, token, atau data pribadi di sini.', styleSub);
        } catch (e) {}
    })();

    // 2. Disable right-click, F12, Ctrl+Shift+I/J/C, Ctrl+U/S/P
    (function() {
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('keydown', (e) => {
            const k = e.key;
            if (k === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && ['I','J','C','i','j','c'].includes(k)) {
                e.preventDefault(); return false;
            }
            if (e.ctrlKey && ['U','u','S','s','P','p'].includes(k)) {
                e.preventDefault(); return false;
            }
        }, true);
    })();

    // 3. Deteksi DevTools → wipe DOM + auto reload
    (function() {
        const LOCK_FLAG = 'asyrof_devtools_lock';
        const THRESHOLD_WIDTH = 200;
        const THRESHOLD_HEIGHT = 200;

        function shouldSkipDetection() {
            if (navigator.maxTouchPoints > 0 && window.innerWidth < 1024) return true;
            if (window.innerWidth < 600) return true;
            return false;
        }

        function isDevToolsOpen() {
            if (shouldSkipDetection()) return false;
            const widthDiff = window.outerWidth - window.innerWidth;
            const heightDiff = window.outerHeight - window.innerHeight;
            return widthDiff > THRESHOLD_WIDTH || heightDiff > THRESHOLD_HEIGHT;
        }

        function startDetection() {
            setInterval(() => {
                if (isDevToolsOpen()) {
                    try { sessionStorage.setItem(LOCK_FLAG, '1'); } catch (e) {}
                    document.body.innerHTML = '';
                    window.location.reload();
                }
            }, 500);
        }

        // Kalau flag lock ada → script di <head> yang handle, skip detection
        if (sessionStorage.getItem(LOCK_FLAG) === '1') {
            return;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startDetection);
        } else {
            startDetection();
        }
    })();

    // 4. Anti-copy di area non-input
    (function() {
        document.addEventListener('copy', (e) => {
            const target = e.target;
            if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
                return;
            }
            e.preventDefault();
        });

        document.addEventListener('cut', (e) => {
            const target = e.target;
            if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
                return;
            }
            e.preventDefault();
        });
    })();

    /* ============================================
       AUTO REDIRECT — kalau udah login
       ============================================ */
    (async function checkAlreadyLoggedIn() {
        const token = localStorage.getItem('access_token');
        if (!token) return;

        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            const res = await fetch('/api/user', {
                headers: { 'Authorization': `Bearer ${token}` },
                signal: controller.signal,
            });
            clearTimeout(timeout);

            if (res.ok) {
                window.location.replace('/dashboard');
                return;
            }

            if (res.status === 401 || res.status === 403) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user');
            }
        } catch (err) {
            // silent
        }
    })();

    /* ============================================
       THEME TOGGLE
       ============================================ */
    (function initTheme() {
        const btn = document.getElementById('themeToggle');
        if (!btn) return;
        btn.addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('asyrofotp_theme', next);
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', next === 'dark' ? '#0f172a' : '#2563eb');
        });
    })();

    /* ============================================
       LOGIN LOGIC
       ============================================ */
    const RECAPTCHA_SITE_KEY = '6LdLK9wtAAAAAEkN8PXmZ732lfM-YOSSCF1F7pbg';

    const form = document.getElementById('loginForm');
    const alertEl = document.getElementById('alert');
    const alertText = document.getElementById('alert-text');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    /* Toggle mata */
    const EYE_OPEN = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    const EYE_CLOSED = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;

    let passwordVisible = false;
    togglePassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        passwordInput.type = passwordVisible ? 'text' : 'password';
        eyeIcon.innerHTML = passwordVisible ? EYE_CLOSED : EYE_OPEN;
    });

    function showAlert(message, type = 'error') {
        alertEl.className = 'alert show ' + type;
        alertText.textContent = message;
    }
    function hideAlert() { alertEl.classList.remove('show'); }

    function waitForRecaptcha() {
        return new Promise((resolve) => {
            if (window.grecaptcha && window.grecaptcha.execute) return resolve();
            let attempts = 0;
            const timer = setInterval(() => {
                attempts++;
                if (window.grecaptcha && window.grecaptcha.execute) {
                    clearInterval(timer);
                    resolve();
                } else if (attempts >= 50) {
                    clearInterval(timer);
                    resolve();
                }
            }, 100);
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const username = document.getElementById('username').value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
            showAlert('Username dan password wajib diisi', 'error');
            return;
        }

        submitBtn.disabled = true;
        btnText.textContent = 'Memproses...';
        btnIcon.outerHTML = '<div class="spinner" id="btnIcon"></div>';

        try {
            await waitForRecaptcha();

            if (!window.grecaptcha || !window.grecaptcha.execute) {
                throw new Error('Verifikasi keamanan gagal dimuat. Refresh halaman.');
            }

            const recaptchaToken = await new Promise((resolve, reject) => {
                grecaptcha.ready(() => {
                    grecaptcha.execute(RECAPTCHA_SITE_KEY, { action: 'login' })
                        .then(resolve)
                        .catch(reject);
                });
                setTimeout(() => reject(new Error('Timeout verifikasi keamanan')), 10000);
            });

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, recaptcha_token: recaptchaToken })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login gagal');

            localStorage.setItem('access_token', data.session.access_token);
            localStorage.setItem('user', JSON.stringify(data.user));

            showAlert('Login berhasil! Mengalihkan...', 'success');
            setTimeout(() => { window.location.replace('/dashboard'); }, 800);

        } catch (err) {
            showAlert(err.message, 'error');
            submitBtn.disabled = false;
            btnText.textContent = 'Login';
            const oldIcon = document.getElementById('btnIcon');
            if (oldIcon) oldIcon.outerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" id="btnIcon"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        }
    });
</script>

<script src="/js/cache.js"></script>

</body>
