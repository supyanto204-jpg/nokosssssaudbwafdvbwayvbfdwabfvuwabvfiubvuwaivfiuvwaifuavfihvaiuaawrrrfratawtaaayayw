<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset Password — AsyrofOTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/mFEqzUF0hOS3v42C14HLpqtLZS5fqqjVOYdEwi5WCqUlogin.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-brand">
    <div class="brand-mark" aria-hidden="true">A</div>
    <div class="brand-txt">Asyrof<span>OTP</span></div>
  </div>

  <div class="auth-card">
    <div class="auth-head">
      <h1>Password Baru</h1>
      <p>Masukkan password baru untuk akunmu.</p>
    </div>

    <div class="alert" id="alert" role="alert">
      <span id="alert-text"></span>
    </div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label class="label" for="password">Password Baru</label>
        <div class="input-box">
          <svg class="ic input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Minimal 6 karakter" required autocomplete="new-password">
        </div>
      </div>

      <div class="field">
        <label class="label" for="password2">Konfirmasi Password</label>
        <div class="input-box">
          <svg class="ic input-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password2" placeholder="Ulangi password baru" required autocomplete="new-password">
        </div>
      </div>

      <div class="status" id="statusRow">
        <div class="status-bar"><div class="status-bar-fill" id="statusBarFill"></div></div>
        <span class="status-label" id="statusLabel">Menunggu</span>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span id="btnText">Simpan Password</span>
      </button>
    </form>

    <div class="auth-foot">
      <a href="/login">Kembali ke Login</a>
    </div>
  </div>
</div>

<script>
(function(){
  var form = document.getElementById('resetForm');
  var passIn = document.getElementById('password');
  var pass2In = document.getElementById('password2');
  var btn = document.getElementById('submitBtn');
  var btnText = document.getElementById('btnText');
  var alertEl = document.getElementById('alert');
  var alertText = document.getElementById('alert-text');
  var statusRow = document.getElementById('statusRow');
  var statusLabel = document.getElementById('statusLabel');
  var statusFill = document.getElementById('statusBarFill');

  // Ambil token dari URL (?token=xxxx)
  var urlParams = new URLSearchParams(window.location.search);
  var token = urlParams.get('token');

  if(!token){
    alertEl.className = 'alert show error';
    alertText.textContent = 'Token tidak valid atau tidak ditemukan.';
    form.style.display = 'none';
    return;
  }

  function showAlert(msg, type){
    alertEl.className = 'alert show ' + (type || 'error');
    alertText.textContent = msg;
  }
  function hideAlert(){ alertEl.className = 'alert'; }
  function setStatus(state, label){
    statusRow.dataset.state = state;
    if(label) statusLabel.textContent = label;
    if(state === 'pending') statusRow.classList.remove('visible');
    else statusRow.classList.add('visible');
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    hideAlert();

    var p1 = passIn.value;
    var p2 = pass2In.value;

    if(p1.length < 6){
      showAlert('Password minimal 6 karakter.', 'error');
      return;
    }
    if(p1 !== p2){
      showAlert('Konfirmasi password tidak cocok.', 'error');
      return;
    }

    btn.disabled = true;
    btnText.textContent = 'Menyimpan...';
    setStatus('running', 'Memproses...');
    if(statusFill) statusFill.style.width = '50%';

    try {
      var res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, new_password: p1 })
      });

      var data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Gagal mereset password');

      setStatus('done', 'Berhasil!');
      if(statusFill) statusFill.style.width = '100%';
      showAlert('Password berhasil diubah. Silakan login kembali.', 'success');
      
      btnText.textContent = 'Berhasil';
      
      // Redirect ke login setelah 2 detik
      setTimeout(function(){ window.location.href = '/login'; }, 2000);

    } catch(err) {
      setStatus('failed', 'Gagal');
      if(statusFill) statusFill.style.width = '100%';
      showAlert(err.message, 'error');
      
      btn.disabled = false;
      btnText.textContent = 'Simpan Password';
    }
  });
})();
</script>
</body>
</html>
